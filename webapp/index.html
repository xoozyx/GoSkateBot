<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GoSkateBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe9ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  img {
    -webkit-user-drag: none;
    user-select: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ==== Zoom-режим для Flatmode: приближаем игровой экран устройства,
     обрезая D-pad/Start/A/B снизу и часть рамки по бокам — см. превью от пользователя.
     Возвращается к обычному виду при выходе на Mainscreen. ==== */
  #app.zoomed .device {
    transform: scale(1.22) translateY(2%);
  }

  .device {
    transition: transform 0.5s ease;
  }

  /* ==== Экран загрузки с логотипом ==== */
  #logoScreen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.6s ease;
  }

  #logoScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #logoScreen img {
    width: min(94vw, 90vh, 460px);
    aspect-ratio: 208 / 306;
    height: auto;
    image-rendering: pixelated;
  }

  /* ==== Анимация перехода между экранами ==== */
  #changeOverlay {
    position: absolute;
    inset: 0;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  #changeOverlay.visible {
    opacity: 1;
  }

  #changeOverlay img {
    width: min(94vw, 90vh, 460px);
    aspect-ratio: 208 / 306;
    height: auto;
    image-rendering: pixelated;
    transition: transform 0.5s ease;
  }

  #app.zoomed #changeOverlay img {
    transform: scale(1.22) translateY(2%);
  }

  /* ==== Общий контейнер-"устройство" (общий для Mainscreen и Flatmode) ==== */
  .device {
    position: relative;
    width: min(94vw, 90vh, 460px);
    aspect-ratio: 208 / 306;
    image-rendering: pixelated;
  }

  /* ==== Background — отдельный слой, самый нижний z-index (под Mainscreen/
     Flatmode), но всегда видимый (не внутри .screen, поэтому не пропадает
     во время заставки) и с тем же zoom-переходом, что и остальное. ==== */
  #consoleBackground {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #consoleBackground img {
    width: min(94vw, 90vh, 460px);
    aspect-ratio: 208 / 306;
    height: auto;
    image-rendering: pixelated;
    transition: transform 0.5s ease;
  }

  #app.zoomed #consoleBackground img {
    transform: scale(1.22) translateY(2%);
  }

  /* ==== Рамка консоли (Cover + D-pad/Start/A/B) — поверх Mainscreen/Flatmode
     (z-index 10), того же размера и с тем же zoom-переходом, что и .device —
     кнопки внутри остаются кликабельны и на увеличенной позиции, т.к. CSS
     transform двигает хитбокс вместе с картинкой (весь #consoleFrame — один
     трансформируемый блок, а не каждый ребёнок по отдельности, иначе
     сломались бы точные размеры/позиции самих кнопок). ==== */
  #consoleFrame {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #consoleFrameInner {
    position: relative;
    width: min(94vw, 90vh, 460px);
    aspect-ratio: 208 / 306;
    transition: transform 0.5s ease;
  }

  #app.zoomed #consoleFrameInner {
    transform: scale(1.22) translateY(2%);
  }

  #consoleFrame img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* ==== Cover + D-pad/Start/A/B — единственная копия внутри #consoleFrame,
     всегда видна поверх всего (включая заставку и переход между экранами). ==== */
  #consoleCover {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    image-rendering: pixelated;
  }

  #consoleCover img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .console-btn-visual {
    position: absolute;
    inset: 0;
    pointer-events: none;
    image-rendering: pixelated;
    z-index: 31;
  }

  .console-btn-visual img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .console-btn {
    position: absolute;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 32;
    pointer-events: auto;
  }

  .console-btn-a, .console-btn-b {
    width: 12.02%;
    aspect-ratio: 25 / 25;
  }

  .console-btn-a { left: 64.42%; top: 82.35%; }
  .console-btn-b { left: 78.37%; top: 78.43%; }

  .console-btn-up, .console-btn-down, .console-btn-left, .console-btn-right {
    width: 9.62%;
    aspect-ratio: 20 / 20;
  }

  .console-btn-up { left: 19.23%; top: 77.12%; }
  .console-btn-down { left: 19.23%; top: 89.54%; }
  .console-btn-left { left: 10.10%; top: 83.33%; }
  .console-btn-right { left: 28.37%; top: 83.33%; }

  .console-btn-start {
    left: 43.27%;
    top: 84.64%;
    width: 17.31%;
    aspect-ratio: 36 / 12;
  }

  /* ==== Экраны (Mainscreen / Flatmode) — переключаются плавным fade ==== */
  .screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Некоторые элементы внутри экрана (например #tricklistInner) намеренно
     включают pointer-events:auto сами по себе — это перекрывает унаследованное
     от родителя значение none. Пока экран неактивен, он должен быть полностью
     некликабельным целиком, независимо от таких точечных исключений внутри —
     иначе невидимый неактивный экран может перехватывать клики, предназначенные
     активному экрану под/над ним (баг: Ramp Easy/Hard/Air Tricks в Mainscreen
     частично перекрывались невидимым, но всё ещё кликабельным #tricklistInner
     из экрана Flatmode). */
  .screen:not(.active) * {
    pointer-events: none !important;
  }

  /* ==== Mainscreen: кнопки выбора режима ==== */
  .mode-button {
    position: absolute;
    border: none;
    padding: 0;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
    image-rendering: pixelated;
  }

  .mode-button img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .mode-button.enabled {
    cursor: pointer;
    transition: transform 0.08s ease;
  }

  .mode-button.enabled:active {
    transform: scale(0.93);
  }

  .mode-button.disabled {
    cursor: default;
    /* Отключаем сам hit-area от событий мыши, а не только клика — иначе
       соседний :active-селектор (.fullcanvas-hitarea:active + .mode-button-visual)
       всё равно сработает при нажатии и картинка "мигнёт" затемнением,
       даже если обработчик клика ничего не делает. */
    pointer-events: none;
  }

  /* "SELECT MODE" — декоративная анимация на весь канвас, под кнопками выбора режима. */
  #selectModeLabel {
    position: absolute;
    inset: 0;
    pointer-events: none;
    image-rendering: pixelated;
    z-index: 0;
  }

  #selectModeLabel img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* Декоративный слой на весь канвас устройства (208x306, прозрачный фон) —
     арт уже спозиционирован художником внутри PNG, поэтому просто накрываем
     им весь .device. Сам по себе некликабелен — иначе прозрачные области
     перекрывали бы клики по кнопкам Ramp/Street под ним. */
  .mode-button-visual {
    position: absolute;
    inset: 0;
    pointer-events: none;
    image-rendering: pixelated;
    z-index: 1;
    transition: opacity 0.08s ease;
  }

  .mode-button-visual img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* Кнопка идёт перед визуальным слоем в разметке (порядок в DOM не влияет
     на z-index, который задан явно) — благодаря этому при нажатии на
     невидимую кликабельную область можно подсветить видимую картинку рядом
     через сиблинг-селектор, без лишнего JS. Не scale (сжался бы весь канвас
     208x306 целиком, а не только видимая кнопка) — вместо этого лёгкое
     затемнение, как обратная связь на нажатие. */
  .fullcanvas-hitarea:active + .mode-button-visual {
    opacity: 0.8;
  }

  /* Реальная кликабельная область для fullcanvas-кнопки — размер и позиция
     подобраны по фактическим непрозрачным пикселям в PNG (см. bbox альфа-канала),
     а не по всему канвасу, иначе кнопка перекрывала бы клики по остальным. */
  .fullcanvas-hitarea {
    z-index: 2;
  }

  /* Используется, чтобы отключить клики по Ramp/Street, пока открыт выбор
     сложности Flat (и наоборот) — сами кнопки остаются на месте и видны,
     просто притемнены тенью (.difficulty-picker-shadow) поверх них. */
  .mode-picker-hidden {
    pointer-events: none !important;
  }

  /* Кнопка, которая открыла выбор сложности, поднимается выше тени — остаётся
     полностью видна, в отличие от двух других (Ramp/Street), которые тень затемняет. */
  .above-picker-shadow {
    z-index: 3;
  }

  /* Тень поверх недоступных сейчас кнопок режима (например Ramp/Street, пока
     открыт выбор сложности Flat) — сама не даёт тени двигаться/растягиваться,
     просто полноразмерный PNG поверх них, но под Easy/Hard. */
  .difficulty-picker-shadow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    image-rendering: pixelated;
    z-index: 1;
  }

  .difficulty-picker-shadow img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* Кнопка "назад в главное меню", показывается вместо кликабельности у
     самой кнопки режима, пока открыт выбор сложности Flat/Ramp. */
  #mainscreenQuit, #mainscreenQuitVisual {
    display: none;
  }

  #mainscreenQuit.visible, #mainscreenQuitVisual.visible {
    display: block;
  }

  #mainscreenQuit {
    left: 78.37%;
    top: 8.5%;
    width: 9.13%;
    height: 8.82%;
    z-index: 3;
  }

  #mainscreenQuitVisual {
    z-index: 3;
  }

  /* Кнопка Options на Mainscreen занимает тот же угол, что и Quit/Back —
     они взаимоисключающие: Options видна на обычном главном экране, прячется,
     когда открыт пикер Flat/Ramp/Street (тогда там же появляется Quit), и
     появляется обратно при закрытии пикера (см. openDifficultyPicker/
     closeAllDifficultyPickers). Класс тот же .visible-принцип, что у Quit,
     просто по умолчанию видна, а не наоборот. */
  #mainscreenOptions, #mainscreenOptionsVisual {
    display: block;
  }

  #mainscreenOptions.picker-open, #mainscreenOptionsVisual.picker-open {
    display: none;
  }

  #mainscreenOptions {
    left: 78.37%;
    top: 8.5%;
    width: 9.13%;
    height: 8.82%;
    z-index: 3;
  }

  #mainscreenOptionsVisual {
    z-index: 3;
  }

  /* ==== Options screen: Quit (тот же верхний правый угол, что и везде),
     плюс две "карусельных" кнопки громкости — картинка сама показывает
     текущий уровень (0-5), никакого отдельного индикатора не нужно. ==== */
  #optionsQuit {
    left: 78.37%;
    top: 8.5%;
    width: 9.13%;
    height: 8.82%;
  }

  #optionsAnimation {
    position: absolute;
    inset: 0;
    pointer-events: none;
    image-rendering: pixelated;
    z-index: 0;
  }

  #optionsAnimation img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #optionsMusicVolume {
    left: 29.81%;
    top: 18.95%;
    width: 40.38%;
    height: 7.84%;
  }

  #optionsSoundVolume {
    left: 29.81%;
    top: 27.12%;
    width: 40.38%;
    height: 7.84%;
  }

  #optionsBackground {
    left: 29.81%;
    top: 35.29%;
    width: 40.38%;
    height: 7.84%;
  }

  #modeFlat {
    left: 30.29%;
    top: 15.69%;
    width: 39.42%;
    height: 16.67%;
  }

  #modeRamp {
    left: 30.29%;
    top: 34.64%;
    width: 39.42%;
    height: 13.4%;
  }

  #modeStreet {
    left: 30.29%;
    top: 47.06%;
    width: 39.42%;
    height: 16.67%;
  }

  /* Выбор сложности для Flat — показывается вместо Ramp/Street после нажатия
     Flat, занимает ту же область, где раньше была кнопка Flat. */
  #flatDifficultyPicker {
    display: none;
  }

  #flatDifficultyPicker.visible {
    display: block;
  }

  /* Переключатели-радио сверху пикера Flat: слева — выбор количества игроков
     (Single/Versus), справа — выбор режима (Arcade/Classic). Как и Old
     School/Body Varial ниже — это ОДНА кнопка на каждый выбор, картинка
     просто подменяется между двумя состояниями (а не две раздельные кнопки),
     bbox взят из альфа-канала самих PNG (обе картинки состояния занимают
     один и тот же прямоугольник).

     z-index: кнопка режима (Flat/Ramp/Street), которая открыла свой пикер,
     поднимается через .above-picker-shadow до z-index:3 (см. выше), чтобы
     остаться полностью видимой (не притемняться тенью, как две другие). Но
     эта же картинка (Button_mainmenu_flat/ramp/street.png) визуально
     перекрывала бы Single/Versus и Arcade/Classic под ней — они по
     умолчанию на z-index:1 (.mode-button-visual). Поднимаем все 6 таких
     переключателей (Flat/Ramp/Street × Player Select/Mode Select) выше — и
     кликабельную область, и картинку — чтобы они всегда были и видны, и
     кликабельны поверх картинки режима. */
  #togglePlayerSelect, #togglePlayerSelectVisual,
  #toggleModeSelect, #toggleModeSelectVisual,
  #toggleRampPlayerSelect, #toggleRampPlayerSelectVisual,
  #toggleRampModeSelect, #toggleRampModeSelectVisual,
  #toggleStreetPlayerSelect, #toggleStreetPlayerSelectVisual,
  #toggleStreetModeSelect, #toggleStreetModeSelectVisual {
    z-index: 4;
  }

  #togglePlayerSelect {
    left: 30.29%;
    top: 12.42%;
    width: 19.23%;
    height: 7.84%;
  }

  #toggleModeSelect {
    left: 50%;
    top: 12.42%;
    width: 20.19%;
    height: 7.84%;
  }

  #modeFlatEasy {
    left: 30.29%;
    top: 32.68%;
    width: 20.19%;
    height: 8.82%;
  }

  #modeFlatHard {
    left: 50.96%;
    top: 32.68%;
    width: 20.19%;
    height: 8.82%;
  }

  #toggleOldschool {
    left: 30.29%;
    top: 41.83%;
    width: 40.87%;
    height: 7.84%;
  }

  #toggleBodyvarial {
    left: 30.29%;
    top: 50%;
    width: 43.27%;
    height: 7.84%;
  }

  /* Выбор сложности для Ramp — показывается вместо Flat/Street после нажатия
     Ramp, сразу под кнопкой Ramp. */
  #rampDifficultyPicker {
    display: none;
  }

  #rampDifficultyPicker.visible {
    display: block;
  }

  /* Переключатели-радио сверху пикера Ramp — тот же принцип, что у Flat
     (см. #togglePlayerSelect/#toggleModeSelect выше): одна кнопка на выбор,
     картинка подменяется между двумя состояниями. */
  #toggleRampPlayerSelect {
    left: 30.29%;
    top: 28.1%;
    width: 19.23%;
    height: 7.84%;
  }

  #toggleRampModeSelect {
    left: 50%;
    top: 28.1%;
    width: 20.19%;
    height: 7.84%;
  }

  #modeRampEasy {
    left: 30.29%;
    top: 48.37%;
    width: 20.19%;
    height: 8.82%;
  }

  #modeRampHard {
    left: 50.96%;
    top: 48.37%;
    width: 20.19%;
    height: 8.82%;
  }

  #toggleAirtricks {
    left: 30.29%;
    top: 57.52%;
    width: 39.42%;
    height: 7.84%;
  }

  /* Выбор сложности/препятствий для Street — показывается вместо Flat/Ramp
     после нажатия Street. Позиции подобраны по фактическим непрозрачным
     пикселям в PNG, как и у Flat/Ramp (см. bbox альфа-канала). */
  #streetDifficultyPicker {
    display: none;
  }

  #streetDifficultyPicker.visible {
    display: block;
  }

  #toggleStreetOldschool {
    left: 30.29%;
    top: 8.82%;
    width: 40.87%;
    height: 7.84%;
  }

  #toggleStreetInsandouts {
    left: 30.29%;
    top: 16.99%;
    width: 45.19%;
    height: 7.84%;
  }

  /* Сетка препятствий 3x2: Manual Box/Kicker/Curb сверху, Stairs/Ledge/Rail снизу. */
  #obstacleManualbox {
    left: 30.29%;
    top: 25.16%;
    width: 12.5%;
    height: 8.5%;
  }

  #obstacleKicker {
    left: 43.27%;
    top: 25.16%;
    width: 12.5%;
    height: 8.5%;
  }

  #obstacleCurb {
    left: 56.25%;
    top: 25.16%;
    width: 12.5%;
    height: 8.5%;
  }

  #obstacleStairs {
    left: 30.29%;
    top: 33.99%;
    width: 12.5%;
    height: 8.5%;
  }

  #obstacleLedge {
    left: 43.27%;
    top: 33.99%;
    width: 12.5%;
    height: 8.5%;
  }

  #obstacleRail {
    left: 56.25%;
    top: 33.99%;
    width: 12.5%;
    height: 8.5%;
  }

  #modeStreetEasy {
    left: 30.29%;
    top: 42.81%;
    width: 20.19%;
    height: 8.82%;
  }

  #modeStreetHard {
    left: 50.96%;
    top: 42.81%;
    width: 20.19%;
    height: 8.82%;
  }

  /* Переключатели-радио внизу пикера Street — тот же принцип, что у Flat/Ramp. */
  #toggleStreetPlayerSelect {
    left: 30.29%;
    top: 64.05%;
    width: 19.23%;
    height: 7.84%;
  }

  #toggleStreetModeSelect {
    left: 50%;
    top: 64.05%;
    width: 20.19%;
    height: 7.84%;
  }

  /* ==== Речевой пузырь с результатом (Flatmode) ==== */
  #bubble {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 5;
  }

  #bubble img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  #bubble.active {
    opacity: 1;
  }

  #result {
    position: absolute;
    left: 22.1%;
    right: 22.6%;
    top: 9.8%;
    height: 10.8%;
    box-sizing: border-box;
    padding: 0 2%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    line-height: 1.3;
    color: #ffffff;
    word-wrap: break-word;

  /* Прокручиваемый лог трюков — теперь фон на весь канвас 208x306 (сама панель
     нарисована художником внутри PNG, прозрачность вокруг неё). Свёрнутое и
     развёрнутое состояния — это два разных полноразмерных PNG; сам #tricklist
     больше не двигается и не меняет размер. Кроссфейд между ними — через
     ::before с отдельной картинкой развёрнутого состояния и переходом opacity,
     чтобы переключение не выглядело резким "миганием". */
  #tricklist {
    position: absolute;
    inset: 0;
    background-image: url('images/Tricklist_background.png?v=20260716a');
    background-size: 100% 100%;
    image-rendering: pixelated;

       по остальным элементам (Start Game и т.д.) там, где она прозрачна. */
    pointer-events: none;
  }

  #tricklist::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('images/Tricklist_background_expanded.png?v=20260716a');
    background-size: 100% 100%;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 0.3s ease;

<script>
  // ==== Борьба с кэшированием внутри Telegram WebView ====
  // У всех картинок (в HTML-разметке и в CSS background-image) в самом
  // index.html прописана версия в query-параметре — ?v=ASSET_VERSION.
  // Меняйте ASSET_VERSION при каждом обновлении картинок, и WebView будет
  // вынужден запросить их заново, т.к. для него это буквально другой URL.
  // (Раньше здесь был ещё и авто-reload самого index.html через location.replace,
  // но он мог провоцировать двойной запуск скрипта и ломать переключение экранов —
  // убрали, версии картинок для GitHub Pages достаточно.)
  const ASSET_VERSION = encodeURIComponent(document.lastModified);

  // На всякий случай отключаем Service Worker, если он когда-либо был
  // зарегистрирован для этого источника (он мог бы отдавать старые файлы из кэша).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    }).catch(() => {});
  }

  // Инициализация Telegram Web App SDK (если открыто внутри Telegram)
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ==== Звук: всё генерируется процедурно через Web Audio API (осцилляторы),
  // никаких аудиофайлов не требуется — ретро/8-bit бипы под стиль пиксельного
  // устройства. Один AudioContext на всё приложение, создаётся лениво (сам
  // конструктор может молча "заснуть" до жеста пользователя — это нормально,
  // см. unlock() ниже). ====
  const SoundEngine = (function () {
    const STORAGE_KEY_MUTED = 'goskate_muted';
    const STORAGE_KEY_MUSIC_VOLUME = 'goskate_musicVolume';
    const STORAGE_KEY_SFX_VOLUME = 'goskate_sfxVolume';
    const BASE_MUSIC_GAIN = 0.18; // громкость на максимальном уровне карусели (5)
    const BASE_SFX_GAIN = 0.35;
    let ctx = null;
    let sfxGain = null;
    let musicGain = null;
    let unlocked = false;
    // Раньше глушилось отдельной кнопкой ♪/✕ на Mainscreen — её убрали (она
    // визуально накладывалась на скруглённый угол консоли, плюс полностью
    // дублировала Options: уровень 0 там уже даёт настоящую тишину). muted
    // сохранён внутри на будущее, но больше не читается из localStorage и не
    // включается нигде в интерфейсе — если оставить старое сохранённое "было
    // заглушено", человек с прошлой версии навсегда остался бы без звука без
    // единой кнопки это исправить, раз в Options такого переключателя нет.
    let muted = false;
    try {
      localStorage.removeItem(STORAGE_KEY_MUTED);
    } catch (e) { /* не критично */ }

    // ==== Громкость музыки/эффектов — "карусель" 0..5 с экрана Options
    // (Button_options_music_N.png/Button_options_sound_N.png). Отдельно от
    // общего mute (♪/✕) — тот глушит всё разом, это же задаёт относительный
    // уровень каждого канала. 3 из 5 — разумное значение по умолчанию для
    // тех, кто ни разу не открывал Options. ====
    let musicVolumeLevel = 3;
    let sfxVolumeLevel = 3;
    try {
      const mv = parseInt(localStorage.getItem(STORAGE_KEY_MUSIC_VOLUME), 10);
      if (mv >= 0 && mv <= 5) musicVolumeLevel = mv;
      const sv = parseInt(localStorage.getItem(STORAGE_KEY_SFX_VOLUME), 10);
      if (sv >= 0 && sv <= 5) sfxVolumeLevel = sv;
    } catch (e) { /* не критично — останутся значения по умолчанию */ }

    let musicWanted = false; // хотим ли играть музыку прямо сейчас (мы на Mainscreen)
    let musicGeneration = 0; // растёт при каждом stop/start — отменяет "протухшие" setTimeout из прошлого цикла
    let musicTimer = null;
    let musicTempoMul = 1; // >1 = медленнее (см. setSlowdown, эффект "Game Over")
    let musicPitchMul = 1; // <1 = ниже по тону — вместе с tempoMul имитирует "теряющую питание пластинку"

    let noiseBuffer = null; // общий шумовой буфер для snare/hihat в барабанной партии (см. ниже)

    // Применяет текущие уровни громкости к уже созданным gain-узлам —
    // вызывается и сразу после их создания в ensureContext(), и при каждом
    // изменении уровня (см. setMusicVolume/setSfxVolume), чтобы звук менялся
    // "на лету", без пересоздания контекста.
    function applyVolumeGains() {
      if (musicGain) musicGain.gain.value = BASE_MUSIC_GAIN * (musicVolumeLevel / 5);
      if (sfxGain) sfxGain.gain.value = BASE_SFX_GAIN * (sfxVolumeLevel / 5);
    }

    function ensureContext() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      sfxGain = ctx.createGain();
      sfxGain.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.connect(ctx.destination);
      applyVolumeGains(); // выставляет реальные .value для обоих узлов по сохранённым уровням

      // Один короткий буфер белого шума на весь плеер — переиспользуется для
      // каждого удара snare/hihat (создавать новый на каждый удар незачем).
      const len = Math.floor(ctx.sampleRate * 0.3);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      return ctx;
    }

    // Вызывается на самый первый клик/тап по странице (см. подписку в самом
    // низу этого модуля) — до жеста пользователя большинство браузеров не
    // дадут звуку заиграть вообще, поэтому здесь и "будим" AudioContext, и
    // запускаем музыку, если она уже должна была играть (см. musicWanted).
    function unlock() {
      const c = ensureContext();
      if (!c) return;
      if (c.state === 'suspended') c.resume().catch(() => {});
      unlocked = true;
      if (musicWanted && !muted) startMusicLoop();
    }

    function playToneAt(time, { freq, duration, type = 'square', gain = 0.5, glideTo = null, gainNode = sfxGain }) {
      const c = ctx;
      if (!c || !gainNode) return;
      const osc = c.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, time + duration);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(gain, time + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      osc.connect(g);
      g.connect(gainNode);
      osc.start(time);
      osc.stop(time + duration + 0.03);
    }

    function playTone(opts) {
      const c = ensureContext();
      if (!c || muted) return;
      if (c.state === 'suspended') return; // ещё не разблокирован жестом — молчим, не ломаем автоплей-политику
      playToneAt(c.currentTime, opts);
    }

    // ==== Звуковые эффекты на кнопки — короткие процедурные "бипы", разные
    // по смыслу нажатия (см. SOUND_BUTTON_OVERRIDES ниже, где кнопки
    // сопоставляются с одним из этих вариантов). ====
    const EFFECTS = {
      click() {
        playTone({ freq: 740, duration: 0.045, type: 'square', gain: 0.35 });
      },
      toggle() {
        playTone({ freq: 480, duration: 0.05, type: 'square', gain: 0.32 });
      },
      confirm() {
        const c = ensureContext();
        if (!c || muted || c.state === 'suspended') return;
        const t0 = c.currentTime;
        playToneAt(t0, { freq: 523, duration: 0.06, type: 'square', gain: 0.4 });
        playToneAt(t0 + 0.06, { freq: 784, duration: 0.09, type: 'square', gain: 0.42 });
      },
      back() {
        playTone({ freq: 320, duration: 0.09, type: 'square', gain: 0.3, glideTo: 170 });
      },
      landed() {
        const c = ensureContext();
        if (!c || muted || c.state === 'suspended') return;
        const t0 = c.currentTime;
        [523, 659, 784, 1047].forEach((freq, i) => {
          playToneAt(t0 + i * 0.055, { freq, duration: 0.09, type: 'square', gain: 0.4 });
        });
      },
      failed() {
        playTone({ freq: 220, duration: 0.2, type: 'sawtooth', gain: 0.32, glideTo: 100 });
      },

      // ==== Кнопки консоли (D-pad/Start/A/B) — имитация "геймпада": у
      // крестовины короткий сухой "тик" почти без тона (разная высота на
      // каждое направление — тактильная подсказка, куда только что нажали,
      // как в олдскульных меню), у A/B по классике NES-раскладки — A ярче и
      // выше (основное/подтверждающее действие), B тусклее и ниже
      // (второстепенное/отмена), у Start — короткий восходящий мотив из двух
      // нот, отдельно от остальных ("системная" кнопка, а не просто ввод). ====
      dpadUp() {
        playTone({ freq: 880, duration: 0.03, type: 'square', gain: 0.26 });
      },
      dpadDown() {
        playTone({ freq: 660, duration: 0.03, type: 'square', gain: 0.26 });
      },
      dpadLeft() {
        playTone({ freq: 740, duration: 0.03, type: 'square', gain: 0.26 });
      },
      dpadRight() {
        playTone({ freq: 988, duration: 0.03, type: 'square', gain: 0.26 });
      },
      buttonA() {
        playTone({ freq: 1046.5, duration: 0.06, type: 'square', gain: 0.4 });
      },
      buttonB() {
        playTone({ freq: 392, duration: 0.07, type: 'square', gain: 0.34, glideTo: 330 });
      },
      buttonStart() {
        const c = ensureContext();
        if (!c || muted || c.state === 'suspended') return;
        const t0 = c.currentTime;
        playToneAt(t0, { freq: 659.25, duration: 0.05, type: 'square', gain: 0.38 });
        playToneAt(t0 + 0.05, { freq: 987.77, duration: 0.09, type: 'square', gain: 0.42 });
      },
    };

    function play(kind) {
      const fn = EFFECTS[kind] || EFFECTS.click;
      fn();
    }

    // ==== Фоновая музыка — два оригинальных процедурных трека (не
    // воспроизведение существующих песен/саундтреков, только позаимствован
    // общий жанровый вайб, который никому не принадлежит): "punk" — быстрый
    // сёрф-панк (играет во время игры), "hiphop" — неторопливый грувовый
    // хип-хоп бит (играет на главном экране). Планируется через
    // ctx.currentTime (а не Date.now/setTimeout напрямую), чтобы не "плыть"
    // по времени — setTimeout используется только чтобы проснуться и
    // запланировать СЛЕДУЮЩИЙ круг заранее, сам звук всегда стоит на точных
    // отметках Web Audio. ====

    // E-A-D-G — те же ноты, что и струны гитары/баса, звучат "правильно"
    // вместе в панк/сёрф-роке и хип-хопе.
    const NOTE = {
      E2: 82.41, F2s: 92.5, G2: 98.0, A2: 110.0,
      B2: 123.47, C3: 130.81, D3: 146.83, E3: 164.81,
      Fs3: 185.0, G3: 196.0, A3: 220.0, B3: 246.94,
      C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0,
    };

    const TRACKS = {
      // Сёрф-панк: без затяжного вступления — сразу быстрый нисходящий
      // "сёрф"-пробег одиночными нотами (первые 8 шагов), затем перегруженные
      // пауэр-корды на чугающем панк-ритме (вторые 8 шагов). Пилообразная
      // волна — "гитарная" грязь вместо чистого тона.
      punk: {
        stepDuration: 0.128,
        swing: 0,
        waveType: 'sawtooth',
        noteDurationMul: 0.75,
        pattern: [
          { freq: NOTE.E4, chord: false, drum: 'k' },
          { freq: NOTE.D4, chord: false, drum: 'h' },
          { freq: NOTE.C4, chord: false, drum: 's' },
          { freq: NOTE.B3, chord: false, drum: 'h' },
          { freq: NOTE.A3, chord: false, drum: 'k' },
          { freq: NOTE.G3, chord: false, drum: 'h' },
          { freq: NOTE.Fs3, chord: false, drum: 's' },
          { freq: NOTE.E3, chord: false, drum: 'h' },
          { freq: NOTE.E2, chord: true, drum: 'k' },
          { freq: NOTE.E2, chord: true, drum: 'h' },
          { freq: NOTE.A2, chord: true, drum: 's' },
          { freq: NOTE.A2, chord: true, drum: 'h' },
          { freq: NOTE.G2, chord: true, drum: 'k' },
          { freq: NOTE.G2, chord: true, drum: 'h' },
          { freq: NOTE.D3, chord: true, drum: 's' },
          { freq: null, chord: true, drum: 'h' },
        ],
      },
      // Хип-хоп: медленный грувовый boom-bap. Три слоя грува поверх обычного
      // паттерна: (1) более заметный swing (нечётные восьмые сильно сдвинуты
      // назад — тот самый "ленивый" хип-хоп-покачивание), (2) ghost-ноты —
      // тихие "призрачные" снэйры/хэты между основными ударами (drumVel < 1,
      // см. playDrumStep), классический приём для живого грува вместо
      // механичного метронома, (3) бас держится дольше шага (noteDurationMul
      // > 1, слегка "наезжает" на следующую долю) — сустейн вместо коротких
      // тычков, из-за этого линия баса звучит текучей, а не отрывистой.
      hiphop: {
        stepDuration: 0.195, // чуть быстрее прежнего — больше энергии, но покачивание (swing) держит грув
        swing: 0.38,
        waveType: 'sine',
        gainMul: 1.6, // главный экран — сделали заметно громче по просьбе
        noteDurationMul: 1.7,
        pattern: [
          { freq: NOTE.E2, chord: false, drum: 'k' },
          { freq: null, chord: false, drum: 'h', drumVel: 0.55 },
          { freq: null, chord: false, drum: 'h', drumVel: 0.3 },
          { freq: NOTE.E2, chord: false, drum: 'k', stab: NOTE.E4 },
          { freq: null, chord: false, drum: 's' },
          { freq: null, chord: false, drum: 'h', drumVel: 0.55 },
          { freq: NOTE.G2, chord: false, drum: 's', drumVel: 0.35 },
          { freq: null, chord: false, drum: 'h', drumVel: 0.3 },
          { freq: NOTE.C3, chord: false, drum: 'k' },
          { freq: null, chord: false, drum: 'h', drumVel: 0.55 },
          { freq: null, chord: false, drum: 'h', drumVel: 0.3 },
          { freq: NOTE.E2, chord: false, drum: 'k', drumVel: 0.85, stab: NOTE.G4 },
          { freq: null, chord: false, drum: 's' },
          { freq: null, chord: false, drum: 'h', drumVel: 0.55 },
          { freq: NOTE.B2, chord: false, drum: 's', drumVel: 0.35 },
          { freq: null, chord: false, drum: 'h', drumVel: 0.5, stab: NOTE.E4 },
        ],
      },
    };

    let currentTrackName = 'hiphop'; // главный экран открывается первым

    function playMusicNote(time, freq, { chord, waveType, duration, gain }) {
      if (!freq) return;
      const pitchedFreq = freq * musicPitchMul;
      playToneAt(time, { freq: pitchedFreq, duration, type: waveType, gain, gainNode: musicGain });
      if (chord) {
        // Корень + чистая квинта (×1.5) — классическое "power chord" звучание.
        playToneAt(time, { freq: pitchedFreq * 1.5, duration, type: waveType, gain: gain * 0.68, gainNode: musicGain });
      }
    }

    // Короткий "стаб" (типа духовой/синтовой подколки) верхним регистром на
    // акцентных синкопированных долях — добавляет хип-хопу энергии/яркости
    // поверх баса и барабанов, не трогая сам грув.
    function playStab(time, freq, gainMul) {
      if (!freq) return;
      playToneAt(time, { freq: freq * musicPitchMul, duration: 0.09, type: 'square', gain: 0.22 * gainMul, gainNode: musicGain });
    }

    function playDrumStep(time, kind, velocity) {
      const vel = velocity == null ? 1 : velocity;
      const c = ctx;
      if (kind === 'k') {
        // Kick — синус с резким глиссандо вниз, коротким щелчком громкости.
        // Питч кика тоже "плывёт" вниз вместе с остальным при замедлении —
        // так эффект "теряющей питание пластинки" звучит цельно, не только бас.
        const osc = c.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150 * musicPitchMul, time);
        osc.frequency.exponentialRampToValueAtTime(42 * musicPitchMul, time + 0.09);
        const g = c.createGain();
        g.gain.setValueAtTime(0.55 * vel, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.11);
        osc.connect(g);
        g.connect(musicGain);
        osc.start(time);
        osc.stop(time + 0.12);
      } else if (kind === 's' || kind === 'h') {
        // Snare/hihat — один и тот же шумовой буфер, разная громкость/длительность.
        // velocity < 1 даёт "ghost note" — тихий призрачный удар для грува.
        if (!noiseBuffer) return;
        const src = c.createBufferSource();
        src.buffer = noiseBuffer;
        const isSnare = kind === 's';
        const g = c.createGain();
        g.gain.setValueAtTime((isSnare ? 0.3 : 0.13) * vel, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + (isSnare ? 0.09 : 0.035));
        src.connect(g);
        g.connect(musicGain);
        src.start(time);
        src.stop(time + (isSnare ? 0.1 : 0.04));
      }
    }

    // Покачивание (swing): нечётные шаги (вторая нота в каждой паре восьмых)
    // сдвигаются позже на долю shuffle-интервала — даёт "неторопливый"
    // хип-хоп-грув вместо ровного метронома. При swing=0 шаги просто идут
    // ровно друг за другом (как раньше).
    function stepOffset(i, stepDuration, swing) {
      const pairIndex = Math.floor(i / 2);
      const pairDuration = stepDuration * 2;
      const base = pairIndex * pairDuration;
      return i % 2 === 0 ? base : base + stepDuration * (1 + swing);
    }

    function scheduleMusicCycle(generation, startTime, track) {
      const c = ctx;
      const stepDuration = track.stepDuration * musicTempoMul; // >1 = темп медленнее (Game Over)
      const durationMul = track.noteDurationMul == null ? 0.75 : track.noteDurationMul;
      const gainMul = track.gainMul == null ? 1 : track.gainMul;
      track.pattern.forEach((step, i) => {
        const t = startTime + stepOffset(i, stepDuration, track.swing || 0);
        playMusicNote(t, step.freq, {
          chord: step.chord,
          waveType: track.waveType,
          duration: stepDuration * durationMul,
          gain: (step.chord ? 0.3 : 0.34) * gainMul,
        });
        if (step.drum) playDrumStep(t, step.drum, (step.drumVel == null ? 1 : step.drumVel) * gainMul);
        if (step.stab) playStab(t, step.stab, gainMul);
      });
      const cycleLength = track.pattern.length * stepDuration;
      const nextStart = startTime + cycleLength;
      const delayMs = Math.max(0, (nextStart - c.currentTime - 0.15) * 1000);
      musicTimer = setTimeout(() => {
        if (generation !== musicGeneration) return; // музыку успели остановить/перезапустить — этот круг больше не нужен
        scheduleMusicCycle(generation, nextStart, track);
      }, delayMs);
    }

    function startMusicLoop() {
      const c = ensureContext();
      if (!c || muted || c.state === 'suspended') return;
      if (musicTimer) return; // уже играет
      musicGeneration++;
      scheduleMusicCycle(musicGeneration, c.currentTime + 0.05, TRACKS[currentTrackName]);
    }

    function stopMusicLoop() {
      musicGeneration++; // отменяет ещё не сработавший setTimeout из scheduleMusicCycle
      if (musicTimer) {
        clearTimeout(musicTimer);
        musicTimer = null;
      }
    }

    // trackName опционален — вызов без него просто (пере)запускает уже
    // выбранный трек (используется, например, при снятии мьюта).
    function startMusic(trackName) {
      const changingTrack = trackName && trackName !== currentTrackName;
      if (trackName) currentTrackName = trackName;
      musicWanted = true;
      if (changingTrack) stopMusicLoop();
      if (unlocked) startMusicLoop();
    }

    function stopMusic() {
      musicWanted = false;
      stopMusicLoop();
    }

    // ==== "Game Over" эффект — темп и высота тона плавно "проседают", как у
    // пластинки, теряющей питание. tempoMul>1 замедляет, pitchMul<1 понижает
    // тон. Меняет текущий проигрываемый цикл СРАЗУ (не ждёт, пока он
    // доиграет), пересчитывая расписание с новым темпом. setSlowdown(1, 1)
    // возвращает обычный темп/тон — вызывается при старте нового раунда. ====
    function setSlowdown(tempoMul, pitchMul) {
      musicTempoMul = tempoMul == null ? 1 : tempoMul;
      musicPitchMul = pitchMul == null ? 1 : pitchMul;
      if (musicTimer) {
        stopMusicLoop();
        startMusicLoop();
      }
    }

    function isMuted() {
      return muted;
    }

    function setMuted(value) {
      muted = value;
      try {
        localStorage.setItem(STORAGE_KEY_MUTED, muted ? '1' : '0');
      } catch (e) { /* не критично, просто не запомним между сессиями */ }
      if (muted) {
        stopMusicLoop();
      } else if (musicWanted && unlocked) {
        startMusicLoop();
      }
    }

    // ==== Карусель громкости (Options): 0..5, вызывается кнопками
    // Button_options_music_N/Button_options_sound_N. Меняет реальную
    // громкость сразу (см. applyVolumeGains), а не только сохранённое число. ====
    function wrapLevel(v) {
      return ((v % 6) + 6) % 6; // 5 -> 0 (карусель), -1 -> 5 на всякий случай
    }

    function getMusicVolume() {
      return musicVolumeLevel;
    }

    function setMusicVolume(level) {
      musicVolumeLevel = wrapLevel(level);
      try {
        localStorage.setItem(STORAGE_KEY_MUSIC_VOLUME, String(musicVolumeLevel));
      } catch (e) { /* не критично, просто не запомним между сессиями */ }
      applyVolumeGains();
      return musicVolumeLevel;
    }

    function cycleMusicVolume() {
      return setMusicVolume(musicVolumeLevel + 1);
    }

    function getSfxVolume() {
      return sfxVolumeLevel;
    }

    function setSfxVolume(level) {
      sfxVolumeLevel = wrapLevel(level);
      try {
        localStorage.setItem(STORAGE_KEY_SFX_VOLUME, String(sfxVolumeLevel));
      } catch (e) { /* не критично, просто не запомним между сессиями */ }
      applyVolumeGains();
      return sfxVolumeLevel;
    }

    function cycleSfxVolume() {
      return setSfxVolume(sfxVolumeLevel + 1);
    }

    // Первый клик/тач в любом месте страницы — разблокирует AudioContext
    // (без этого браузеры молча глушат звук до жеста пользователя).
    document.addEventListener('pointerdown', unlock, { once: true, capture: true });

    // Хотим музыку сразу с открытия страницы (ещё на заставке, до Mainscreen) —
    // выставляем это желание СРАЗУ, не дожидаясь showScreen(mainscreen) после
    // интро. Плюс пробуем разблокировать звук прямо сейчас: почти везде это
    // не сработает (браузер отвечает молчаливым отказом без жеста пользователя —
    // это ограничение самого браузера, обойти его невозможно никаким кодом),
    // но в средах, которые уже считают открытие страницы жестом пользователя
    // (это по-разному ведёт себя в зависимости от конкретного webview),
    // музыка заиграет по-настоящему сразу. Если нет — сыграет, как и раньше,
    // на самый первый тап (см. подписку выше).
    startMusic('hiphop');
    unlock();

    return {
      play, unlock, startMusic, stopMusic, setSlowdown, isMuted, setMuted,
      getMusicVolume, setMusicVolume, cycleMusicVolume,
      getSfxVolume, setSfxVolume, cycleSfxVolume,
    };
  })();

  // Единая точка входа для звука кнопок: слушаем клики на всём документе
  // (capture-фаза — срабатывает до собственных обработчиков кнопок, но не
  // мешает им), а не переписываем каждый addEventListener('click', ...) по
  // отдельности. Список ниже сопоставляет id кнопки с "характером" звука —
  // кнопок без записи в списке используют обычный клик.
  const SOUND_BUTTON_OVERRIDES = {
    modeFlatEasy: 'confirm',
    modeFlatHard: 'confirm',
    modeRampEasy: 'confirm',
    modeRampHard: 'confirm',
    modeStreetEasy: 'confirm',
    modeStreetHard: 'confirm',
    btn1: 'confirm',
    betBtn50: 'confirm',
    betBtn100: 'confirm',
    betBtn500: 'confirm',
    btnNewGame: 'confirm',
    btnQuitRestart: 'confirm',
    togglePlayerSelect: 'toggle',
    toggleModeSelect: 'toggle',
    toggleOldschool: 'toggle',
    toggleBodyvarial: 'toggle',
    toggleAirtricks: 'toggle',
    toggleStreetOldschool: 'toggle',
    toggleStreetInsandouts: 'toggle',
    toggleRampPlayerSelect: 'toggle',
    toggleRampModeSelect: 'toggle',
    toggleStreetPlayerSelect: 'toggle',
    toggleStreetModeSelect: 'toggle',
    obstacleManualbox: 'toggle',
    obstacleKicker: 'toggle',
    obstacleCurb: 'toggle',
    obstacleStairs: 'toggle',
    obstacleLedge: 'toggle',
    obstacleRail: 'toggle',
    optionsMusicVolume: 'toggle',
    optionsSoundVolume: 'toggle',
    optionsBackground: 'toggle',
    btnLanded: 'landed',
    btnFailed: 'failed',
    btn2: 'back',
    btnQuitGame: 'back',
    mainscreenQuit: 'back',
    optionsQuit: 'back',
    btnQuitBack: 'back',
    btnQuitConfirm: 'back',
  };

  document.addEventListener('click', (event) => {
    const btn = event.target.closest('button');
    if (!btn || !btn.id) return;
    SoundEngine.play(SOUND_BUTTON_OVERRIDES[btn.id] || 'click');
  }, true);

  // ==== Флаг незавершённой игры ====
  // 0 — игра не начата / завершена (Quit). 1 — Flat, 2 — Street, 3 — Ramp.
  // Ставится при нажатии Start Game в соответствующем режиме, сбрасывается по Quit.
  // Используется, чтобы после заставки открывать сразу нужный режим, если игра не была завершена.
  const STORAGE_KEY_ACTIVE_MODE = 'goskate_activeMode';

  function getActiveMode() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_ACTIVE_MODE);
      const val = raw !== null ? parseInt(raw, 10) : 0;
      return Number.isNaN(val) ? 0 : val;
    } catch (e) {
      console.warn('localStorage недоступен, используем 0 (нет активной игры):', e);
      return 0;
    }
  }

  function setActiveMode(mode) {
    try {
      localStorage.setItem(STORAGE_KEY_ACTIVE_MODE, String(mode));
    } catch (e) {
      console.warn('Не удалось сохранить флаг активной игры:', e);
    }
  }

  const ACTIVE_MODE_FLAT = 1;
  const ACTIVE_MODE_STREET = 2;
  const ACTIVE_MODE_RAMP = 3;

  // ==== Текущий игровой режим ('flat' или 'ramp') — определяет, какие данные
  // грузить (data/flatmode или data/rampmode), какую анимацию показывать и
  // какой способ генерации трюков использовать. ====
  const GAME_MODE_FLAT = 'flat';
  const GAME_MODE_RAMP = 'ramp';
  const GAME_MODE_STREET = 'street';
  let currentGameMode = GAME_MODE_FLAT;

  const GAME_MODE_CONFIG = {
    [GAME_MODE_FLAT]: {
      activeMode: ACTIVE_MODE_FLAT,
      groundImage: 'images/Animation_flatmode.png',
      easyFile: 'data/Flatmode_tricks_easy.txt',
      hardFile: 'data/Flatmode_tricks_hard.txt',
      oldschoolEasyFile: 'data/Flatmode_tricks_oldschool_easy.txt',
      oldschoolHardFile: 'data/Flatmode_tricks_oldschool_hard.txt',
      bodyvarialEasyFile: 'data/Flatmode_tricks_bodyvarial_easy.txt',
      bodyvarialHardFile: 'data/Flatmode_tricks_bodyvarial_hard.txt',
    },
    [GAME_MODE_RAMP]: {
      activeMode: ACTIVE_MODE_RAMP,
      groundImage: 'images/Animation_ramp.png',
      easyFile: 'data/Rampmode_tricks_easy.txt',
      hardFile: 'data/Rampmode_tricks_hard.txt',
      airtricksEasyFile: 'data/Rampmode_tricks_Airs_easy.txt',
      airtricksHardFile: 'data/Rampmode_tricks_Airs_hard.txt',
    },
    [GAME_MODE_STREET]: {
      activeMode: ACTIVE_MODE_STREET,
      groundImage: 'images/Animation_street.png',
      // У Street нет единой пары easy/hard файлов — список трюков собирается
      // динамически из файлов на препятствие (см. STREET_OBSTACLES/loadStreetLists).
    },
  };

  function getGameModeByActiveMode(activeMode) {
    if (activeMode === ACTIVE_MODE_RAMP) return GAME_MODE_RAMP;
    if (activeMode === ACTIVE_MODE_FLAT) return GAME_MODE_FLAT;
    if (activeMode === ACTIVE_MODE_STREET) return GAME_MODE_STREET;
    return null;
  }

  // ==== Versus (2 Player Flatground): флаги активной игры — сохраняются
  // вместе с STORAGE_KEY_ACTIVE_MODE, чтобы при возврате в незавершённую игру
  // (см. заставку) снова открылся именно versus-режим, с тем же ходом.
  // ВАЖНО: объявлено здесь, ДО currentIsVersus/currentTurn ниже — они читают
  // эти функции синхронно при самом первом проходе скрипта, и если бы эти
  // функции (точнее константы STORAGE_KEY_VERSUS_* внутри них) были объявлены
  // позже по файлу, обращение к ним словило бы TDZ ReferenceError, который
  // try/catch внутри тихо проглотил бы, вернув false/1 вместо реального
  // сохранённого состояния. ====
  const STORAGE_KEY_VERSUS_ACTIVE = 'goskate_versusActive';
  const STORAGE_KEY_VERSUS_TURN = 'goskate_versusTurn';

  function getVersusActiveFlag() {
    try {
      return localStorage.getItem(STORAGE_KEY_VERSUS_ACTIVE) === '1';
    } catch (e) {
      return false;
    }
  }
  function setVersusActiveFlag(enabled) {
    try {
      localStorage.setItem(STORAGE_KEY_VERSUS_ACTIVE, enabled ? '1' : '0');
    } catch (e) {
      console.warn('Не удалось сохранить флаг Versus:', e);
    }
  }

  function getVersusTurnFlag() {
    try {
      const raw = parseInt(localStorage.getItem(STORAGE_KEY_VERSUS_TURN), 10);
      return raw === 2 ? 2 : 1;
    } catch (e) {
      return 1;
    }
  }
  function setVersusTurnFlag(turn) {
    try {
      localStorage.setItem(STORAGE_KEY_VERSUS_TURN, String(turn));
    } catch (e) {
      console.warn('Не удалось сохранить текущий ход Versus:', e);
    }
  }

  // Определяем режим СРАЗУ, синхронно, а не только в setTimeout заставки —
  // иначе renderTricklist() (который вызывается сразу при загрузке скрипта,
  // до того как заставка успеет отработать) применит правила Flat даже если
  // на самом деле возобновляется игра в Ramp.
  {
    const resumedMode = getGameModeByActiveMode(getActiveMode());
    if (resumedMode) currentGameMode = resumedMode;
  }

  // ==== Versus (2 Player): состояние текущей игры — теперь работает для всех
  // трёх режимов (Flat/Ramp/Street), не только Flat. Синхронно ДО первого
  // renderTricklist() (см. ниже), иначе он посчитает landed/failed по
  // одиночным правилам вместо посчёта на двух игроков и неправильно
  // определит game over/победителя при возврате в игру. ====
  let currentIsVersus = getVersusActiveFlag();
  let currentTurn = getVersusTurnFlag();
  let pendingVersusTrick = null;

  function isVersusActive() {
    return currentIsVersus;
  }

  // ==== Arcade mode: "skatebucks" вместо букв SKATE — банк 100 на старте,
  // ставки Bet_50/100/500 вместо Button_startgame. Работает для любого из
  // трёх режимов (Flat/Ramp/Street — переключается своим Mode Select у
  // каждого, см. getModeSelectForMode), но НЕ вместе с Versus: если у режима
  // одновременно Player Select=Versus и Mode Select=Arcade, побеждает Versus
  // (ставки на двух игроков с одним банком не описаны в задаче) — см.
  // wantArcade в startGameWithDifficulty. Персистентность — тот же принцип,
  // что у Versus (синхронно здесь, до первого renderTricklist() ниже). ====
  const STORAGE_KEY_ARCADE_ACTIVE = 'goskate_arcadeActive';
  const STORAGE_KEY_SKATEBUCKS = 'goskate_skatebucks';
  const STORAGE_KEY_PENDING_BET = 'goskate_pendingBet';
  const ARCADE_START_BUCKS = 100;
  const ARCADE_MIN_BET = 50;
  const ARCADE_WELCOME_MESSAGE = 'Welcome to Arcade mode! Make a bet for next trick and try to not loose all your skatebucks at once.';

  function getArcadeActiveFlag() {
    try {
      return localStorage.getItem(STORAGE_KEY_ARCADE_ACTIVE) === '1';
    } catch (e) {
      return false;
    }
  }
  function setArcadeActiveFlag(enabled) {
    try {
      localStorage.setItem(STORAGE_KEY_ARCADE_ACTIVE, enabled ? '1' : '0');
    } catch (e) {
      console.warn('Не удалось сохранить флаг Arcade:', e);
    }
  }

  function getSkatebucksFlag() {
    try {
      const raw = parseInt(localStorage.getItem(STORAGE_KEY_SKATEBUCKS), 10);
      return isNaN(raw) ? ARCADE_START_BUCKS : raw;
    } catch (e) {
      return ARCADE_START_BUCKS;
    }
  }
  function setSkatebucksFlag(amount) {
    try {
      localStorage.setItem(STORAGE_KEY_SKATEBUCKS, String(amount));
    } catch (e) {
      console.warn('Не удалось сохранить skatebucks:', e);
    }
  }

  // Ставка на трюк, который сейчас "в полёте" (сгенерирован, но ещё не
  // оценён Landed/Failed) — null между раундами, когда ждём следующую ставку.
  // Персистентная: отличает на резюме "ждём оценку уже сгенерированного
  // трюка" от "ждём следующую ставку" — lastResult (STORAGE_KEY_LAST) сам по
  // себе для этого не годится, он не чистится после оценки трюка.
  function getPendingBetFlag() {
    try {
      const raw = parseInt(localStorage.getItem(STORAGE_KEY_PENDING_BET), 10);
      return isNaN(raw) ? null : raw;
    } catch (e) {
      return null;
    }
  }
  function setPendingBetFlag(amount) {
    try {
      if (amount == null) localStorage.removeItem(STORAGE_KEY_PENDING_BET);
      else localStorage.setItem(STORAGE_KEY_PENDING_BET, String(amount));
    } catch (e) {
      console.warn('Не удалось сохранить текущую ставку Arcade:', e);
    }
  }

  let currentIsArcade = getArcadeActiveFlag();
  let skatebucks = getSkatebucksFlag();
  let pendingBetAmount = getPendingBetFlag();

  function isArcadeActive() {
    return currentIsArcade;
  }

  // ==== Arcade: карты-баффы (Reroll Trick / Extra Try / Double Bet) — у
  // каждой свой независимый "кулдаун" в 5 ходов (ход = нажатие Landed/Failed,
  // НЕ печать трюка в пузыре) после использования, со своей прогрессией
  // картинок (_off -> _off_1 -> _off_2 -> _off_3 -> _off_4 -> _on). persist'ятся
  // тем же способом, что и остальное состояние Arcade — синхронно здесь же,
  // до первого renderTricklist(). ====
  const STORAGE_KEY_CARD_COOLDOWNS = 'goskate_cardCooldowns';
  const STORAGE_KEY_EXTRATRY_ATTEMPT = 'goskate_extraTryAttempt';
  const ARCADE_CARD_COOLDOWN_TURNS = 5;
  const ARCADE_CARD_DEFAULT_COOLDOWNS = { reroll: 0, extratry: 0, doublebet: 0 };

  // cooldown: 0 — доступна; 5 — только что использована (Card_X_off.png);
  // 4..1 — прогрессия Card_X_off_(5-cooldown).png; при следующем тике (ходе)
  // после 1 карта возвращается в 0 (доступна, Card_X_on.png).
  function getCardCooldownsFlag() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_CARD_COOLDOWNS));
      if (raw && typeof raw === 'object') {
        return {
          reroll: clampCardCooldown(raw.reroll),
          extratry: clampCardCooldown(raw.extratry),
          doublebet: clampCardCooldown(raw.doublebet),
        };
      }
    } catch (e) { /* используем значение по умолчанию ниже */ }
    return { reroll: 0, extratry: 0, doublebet: 0 };
  }
  function clampCardCooldown(value) {
    const n = parseInt(value, 10);
    return n >= 0 && n <= ARCADE_CARD_COOLDOWN_TURNS ? n : 0;
  }
  function setCardCooldownsFlag(obj) {
    try {
      localStorage.setItem(STORAGE_KEY_CARD_COOLDOWNS, JSON.stringify(obj));
    } catch (e) {
      console.warn('Не удалось сохранить кулдауны карт Arcade:', e);
    }
  }

  // 0 — карта Extra Try не в игре на текущий трюк; 1 — первая (бонусная)
  // попытка ещё не была провалена; 2 — идёт последняя попытка (первая уже
  // провалена, ставка при неудаче теперь реально сгорает).
  function getExtraTryAttemptFlag() {
    try {
      const raw = parseInt(localStorage.getItem(STORAGE_KEY_EXTRATRY_ATTEMPT), 10);
      return raw === 1 || raw === 2 ? raw : 0;
    } catch (e) {
      return 0;
    }
  }
  function setExtraTryAttemptFlag(value) {
    try {
      localStorage.setItem(STORAGE_KEY_EXTRATRY_ATTEMPT, String(value));
    } catch (e) {
      console.warn('Не удалось сохранить состояние Extra Try:', e);
    }
  }

  // Использование карты ставит её на кулдаун СРАЗУ (5), но тикать он должен
  // не с ЭТОГО же хода (на котором её только что применили), а со СЛЕДУЮЩЕГО
  // нажатия Landed/Failed — то есть самое первое разрешение раунда после
  // использования карты кулдаун не тратит, а лишь "снимает" этот флаг.
  const STORAGE_KEY_CARD_SKIP_NEXT_TICK = 'goskate_cardSkipNextTick';
  function getCardSkipNextTickFlag() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_CARD_SKIP_NEXT_TICK));
      if (raw && typeof raw === 'object') {
        return { reroll: !!raw.reroll, extratry: !!raw.extratry, doublebet: !!raw.doublebet };
      }
    } catch (e) { /* используем значение по умолчанию ниже */ }
    return { reroll: false, extratry: false, doublebet: false };
  }
  function setCardSkipNextTickFlag(obj) {
    try {
      localStorage.setItem(STORAGE_KEY_CARD_SKIP_NEXT_TICK, JSON.stringify(obj));
    } catch (e) {
      console.warn('Не удалось сохранить флаг пропуска тика карт Arcade:', e);
    }
  }

  let cardCooldowns = getCardCooldownsFlag();
  let extraTryAttempt = getExtraTryAttemptFlag();
  let cardSkipNextTick = getCardSkipNextTickFlag();

  // ==== Сложность (Easy/Hard) — своя для каждого режима, сохраняется вместе
  // с активной игрой, чтобы при возврате в незавершённую игру применялись те же правила. ====
  const STORAGE_KEY_DIFFICULTY_PREFIX = 'goskate_difficulty_';
  const DIFFICULTY_EASY = 'easy';
  const DIFFICULTY_HARD = 'hard';

  function getDifficulty(mode) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_DIFFICULTY_PREFIX + mode);
      return raw === DIFFICULTY_HARD ? DIFFICULTY_HARD : DIFFICULTY_EASY;
    } catch (e) {
      return DIFFICULTY_EASY;
    }
  }

  function setDifficulty(mode, difficulty) {
    try {
      localStorage.setItem(STORAGE_KEY_DIFFICULTY_PREFIX + mode, difficulty);
    } catch (e) {
      console.warn('Не удалось сохранить сложность:', e);
    }
  }

  // Совместимость с уже написанным ниже кодом, который всегда имел дело с
  // "текущим" режимом — эти обёртки читают/пишут сложность для currentGameMode.
  function getFlatDifficulty() {
    return getDifficulty(currentGameMode);
  }

  function setFlatDifficulty(difficulty) {
    setDifficulty(currentGameMode, difficulty);
  }

  // ==== Переключатели-модификаторы ростера (только Flat) — каждый просто
  // добавляет в генерацию трюки из своей пары _easy/_hard файлов поверх
  // обычных списков. Общее хранилище на все такие переключатели. ====
  const STORAGE_KEY_TOGGLE_PREFIX = 'goskate_toggle_';

  function getToggle(name, mode) {
    try {
      return localStorage.getItem(STORAGE_KEY_TOGGLE_PREFIX + name + '_' + mode) === '1';
    } catch (e) {
      return false;
    }
  }

  function setToggle(name, mode, enabled) {
    try {
      localStorage.setItem(STORAGE_KEY_TOGGLE_PREFIX + name + '_' + mode, enabled ? '1' : '0');
    } catch (e) {
      console.warn('Не удалось сохранить состояние переключателя ' + name + ':', e);
    }
  }

  // Old School: добавляет Flatmode_tricks_oldschool_*.txt
  function getOldschool(mode) {
    return getToggle('oldschool', mode);
  }
  function setOldschool(mode, enabled) {
    setToggle('oldschool', mode, enabled);
  }
  function getFlatOldschool() {
    return getOldschool(currentGameMode);
  }

  // Body Varial: добавляет Flatmode_tricks_bodyvarial_*.txt
  function getBodyvarial(mode) {
    return getToggle('bodyvarial', mode);
  }
  function setBodyvarial(mode, enabled) {
    setToggle('bodyvarial', mode, enabled);
  }
  function getFlatBodyvarial() {
    return getBodyvarial(currentGameMode);
  }

  // Air Tricks (только Ramp): добавляет Rampmode_tricks_Airs_*.txt
  function getAirtricks(mode) {
    return getToggle('airtricks', mode);
  }
  function setAirtricks(mode, enabled) {
    setToggle('airtricks', mode, enabled);
  }
  function getRampAirtricks() {
    return getAirtricks(currentGameMode);
  }

  // ==== Flat: переключатели-радио "Single / Versus" и "Arcade / Classic" —
  // тот же принцип single-кнопки с двумя состояниями, что и Old School/Body
  // Varial, просто хранят строку вместо true/false. Player Select реально
  // влияет на игру (см. ниже 2 Player Mode), Mode Select пока ни на что не
  // влияет — только меняет картинку туда-обратно, как попросил пользователь. ====
  const STORAGE_KEY_PLAYER_SELECT = 'goskate_flat_playerSelect';
  const STORAGE_KEY_MODE_SELECT = 'goskate_flat_modeSelect';
  const PLAYER_SELECT_SINGLE = 'single';
  const PLAYER_SELECT_VERSUS = 'versus';
  const MODE_SELECT_CLASSIC = 'classic';
  const MODE_SELECT_ARCADE = 'arcade';

  function getPlayerSelect() {
    try {
      return localStorage.getItem(STORAGE_KEY_PLAYER_SELECT) === PLAYER_SELECT_VERSUS
        ? PLAYER_SELECT_VERSUS
        : PLAYER_SELECT_SINGLE;
    } catch (e) {
      return PLAYER_SELECT_SINGLE;
    }
  }
  function setPlayerSelect(value) {
    try {
      localStorage.setItem(STORAGE_KEY_PLAYER_SELECT, value);
    } catch (e) {
      console.warn('Не удалось сохранить Player Select:', e);
    }
  }

  function getModeSelect() {
    try {
      return localStorage.getItem(STORAGE_KEY_MODE_SELECT) === MODE_SELECT_ARCADE
        ? MODE_SELECT_ARCADE
        : MODE_SELECT_CLASSIC;
    } catch (e) {
      return MODE_SELECT_CLASSIC;
    }
  }
  function setModeSelect(value) {
    try {
      localStorage.setItem(STORAGE_KEY_MODE_SELECT, value);
    } catch (e) {
      console.warn('Не удалось сохранить Mode Select:', e);
    }
  }

  // ==== Street: препятствия (Curb/Kicker/Ledge/Manual Box/Rail/Stairs) —
  // каждое можно включать/выключать независимо, ПО УМОЛЧАНИЮ ВСЕ ВКЛЮЧЕНЫ
  // (иначе свежий игрок открывает Street и получает пустой список трюков).
  // Только явно сохранённое "выключено" (0) отключает препятствие. ====
  function getStreetObstacle(obstacleKey) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_TOGGLE_PREFIX + 'obstacle_' + obstacleKey + '_' + GAME_MODE_STREET);
      return raw === null ? true : raw === '1';
    } catch (e) {
      return true;
    }
