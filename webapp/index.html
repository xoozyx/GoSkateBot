  // ==== Переключатели Player Select/Mode Select для Ramp и Street. Mode
  // Select — чисто визуальный (как у Flat), ни на что не влияет. Player
  // Select — теперь РЕАЛЬНО включает versus (см. getPlayerSelectForMode()
  // ниже, читается в startGameWithDifficulty), так же как у Flat, просто
  // через свой отдельный ключ в localStorage на каждый режим. Единая
  // функция-фабрика вместо 4 копий одного и того же кода хранения+картинки. ====
  function setupCosmeticSelectToggle(storageKey, buttonId, imagePrefix, offValue, onValue) {
    const img = document.querySelector('#' + buttonId + 'Visual img');

    function get() {
      try {
        return localStorage.getItem(storageKey) === onValue ? onValue : offValue;
      } catch (e) {
        return offValue;
      }
    }
    function set(value) {
      try {
        localStorage.setItem(storageKey, value);
      } catch (e) {
        console.warn('Не удалось сохранить ' + storageKey + ':', e);
      }
    }
    function sync() {
      img.src = 'images/' + imagePrefix + get() + '.png?v=' + ASSET_VERSION;
    }

    document.getElementById(buttonId).addEventListener('click', () => {
      set(get() === onValue ? offValue : onValue);
      sync();
    });

    return { sync, get };
  }

  const rampPlayerSelectToggle = setupCosmeticSelectToggle(
    'goskate_ramp_playerSelect', 'toggleRampPlayerSelect', 'Button_mainmenu_ramp_modeselect_', 'single', 'versus'
  );
  const rampModeSelectToggle = setupCosmeticSelectToggle(
    'goskate_ramp_modeSelect', 'toggleRampModeSelect', 'Button_mainmenu_ramp_modeselect_', 'classic', 'arcade'
  );
  const streetPlayerSelectToggle = setupCosmeticSelectToggle(
    'goskate_street_playerSelect', 'toggleStreetPlayerSelect', 'Button_mainmenu_street_playerselect_', 'single', 'versus'
  );
  const streetModeSelectToggle = setupCosmeticSelectToggle(
    'goskate_street_modeSelect', 'toggleStreetModeSelect', 'Button_mainmenu_street_modeselect_', 'classic', 'arcade'
  );

  // Какое значение Player Select читать при старте игры — своё на каждый режим.
  function getPlayerSelectForMode(mode) {
    if (mode === GAME_MODE_FLAT) return getPlayerSelect();
    if (mode === GAME_MODE_RAMP) return rampPlayerSelectToggle.get();
    if (mode === GAME_MODE_STREET) return streetPlayerSelectToggle.get();
    return PLAYER_SELECT_SINGLE;
  }

  // То же самое, но для Mode Select (Classic/Arcade) — своя картинка-переключатель
  // на каждый режим, читаем через её же .get(), кроме Flat (у него отдельные
  // именованные getModeSelect/setModeSelect, см. выше).
  function getModeSelectForMode(mode) {
    if (mode === GAME_MODE_FLAT) return getModeSelect();
    if (mode === GAME_MODE_RAMP) return rampModeSelectToggle.get();
    if (mode === GAME_MODE_STREET) return streetModeSelectToggle.get();
    return MODE_SELECT_CLASSIC;
  }

  document.getElementById('modeRampHard').addEventListener('click', () => {
    startGameWithDifficulty(GAME_MODE_RAMP, DIFFICULTY_HARD);
  });

  // ==== Переключатель Air Tricks (только Ramp) — тот же принцип, что Old
  // School/Body Varial у Flat: просто вкл/выкл, добавляет свою пару
  // _easy/_hard файлов. Всегда привязан к GAME_MODE_RAMP явно, а не к
  // currentGameMode — по той же причине, что и у Flat-переключателей. ====
  const toggleAirtricksImg = document.querySelector('#toggleAirtricksVisual img');

  function syncAirtricksToggleVisual() {
    const on = getAirtricks(GAME_MODE_RAMP);
    toggleAirtricksImg.src = 'images/Button_mainmenu_ramp_airtricks_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('toggleAirtricks').addEventListener('click', () => {
    setAirtricks(GAME_MODE_RAMP, !getAirtricks(GAME_MODE_RAMP));
    syncAirtricksToggleVisual();
  });

  // ==== Street: Old School / Ins and Outs — те же переключатели-модификаторы,
  // что и у Flat/Ramp, но добавляют файлы per-препятствие (см. loadStreetLists).
  // Всегда привязаны к GAME_MODE_STREET явно, а не к currentGameMode — по той
  // же причине, что и у остальных переключателей режимов. ====
  const toggleStreetOldschoolImg = document.querySelector('#toggleStreetOldschoolVisual img');

  function syncStreetOldschoolToggleVisual() {
    const on = getStreetOldschool();
    toggleStreetOldschoolImg.src = 'images/Button_mainmenu_street_oldschool_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('toggleStreetOldschool').addEventListener('click', () => {
    setStreetOldschool(!getStreetOldschool());
    syncStreetOldschoolToggleVisual();
    syncStreetModeButtons();
  });

  const toggleStreetInsandoutsImg = document.querySelector('#toggleStreetInsandoutsVisual img');

  function syncStreetInsandoutsToggleVisual() {
    const on = getStreetInsandouts();
    toggleStreetInsandoutsImg.src = 'images/Button_mainmenu_street_insandouts_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('toggleStreetInsandouts').addEventListener('click', () => {
    setStreetInsandouts(!getStreetInsandouts());
    syncStreetInsandoutsToggleVisual();
    syncStreetModeButtons();
  });

  // ==== Street: препятствия — 6 независимых переключателей, каждый вкл/выкл
  // добавляет/убирает свою пару _easy/_hard файлов целиком (плюс Old
  // School/Ins and Outs варианты, если те тоже включены — см. loadStreetLists).
  // По умолчанию (пока явно не выключены) все включены, см. getStreetObstacle. ====
  const OBSTACLE_BUTTON_ID = {
    manualbox: 'obstacleManualbox',
    kicker: 'obstacleKicker',
    curb: 'obstacleCurb',
    stairs: 'obstacleStairs',
    ledge: 'obstacleLedge',
    rail: 'obstacleRail',
  };

  const obstacleImgs = {};
  STREET_OBSTACLES.forEach((obstacle) => {
    obstacleImgs[obstacle.key] = document.querySelector('#' + OBSTACLE_BUTTON_ID[obstacle.key] + 'Visual img');
  });

  function syncStreetObstacleVisual(obstacleKey) {
    const on = getStreetObstacle(obstacleKey);
    obstacleImgs[obstacleKey].src = 'images/Button_mainmenu_street_' + obstacleKey + '_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  function syncAllStreetObstacleVisuals() {
    STREET_OBSTACLES.forEach((obstacle) => syncStreetObstacleVisual(obstacle.key));
  }

  // ==== Street: Easy/Hard блокируются и становятся серыми, когда:
  //  1) не выбрано вообще ни одного препятствия (генерировать нечего), или
  //  2) выбран только Manual Box — трюков там слишком мало (4 easy / 2 hard,
  //     и Old School не добавляет новых, см. data/) для полноценной генерации.
  // Исключение из пункта 2: Manual Box + Ins and Outs — возвращает кнопки в
  // обычное состояние (файл Manual Box Ins and Outs расценивается как
  // самостоятельный набор, а не как "просто Manual Box"). Состояние Old
  // School на это исключение не влияет. ====
  const modeStreetEasyEl = document.getElementById('modeStreetEasy');
  const modeStreetHardEl = document.getElementById('modeStreetHard');
  const modeStreetEasyImg = document.querySelector('#modeStreetEasyVisual img');
  const modeStreetHardImg = document.querySelector('#modeStreetHardVisual img');

  function isStreetTooFewObstacles() {
    const selected = STREET_OBSTACLES.filter(o => getStreetObstacle(o.key));
    if (selected.length === 0) return true; // ни одного препятствия
    if (selected.length === 1 && selected[0].key === 'manualbox') {
      return !getStreetInsandouts(); // Manual Box + Ins and Outs — исключение
    }
    return false;
  }

  function syncStreetModeButtons() {
    const grayedOut = isStreetTooFewObstacles();

    modeStreetEasyImg.src = 'images/Button_mainmenu_street_easy' + (grayedOut ? '_gray' : '') + '.png?v=' + ASSET_VERSION;
    modeStreetHardImg.src = 'images/Button_mainmenu_street_hard' + (grayedOut ? '_gray' : '') + '.png?v=' + ASSET_VERSION;

    [modeStreetEasyEl, modeStreetHardEl].forEach((el) => {
      el.classList.toggle('disabled', grayedOut);
      el.classList.toggle('enabled', !grayedOut);
    });
  }

  STREET_OBSTACLES.forEach((obstacle) => {
    document.getElementById(OBSTACLE_BUTTON_ID[obstacle.key]).addEventListener('click', () => {
      setStreetObstacle(obstacle.key, !getStreetObstacle(obstacle.key));
      syncStreetObstacleVisual(obstacle.key);
      syncStreetModeButtons();
    });
  });

  modeStreetEasyEl.addEventListener('click', () => {
    if (isStreetTooFewObstacles()) return;
    startGameWithDifficulty(GAME_MODE_STREET, DIFFICULTY_EASY);
  });

  modeStreetHardEl.addEventListener('click', () => {
    if (isStreetTooFewObstacles()) return;
    startGameWithDifficulty(GAME_MODE_STREET, DIFFICULTY_HARD);
  });

  // ==== Генератор трюков (Flatmode/Rampmode) ====
  const resultEl = document.getElementById('result');

  // Базовый размер шрифта в пузыре (px) — должен совпадать со значением font-size у #result в CSS.
  const RESULT_FONT_BASE = 11;
  // Пороги по длине текста → во сколько раз уменьшаем шрифт. Подобраны так, чтобы
  // длинные названия трюков (stance + addition + основной трюк) не вылезали за пузырь.
  const RESULT_FONT_STEPS = [
    { maxLength: 16, scale: 1 },
    { maxLength: 24, scale: 0.82 },
    { maxLength: 32, scale: 0.68 },
    { maxLength: Infinity, scale: 0.56 },
  ];

  // ==== Эффект печатной машинки для текста в пузыре ====
  const TYPEWRITER_MS_PER_CHAR = 28; // скорость печати одного символа
  let typewriterTimer = null;

  function setResultText(text, isTrick, onComplete) {
    // Обрываем предыдущую анимацию печати, если она ещё не закончилась —
    // иначе быстрые повторные вызовы (например, серия Roll) накладывались бы
    // друг на друга и печатали вперемешку.
    if (typewriterTimer !== null) {
      clearInterval(typewriterTimer);
      typewriterTimer = null;
    }

    const step = RESULT_FONT_STEPS.find(s => text.length <= s.maxLength);
    resultEl.style.fontSize = (RESULT_FONT_BASE * step.scale) + 'px';

    // Info-кнопка появляется сразу, не дожидаясь конца печати.
    setInfoButtonVisible(!!isTrick);
    resultEl.textContent = '';

    if (!text) {
      if (onComplete) onComplete();
      return;
    }

    let i = 0;
    typewriterTimer = setInterval(() => {
      i++;
      resultEl.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
        if (onComplete) onComplete();
      }
    }, TYPEWRITER_MS_PER_CHAR);
  }
  const bubbleEl = document.getElementById('bubble');
  const btnInfoEl = document.getElementById('btnInfo');
  const btnInfoVisualEl = document.getElementById('btnInfoVisual');

  function setInfoButtonVisible(visible) {
    btnInfoEl.classList.toggle('visible', visible);
    btnInfoVisualEl.classList.toggle('visible', visible);
  }

  let easyTricks = [];       // список трюков Easy для текущего режима (Flat или Ramp)
  let hardTricks = [];       // список трюков Hard для текущего режима (пустой в Easy)
  let oldschoolEasyTricks = []; // Flat, Old School ON — добавляется поверх easyTricks
  let oldschoolHardTricks = []; // Flat, Old School ON + Hard — добавляется поверх hardTricks
  let bodyvarialEasyTricks = []; // Flat, Body Varial ON — добавляется поверх easyTricks
  let bodyvarialHardTricks = []; // Flat, Body Varial ON + Hard — добавляется поверх hardTricks
  let airtricksEasyTricks = []; // Ramp, Air Tricks ON — добавляется поверх easyTricks
  let airtricksHardTricks = []; // Ramp, Air Tricks ON + Hard — добавляется поверх hardTricks
  let howtoLinks = new Map(); // "название трюка" -> ссылка на обучающее видео (общий файл для всех режимов)
  let dataLoaded = false;
  let dataLoadedForMode = null;       // '<mode>' — режим, под который загружены списки
  let dataLoadedForDifficulty = null; // 'easy'/'hard' — сложность, под которую загружены
  let dataLoadedForOldschool = null;  // true/false — состояние Old School, под которое загружены
  let dataLoadedForBodyvarial = null; // true/false — состояние Body Varial, под которое загружены
  let dataLoadedForAirtricks = null;  // true/false — состояние Air Tricks, под которое загружены

  // Простой список трюков — один трюк на строку, без веса/сложности (теперь
  // сложность определяется тем, из какого ФАЙЛА трюк взят, см. Flatmode/Rampmode
  // _tricks_easy.txt и _tricks_hard.txt). Пустые строки пропускаются, пробелы
  // по краям обрезаются. Никакого специального смысла у запятых внутри строки
  // нет — "Rock,n,Roll" остаётся одним трюком целиком.
  function parseTrickList(text) {
    return text
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean);
  }

  // Формат строки в Howto.txt: "Название трюка,Ссылка"
  // Разбиваем по ПЕРВОЙ запятой — так ссылка сама может содержать запятые, если понадобится.
  function parseReplacements(text) {
    const map = new Map();
    text
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .forEach(line => {
        const commaIndex = line.indexOf(',');
        if (commaIndex === -1) return; // строка без запятой — пропускаем
        const from = line.slice(0, commaIndex).trim();
        const to = line.slice(commaIndex + 1).trim();
        if (from && to) map.set(from, to);
      });
    return map;
  }

  async function fetchTrickList(path) {
    if (!path) return [];
    const res = await fetch(path);
    return parseTrickList(await res.text());
  }

  // Загружает списки трюков для текущего режима, сложности и включённых
  // переключателей-модификаторов (Old School, Body Varial — только Flat):
  // каждый включённый модификатор добавляет свою пару _easy/_hard файлов
  // поверх обычных списков (hard-файл — только если сложность Hard).
  // Howto.txt общий один на все режимы, грузится один раз.
  async function loadLists(mode, difficulty, oldschool, bodyvarial, airtricks) {
    const config = GAME_MODE_CONFIG[mode];
    dataLoaded = false;

    try {
      easyTricks = await fetchTrickList(config.easyFile);
      hardTricks = difficulty === DIFFICULTY_HARD ? await fetchTrickList(config.hardFile) : [];

      if (oldschool && config.oldschoolEasyFile) {
        oldschoolEasyTricks = await fetchTrickList(config.oldschoolEasyFile);
        oldschoolHardTricks = difficulty === DIFFICULTY_HARD
          ? await fetchTrickList(config.oldschoolHardFile)
          : [];
      } else {
        oldschoolEasyTricks = [];
        oldschoolHardTricks = [];
      }

      if (bodyvarial && config.bodyvarialEasyFile) {
        bodyvarialEasyTricks = await fetchTrickList(config.bodyvarialEasyFile);
        bodyvarialHardTricks = difficulty === DIFFICULTY_HARD
          ? await fetchTrickList(config.bodyvarialHardFile)
          : [];
      } else {
        bodyvarialEasyTricks = [];
        bodyvarialHardTricks = [];
      }

      if (airtricks && config.airtricksEasyFile) {
        airtricksEasyTricks = await fetchTrickList(config.airtricksEasyFile);
        airtricksHardTricks = difficulty === DIFFICULTY_HARD
          ? await fetchTrickList(config.airtricksHardFile)
          : [];
      } else {
        airtricksEasyTricks = [];
        airtricksHardTricks = [];
      }

      dataLoaded = (
        easyTricks.length + hardTricks.length +
        oldschoolEasyTricks.length + oldschoolHardTricks.length +
        bodyvarialEasyTricks.length + bodyvarialHardTricks.length +
        airtricksEasyTricks.length + airtricksHardTricks.length
      ) > 0;
      dataLoadedForMode = mode;
      dataLoadedForDifficulty = difficulty;
      dataLoadedForOldschool = oldschool;
      dataLoadedForBodyvarial = bodyvarial;
      dataLoadedForAirtricks = airtricks;
    } catch (e) {
      console.error('Не удалось загрузить списки трюков для режима ' + mode + ':', e);
      dataLoaded = false;
    }

    await ensureHowtoLoaded();
  }

  // Howto.txt грузим один раз (одинаковый для всех режимов и сложностей,
  // включая Street) — общий хелпер, чтобы не дублировать между loadLists и
  // loadStreetLists.
  async function ensureHowtoLoaded() {
    if (howtoLinks.size > 0) return;
    try {
      const howtoRes = await fetch('data/Howto.txt');
      if (howtoRes.ok) {
        howtoLinks = parseReplacements(await howtoRes.text());
      }
    } catch (e) {
      console.warn('Файл data/Howto.txt не найден — кнопка Info будет искать в Google.');
    }
  }

  // ==== Street: список трюков собирается динамически из файлов на
  // препятствие (в отличие от Flat/Ramp с фиксированной парой easy/hard).
  // Загружаем/агрегируем заново только если изменилась "подпись" выбора —
  // сложность + набор включённых препятствий + Old School/Ins and Outs. ====
  let streetPool = [];
  let streetDataLoaded = false;
  let streetDataLoadedSignature = null;

  function getStreetSelectionSignature(difficulty) {
    const obstacleBits = STREET_OBSTACLES.map(o => (getStreetObstacle(o.key) ? '1' : '0')).join('');
    return difficulty + '|' + obstacleBits + '|' + (getStreetOldschool() ? '1' : '0') + '|' + (getStreetInsandouts() ? '1' : '0');
  }

  async function loadStreetLists(difficulty) {
    streetDataLoaded = false;
    const oldschool = getStreetOldschool();
    const insandouts = getStreetInsandouts();
    const signature = getStreetSelectionSignature(difficulty);

    try {
      let pool = [];
      for (const obstacle of STREET_OBSTACLES) {
        if (!getStreetObstacle(obstacle.key)) continue;

        pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, null, DIFFICULTY_EASY)));
        if (difficulty === DIFFICULTY_HARD) {
          pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, null, DIFFICULTY_HARD)));
        }

        if (oldschool) {
          pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, 'oldschool', DIFFICULTY_EASY)));
          if (difficulty === DIFFICULTY_HARD) {
            pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, 'oldschool', DIFFICULTY_HARD)));
          }
        }

        if (insandouts && obstacle.supportsInsandouts) {
          pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, 'insandouts', DIFFICULTY_EASY)));
          if (difficulty === DIFFICULTY_HARD) {
            pool = pool.concat(await fetchTrickList(streetFilePath(obstacle.fileKey, 'insandouts', DIFFICULTY_HARD)));
          }
        }
      }
      streetPool = pool;
      streetDataLoaded = pool.length > 0;
      streetDataLoadedSignature = signature;
    } catch (e) {
      console.error('Не удалось загрузить списки трюков для Street:', e);
      streetDataLoaded = false;
    }

    await ensureHowtoLoaded();
  }

  // Загружает данные для currentGameMode/текущей сложности/переключателей,
  // только если они ещё не были загружены именно для этой комбинации
  // (переключение Flat <-> Ramp, Easy <-> Hard или любого модификатора
  // вкл/выкл туда-обратно не должно каждый раз заново дёргать сеть).
  async function ensureListsLoaded() {
    if (currentGameMode === GAME_MODE_STREET) {
      const difficulty = getFlatDifficulty();
      const signature = getStreetSelectionSignature(difficulty);
      if (streetDataLoaded && streetDataLoadedSignature === signature) return;
      await loadStreetLists(difficulty);
      return;
    }

    const difficulty = getFlatDifficulty();
    const oldschool = getFlatOldschool();
    const bodyvarial = getFlatBodyvarial();
    const airtricks = getRampAirtricks();
    if (
      dataLoadedForMode === currentGameMode &&
      dataLoadedForDifficulty === difficulty &&
      dataLoadedForOldschool === oldschool &&
      dataLoadedForBodyvarial === bodyvarial &&
      dataLoadedForAirtricks === airtricks &&
      dataLoaded
    ) return;
    await loadLists(currentGameMode, difficulty, oldschool, bodyvarial, airtricks);
  }

  // Данные готовы для generateTrick() под ТЕКУЩИЙ режим/сложность/переключатели
  // прямо сейчас — используется в rollNextTrick(), чтобы решить, ждать ли
  // ensureListsLoaded() перед первой генерацией.
  function isDataReadyForCurrentMode() {
    if (currentGameMode === GAME_MODE_STREET) {
      return streetDataLoaded && streetDataLoadedSignature === getStreetSelectionSignature(getFlatDifficulty());
    }
    return dataLoaded && dataLoadedForMode === currentGameMode;
  }

  // Генерация трюка теперь — просто случайный выбор из подходящего списка,
  // собранного из easy/hard + любых включённых модификаторов (см. loadLists
  // для Flat/Ramp, loadStreetLists для Street). Никакого REROLL/веса/
  // сложности-суммы больше нет — за это отвечает то, в каком файле лежит трюк.
  function generateTrick() {
    if (currentGameMode === GAME_MODE_STREET) {
      if (streetPool.length === 0) return '';
      return streetPool[Math.floor(Math.random() * streetPool.length)];
    }
    const pool = easyTricks.concat(
      hardTricks,
      oldschoolEasyTricks, oldschoolHardTricks,
      bodyvarialEasyTricks, bodyvarialHardTricks,
      airtricksEasyTricks, airtricksHardTricks
    );
    if (pool.length === 0) return '';
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ==== Фильтр от повторов + сохранение между открытиями (localStorage) ====
  const HISTORY_SIZE = 30;
  const MAX_UNIQUE_ATTEMPTS = 30; // защита от зацикливания, если уникальных вариантов почти не осталось
  const STORAGE_KEY_HISTORY = 'goskate_recentResults';
  const STORAGE_KEY_LAST = 'goskate_lastResult';

  // Безопасные обёртки: некоторые webview (в т.ч. иногда внутри Telegram) могут
  // ограничивать доступ к localStorage — тогда просто работаем в режиме "только память".
  function loadFromStorage(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('localStorage недоступен, используем данные только в памяти:', e);
      return fallback;
    }
  }

  function saveToStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.warn('Не удалось сохранить в localStorage:', e);
    }
  }

  // Последние 15 результатов — не даём им повториться подряд
  let recentResults = loadFromStorage(STORAGE_KEY_HISTORY, []);

  // ==== Лог засчитанных/незасчитанных трюков ====
  const STORAGE_KEY_TRICKLIST = 'goskate_tricklist';
  const tricklistInner = document.getElementById('tricklistInner');
  const tricklistEl = document.getElementById('tricklist');
  const judgeButtonsEl = document.getElementById('judgeButtons');
  const btn1El = document.getElementById('btn1');
  const btn1VisualEl = document.getElementById('btn1Visual');
  const btnRetryEl = document.getElementById('btnRetry');
  const btnRetryVisualEl = document.getElementById('btnRetryVisual');
  const btn2El = document.getElementById('btn2');
  const btn2VisualEl = document.getElementById('btn2Visual');
  const landedCountEl = document.getElementById('landedCount');
  const failedCountEl = document.getElementById('failedCount');
  const logToggleBtn = document.getElementById('logToggleBtn');
  const logToggleImg = document.getElementById('logToggleImg');

  // btn1 теперь состоит из двух слоёв — невидимой кликабельной кнопки (btn1El)
  // и декоративной картинки поверх/под ней (btn1VisualEl). Скрывать/показывать
  // нужно оба сразу, иначе картинка Roll останется висеть после "скрытия".
  function setBtn1Visible(visible) {
    btn1El.classList.toggle('visible', visible);
    btn1VisualEl.classList.toggle('visible', visible);
  }

  // ==== Game over (любой режим): New Game / Quit Game — появляются только
  // ПОСЛЕ того, как текст об окончании игры допечатается в пузыре (см.
  // onComplete в triggerGameOver/triggerVersusGameOver/triggerArcadeGameOver). ====
  const btnNewGameEl = document.getElementById('btnNewGame');
  const btnNewGameVisualEl = document.getElementById('btnNewGameVisual');
  const btnQuitGameEl = document.getElementById('btnQuitGame');
  const btnQuitGameVisualEl = document.getElementById('btnQuitGameVisual');

  function setGameOverButtonsVisible(visible) {
    btnNewGameEl.classList.toggle('visible', visible);
    btnNewGameVisualEl.classList.toggle('visible', visible);
    btnQuitGameEl.classList.toggle('visible', visible);
    btnQuitGameVisualEl.classList.toggle('visible', visible);
  }

  btnNewGameEl.addEventListener('click', () => {
    doRestart();
  });

  btnQuitGameEl.addEventListener('click', () => {
    doQuit();
  });

  function setRetryVisible(visible) {
    btnRetryEl.classList.toggle('visible', visible);
    btnRetryVisualEl.classList.toggle('visible', visible);
  }

  let tricklistEntries = loadFromStorage(STORAGE_KEY_TRICKLIST, []); // [{text, status}], новые в начале

  const skateLettersImg = document.getElementById('skateLettersImg');
  const skateLettersImg2 = document.getElementById('skateLettersImg2');
  const difficultyBadgeImg = document.getElementById('difficultyBadgeImg');

  function updateDifficultyBadge() {
    const hard = getFlatDifficulty() === DIFFICULTY_HARD;
    // Раньше в versus использовался отдельный бейдж (images/versus mode/
    // Difficulty_*_versusmode.png) — теперь и там, и в single используется
    // один и тот же обычный Difficulty_easy.png/Difficulty_hard.png.
    const image = hard ? 'Difficulty_hard.png' : 'Difficulty_easy.png';
    difficultyBadgeImg.src = 'images/' + image + '?v=' + ASSET_VERSION;
  }

  // Пороги по количеству "Не засчитано" → какую картинку с буквами показывать.
  // Easy: буква каждые 3 ошибки, game over на 15-й.
  // Hard: буква на КАЖДОЙ ошибке, game over уже на 5-й (без лимита сложности трюков).
  const SKATE_STAGES_EASY = [
    { threshold: 0, image: 'Letters_null.png' },
    { threshold: 3, image: 'Letters_s.png' },
    { threshold: 6, image: 'Letters_sk.png' },
    { threshold: 9, image: 'Letters_ska.png' },
    { threshold: 12, image: 'Letters_skat.png' },
    { threshold: 15, image: 'Letters_skate.png' },
  ];
  const SKATE_STAGES_HARD = [
    { threshold: 0, image: 'Letters_null.png' },
    { threshold: 1, image: 'Letters_s.png' },
    { threshold: 2, image: 'Letters_sk.png' },
    { threshold: 3, image: 'Letters_ska.png' },
    { threshold: 4, image: 'Letters_skat.png' },
    { threshold: 5, image: 'Letters_skate.png' },
  ];
  const GAME_OVER_FAILS_EASY = 15;
  const GAME_OVER_FAILS_HARD = 5;
  let isGameOver = false;

  function getSkateStages() {
    return getFlatDifficulty() === DIFFICULTY_HARD ? SKATE_STAGES_HARD : SKATE_STAGES_EASY;
  }

  function getGameOverFails() {
    return getFlatDifficulty() === DIFFICULTY_HARD ? GAME_OVER_FAILS_HARD : GAME_OVER_FAILS_EASY;
  }

  function stageForFails(failedCount) {
    const stages = getSkateStages();
    let stage = stages[0];
    for (const s of stages) {
      if (failedCount >= s.threshold) stage = s;
    }
    return stage;
  }

  function updateSkateLetters(failedCount) {
    skateLettersImg.src = 'images/' + stageForFails(failedCount).image + '?v=' + ASSET_VERSION;
  }

  function triggerGameOver() {
    if (isGameOver) return;
    isGameOver = true;
    SoundEngine.setSlowdown(1.9, 0.82); // "теряющая питание пластинка" — темп и тон проседают
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    setTimeout(() => {
      setResultText('Game over!', false, () => {
        setGameOverButtonsVisible(true);
      });
      bubbleEl.classList.add('active');
    }, 120);
    judgeButtonsEl.classList.remove('visible');
    setBtn1Visible(false);
  }

  // ==== Arcade: банк skatebucks вместо букв SKATE, ставки вместо Landed/
  // Failed-цикла с автогенерацией. Иконка банка (центральный слот, тот же,
  // что у SKATE-букв) переключается по трём "тирам" достатка, число рядом с
  // ней (skatebucksAmountBigEl) — единственное место, где показан банк
  // (маленький дубль в шапке лога убрали — только landed/failed там остались). ====
  const betBtn50El = document.getElementById('betBtn50');
  const betBtn50VisualEl = document.getElementById('betBtn50Visual');
  const betBtn100El = document.getElementById('betBtn100');
  const betBtn100VisualEl = document.getElementById('betBtn100Visual');
  const betBtn500El = document.getElementById('betBtn500');
  const betBtn500VisualEl = document.getElementById('betBtn500Visual');
  const skatebucksImg = document.getElementById('skatebucksImg');
  const skatebucksAmountBigEl = document.getElementById('skatebucksAmountBig');
  const arcadeLandedCountEl = document.getElementById('arcadeLandedCount');
  const arcadeFailedCountEl = document.getElementById('arcadeFailedCount');

  // Две "линейки" ставок вместо одной фиксированной — какая активна, решает
  // текущий банк: пока меньше 1000, доступны 50/100/250 (Bet_50/100/250.png),
  // от 1000 и выше — уже 500/1000/1500 (Bet_500/1000/1500.png). Слоты (три
  // кнопки в ряду) остаются теми же тремя DOM-элементами — просто у каждого
  // на лету меняется и картинка, и то, какую сумму он на самом деле ставит.
  const ARCADE_BET_TIER_THRESHOLD = 1000;
  const ARCADE_BET_TIERS_LOW = [50, 100, 250];
  const ARCADE_BET_TIERS_HIGH = [500, 1000, 1500];

  const BET_SLOTS = [
    { amount: 50, el: betBtn50El, visual: betBtn50VisualEl },
    { amount: 100, el: betBtn100El, visual: betBtn100VisualEl },
    { amount: 500, el: betBtn500El, visual: betBtn500VisualEl },
  ];

  // Перечитывает актуальную линейку ставок по текущему банку и подставляет
  // в слоты и суммы, и картинки — вызывается из setBetButtonsVisible() перед
  // каждым показом, поэтому даже смена банка МЕЖДУ раундами (не только на
  // старте) сразу переключает линейку на нужную.
  function syncBetButtonAmounts() {
    const tierAmounts = skatebucks >= ARCADE_BET_TIER_THRESHOLD ? ARCADE_BET_TIERS_HIGH : ARCADE_BET_TIERS_LOW;
    BET_SLOTS.forEach((slot, i) => {
      slot.amount = tierAmounts[i];
      const img = slot.visual.querySelector('img');
      img.src = 'images/arcade/Bet_' + slot.amount + '.png?v=' + ASSET_VERSION;
      slot.el.setAttribute('aria-label', 'Bet ' + slot.amount);
    });
  }

  // Показывает только те ставки, которые реально по карману — если банк,
  // скажем, 70, из трёх кнопок останется только Bet_50 (специальных
  // "неактивных" картинок под остальные две не было прислано, поэтому прячем
  // целиком, а не тускним, как раньше с Easy/Hard на Street).
  function setBetButtonsVisible(visible) {
    syncBetButtonAmounts();
    BET_SLOTS.forEach(({ amount, el, visual }) => {
      const show = visible && amount <= skatebucks;
      el.classList.toggle('visible', show);
      visual.classList.toggle('visible', show);
    });
  }

  // ==== Arcade: карты-баффы. Три фиксированных слота на экране (не
  // прячутся/появляются поштучно — "always show on game window", просто
  // переключают _on.png/_off.png и кликабельность). ====
  const cardRerollEl = document.getElementById('cardReroll');
  const cardRerollVisualEl = document.getElementById('cardRerollVisual');
  const cardExtraTryEl = document.getElementById('cardExtraTry');
  const cardExtraTryVisualEl = document.getElementById('cardExtraTryVisual');
  const cardDoubleBetEl = document.getElementById('cardDoubleBet');
  const cardDoubleBetVisualEl = document.getElementById('cardDoubleBetVisual');
  const cardsShadowEl = document.getElementById('cardsShadow');

  const ARCADE_CARDS = [
    { key: 'reroll', prefix: 'Card_rerolltrick', el: cardRerollEl, visual: cardRerollVisualEl },
    { key: 'extratry', prefix: 'Card_extratry', el: cardExtraTryEl, visual: cardExtraTryVisualEl },
    { key: 'doublebet', prefix: 'Card_doublebet', el: cardDoubleBetEl, visual: cardDoubleBetVisualEl },
  ];

  // Базовая видимость блока карт целиком (плюс подложка Cards_shadows.png под
  // ними) — только в Arcade, на любом из трёх режимов (Flat/Ramp/Street).
  function setCardsVisible(visible) {
    cardsShadowEl.classList.toggle('visible', visible);
    ARCADE_CARDS.forEach(({ el, visual }) => {
      el.classList.toggle('visible', visible);
      visual.classList.toggle('visible', visible);
    });
  }

  // Доступна ли карта прямо сейчас: только пока реально ждём Landed/Failed по
  // уже допечатанному трюку (та же логика видимости, что у самих кнопок
  // Landed/Failed), карта ещё не использована в этом окне из 5 ходов, и для
  // Double Bet — банка хватает на удвоение ставки.
  function isCardAvailable(key) {
    if (!isArcadeActive() || isGameOver) return false;
    if (cardCooldowns[key] > 0) return false;
    if (pendingBetAmount == null) return false;
    if (!judgeButtonsEl.classList.contains('visible')) return false;
    if (key === 'doublebet' && skatebucks < pendingBetAmount) return false;
    // Пока идёт Extra Try (вторая попытка на тот же трюк) — Reroll и Double
    // Bet недоступны НА ЭТОТ ХОД, даже если сами не на кулдауне: перебросить
    // трюк или удвоить ставку посреди уже начатой бонусной попытки не должно
    // быть можно.
    if (extraTryAttempt !== 0 && (key === 'reroll' || key === 'doublebet')) return false;
    return true;
  }

  // Пересчитывает картинку (_on/_off) и кликабельность всех трёх карт —
  // вызывается в тех же точках, что и появление/исчезновение кнопок
  // Landed/Failed (см. judgeButtonsEl.classList), плюс сразу после
  // использования любой карты (её доступность меняется мгновенно).
  function syncCardVisuals() {
    ARCADE_CARDS.forEach(({ key, prefix, el, visual }) => {
      const available = isCardAvailable(key);
      el.classList.toggle('card-disabled', !available);
      const img = visual.querySelector('img');
      const cooldown = cardCooldowns[key];
      if (cooldown === ARCADE_CARD_COOLDOWN_TURNS) {
        // Только что использована, ещё ни одного тика не прошло — картинку
        // карты прячем целиком (не показываем даже голый _off.png), сквозь
        // пустой слот видна подложка Cards_shadows.png (см. #cardsShadow,
        // z-index ниже карт).
        visual.style.display = 'none';
      } else if (cooldown > 0) {
        // На кулдауне после первого тика — прогрессия _off_1 -> ... -> _off_4.
        visual.style.display = '';
        const suffix = '_' + (ARCADE_CARD_COOLDOWN_TURNS - cooldown);
        img.src = 'images/arcade/' + prefix + '_off' + suffix + '.png?v=' + ASSET_VERSION;
      } else {
        // Не на кулдауне (готова по счётчику), но недоступна по другой причине
        // (печать трюка, нет ставки, Double Bet не по карману, временная
        // блокировка Extra Try) — обычный _off.png, без прогрессии.
        visual.style.display = '';
        img.src = 'images/arcade/' + prefix + (available ? '_on' : '_off') + '.png?v=' + ASSET_VERSION;
      }
    });
  }

  // Ход (для кулдаунов карт) засчитывается по нажатию Landed/Failed — НЕ по
  // печати трюка в пузыре. Каждая карта тикает независимо: у каждой свой
  // кулдаун, отсчитывается с момента ЕЁ использования, а не общий на все три.
  function tickCardCooldowns() {
    let cooldownsChanged = false;
    let skipFlagsChanged = false;
    ARCADE_CARDS.forEach(({ key }) => {
      if (cardSkipNextTick[key]) {
        // Это разрешение раунда идёт сразу следом за использованием карты —
        // кулдаун за него не тратим, просто снимаем флаг: тикать начнём со
        // СЛЕДУЮЩЕГО такого разрешения.
        cardSkipNextTick[key] = false;
        skipFlagsChanged = true;
        return;
      }
      if (cardCooldowns[key] > 0) {
        cardCooldowns[key]--;
        cooldownsChanged = true;
      }
    });
    if (cooldownsChanged) setCardCooldownsFlag(cardCooldowns);
    if (skipFlagsChanged) setCardSkipNextTickFlag(cardSkipNextTick);
  }

  function arcadeBucksTier(amount) {
    if (amount <= 0) return 0;
    if (amount >= 2500) return 3;
    if (amount >= 500) return 2;
    return 1;
  }

  function updateArcadeBucksDisplay() {
    const tierSrc = 'images/arcade/Skatebucks_' + arcadeBucksTier(skatebucks) + '.png?v=' + ASSET_VERSION;
    skatebucksImg.src = tierSrc;
    skatebucksAmountBigEl.textContent = 'x ' + skatebucks;
  }

  function syncArcadeModeClass() {
    tricklistEl.classList.toggle('arcade-mode', isArcadeActive());
  }

  function triggerArcadeGameOver() {
    if (isGameOver) return;
    isGameOver = true;
    SoundEngine.setSlowdown(1.9, 0.82); // "теряющая питание пластинка" — темп и тон проседают
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    setTimeout(() => {
      setResultText('Game over! You ran out of skatebucks.', false, () => {
        setGameOverButtonsVisible(true);
      });
      bubbleEl.classList.add('active');
    }, 120);
    judgeButtonsEl.classList.remove('visible');
    setBetButtonsVisible(false);
    setBtn1Visible(false);
    syncCardVisuals(); // isGameOver уже true — все три карты сразу станут недоступны
  }

  // Общая генерация трюка для Arcade — та же механика, что у rollNextTrick(),
  // только текст пузыря заканчивается ставкой, а не сразу голым названием
  // трюка (см. описание задачи). Ставка уже списана к этому моменту (см.
  // placeBet), тут только генерируем и показываем. Параметр не нужен — тик
  // кулдаунов карт живёт в resolveArcadeBet() (по нажатию Landed/Failed), эта
  // функция сама по себе больше не влияет на кулдауны ни при обычном вызове,
  // ни при вызове из карты Reroll Trick.
  async function rollArcadeTrick() {
    if (isGameOver) return;
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    judgeButtonsEl.classList.remove('visible');
    syncCardVisuals(); // трюк ещё не готов — карты сразу недоступны, как Landed/Failed
    setRetryVisible(false);

    if (!isDataReadyForCurrentMode()) {
      setResultText('Списки трюков ещё загружаются...', false);
      bubbleEl.classList.add('active');
      await ensureListsLoaded();

      if (!isDataReadyForCurrentMode()) {
        setResultText('Connection problem, please try again later', false);
        bubbleEl.classList.add('active');
        setBetButtonsVisible(false);
        setRetryVisible(true);
        return;
      }
    }

    setTimeout(() => {
      bubbleEl.classList.add('active');
      const trick = generateUniqueTrick();
      currentDisplayedTrick = trick;
      extraTryAttempt = 0;
      setExtraTryAttemptFlag(0);
      const message = trick + '. Your bet is ' + pendingBetAmount + ' skatebucks.';
      setResultText(message, true, () => {
        judgeButtonsEl.classList.add('visible');
        syncCardVisuals();
      });
    }, 120);
  }

  // Нажатие одной из ставок: списывает банк сразу, логирует отложенное
  // приветственное сообщение (если это первая ставка новой игры — тот же
  // приём, что у btn1El для классического режима), кидает трюк.
  function placeBet(amount) {
    if (isGameOver) return;
    if (amount > skatebucks) return; // на случай гонки кликов — кнопка и так должна быть скрыта
    setActiveMode(GAME_MODE_CONFIG[currentGameMode].activeMode);
    pendingBetAmount = amount;
    setPendingBetFlag(amount);
    skatebucks -= amount;
    setSkatebucksFlag(skatebucks);
    updateArcadeBucksDisplay();
    setBetButtonsVisible(false);
    if (pendingModeStartMessage) {
      addTricklistEntry(pendingModeStartMessage, 'info');
      pendingModeStartMessage = null;
    }
    rollArcadeTrick();
  }

  BET_SLOTS.forEach((slot) => {
    slot.el.addEventListener('click', () => placeBet(slot.amount));
  });

  // ==== Reroll Trick: тот же трюк-слот, но заново — без каких-либо
  // изменений ставки/банка. ====
  function useRerollCard() {
    if (!isCardAvailable('reroll')) return;
    cardCooldowns.reroll = ARCADE_CARD_COOLDOWN_TURNS;
    setCardCooldownsFlag(cardCooldowns);
    cardSkipNextTick.reroll = true;
    setCardSkipNextTickFlag(cardSkipNextTick);
    addTricklistEntry('Reroll trick card used', 'info');
    syncCardVisuals();
    rollArcadeTrick();
  }
  cardRerollEl.addEventListener('click', useRerollCard);

  // ==== Extra Try: даёт вторую попытку на ТОТ ЖЕ трюк. Первая неудача не
  // засчитывается как проигрыш ставки — вместо этого пузырь сообщает, что
  // это последняя попытка, и снова открываются Landed/Failed (см. ветку
  // extraTryAttempt в обработчике btnFailed). ====
  function useExtraTryCard() {
    if (!isCardAvailable('extratry')) return;
    cardCooldowns.extratry = ARCADE_CARD_COOLDOWN_TURNS;
    setCardCooldownsFlag(cardCooldowns);
    cardSkipNextTick.extratry = true;
    setCardSkipNextTickFlag(cardSkipNextTick);
    addTricklistEntry('Extra try card used', 'info');
    extraTryAttempt = 1;
    setExtraTryAttemptFlag(1);

    judgeButtonsEl.classList.remove('visible');
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    syncCardVisuals();
    setTimeout(() => {
      bubbleEl.classList.add('active');
      const message = currentDisplayedTrick + '. You have 2 attempts for land it';
      setResultText(message, true, () => {
        judgeButtonsEl.classList.add('visible');
        syncCardVisuals();
      });
    }, 120);
  }
  cardExtraTryEl.addEventListener('click', useExtraTryCard);

  // ==== Double Bet: списывает со счёта ещё раз ту же сумму, что уже
  // поставлена (итог — ставка x2 полностью покрыта банком), и переносит эту
  // удвоенную сумму в pendingBetAmount — дальше обычный resolveArcadeBet сам
  // посчитает верную выплату/проигрыш по уже удвоенной ставке. ====
  function useDoubleBetCard() {
    if (!isCardAvailable('doublebet')) return;
    cardCooldowns.doublebet = ARCADE_CARD_COOLDOWN_TURNS;
    setCardCooldownsFlag(cardCooldowns);
    cardSkipNextTick.doublebet = true;
    setCardSkipNextTickFlag(cardSkipNextTick);
    addTricklistEntry('Double Bet card used', 'info');

    skatebucks -= pendingBetAmount;
    pendingBetAmount *= 2;
    setSkatebucksFlag(skatebucks);
    setPendingBetFlag(pendingBetAmount);
    updateArcadeBucksDisplay();

    judgeButtonsEl.classList.remove('visible');
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    syncCardVisuals();
    setTimeout(() => {
      bubbleEl.classList.add('active');
      const message = currentDisplayedTrick + '. Your bet is ' + pendingBetAmount + ' skatebucks.';
      setResultText(message, true, () => {
        judgeButtonsEl.classList.add('visible');
        syncCardVisuals();
      });
    }, 120);
  }
  cardDoubleBetEl.addEventListener('click', useDoubleBetCard);

  // Оценка трюка (Landed/Failed) в Arcade: выигрыш — банк х2 от ставки
  // (ставка уже была списана при placeBet, так что чистый прирост — ровно
  // ставка), проигрыш — банк остаётся как есть (ставка уже потеряна). Дальше:
  // хватает на минимальную ставку (50) — раунд продолжается, иначе Game Over.
  function resolveArcadeBet(landed) {
    if (isGameOver) return;
    // Тик кулдаунов карт — по нажатию Landed/Failed, когда трюк ДЕЙСТВИТЕЛЬНО
    // разрешается (resolveArcadeBet вызывается один раз на трюк: сразу на
    // Landed, или на Failed на последней попытке — но НЕ на промежуточном
    // "провале" бонусной попытки Extra Try, та ветка сюда не доходит).
    tickCardCooldowns();
    const bet = pendingBetAmount || 0;
    if (landed) {
      skatebucks += bet * 2;
      setSkatebucksFlag(skatebucks);
    }
    pendingBetAmount = null;
    setPendingBetFlag(null);
    extraTryAttempt = 0;
    setExtraTryAttemptFlag(0);
    updateArcadeBucksDisplay();

    if (skatebucks < ARCADE_MIN_BET) {
      triggerArcadeGameOver();
      return;
    }

    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    judgeButtonsEl.classList.remove('visible');
    syncCardVisuals(); // между раундами, пока не поставлена следующая ставка, — все карты недоступны
    setTimeout(() => {
      bubbleEl.classList.add('active');
      setResultText('Ok. Make a bet for a next trick.', false);
      setBetButtonsVisible(true);
    }, 120);
  }

  // ==== Versus (2 Player Flatground): по трюку каждый игрок ходит отдельно,
  // поэтому SKATE-буквы и Game Over считаются раздельно на каждого — первый,
  // кто набирает полное слово SKATE, проигрывает, а в пузыре объявляется
  // победитель (второй игрок). ====
  const landedCount1El = document.getElementById('landedCount1');
  const failedCount1El = document.getElementById('failedCount1');
  const landedCount2El = document.getElementById('landedCount2');
  const failedCount2El = document.getElementById('failedCount2');
  let versusFailed = { 1: 0, 2: 0 };

  // Картинка букв SKATE конкретного игрока (images/versus mode/) — суффикс
  // (null/s/sk/ska/skat/skate) берём из тех же порогов, что и для single, а
  // не дублируем их отдельным списком.
  function versusLetterSrc(player, failedCount) {
    const suffix = stageForFails(failedCount).image.replace('Letters_', '').replace('.png', '');
    return 'images/versus%20mode/Letters_skate_player' + player + '_' + suffix + '.png?v=' + ASSET_VERSION;
  }

  // Центральный слот #skateLetters (тот же, что у single) в versus-режиме
  // показывает буквы ИГРОКА, чей сейчас ход — чтобы было видно, кто рискует
  // проиграть прямо сейчас.
  // Показываются ПОСТОЯННО оба ряда сразу (Player 1 сверху, Player 2 снизу —
  // см. bbox альфа-канала в комментарии у CSS #skateLettersImg2), а не по
  // очереди в зависимости от текущего хода — сложности читать прогресс
  // только активного игрока, попросили показывать обоих одновременно.
  function refreshCentralLetters() {
    if (!isVersusActive()) return;
    skateLettersImg.src = versusLetterSrc(1, versusFailed[1]);
    skateLettersImg2.src = versusLetterSrc(2, versusFailed[2]);
  }

  function triggerVersusGameOver(winner) {
    if (isGameOver) return;
    isGameOver = true;
    SoundEngine.setSlowdown(1.9, 0.82); // "теряющая питание пластинка" — темп и тон проседают
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    setTimeout(() => {
      setResultText('Player ' + winner + ' wins!', false, () => {
        setGameOverButtonsVisible(true);
      });
      bubbleEl.classList.add('active');
    }, 120);
    judgeButtonsEl.classList.remove('visible');
    setBtn1Visible(false);
  }

  function renderTricklist() {
    tricklistInner.innerHTML = '';
    let landed = 0;
    let failed = 0;
    const landedByPlayer = { 1: 0, 2: 0 };
    const failedByPlayer = { 1: 0, 2: 0 };

    tricklistEntries.forEach(entry => {
      if (entry.status === 'landed') {
        landed++;
        if (entry.player === 1) landedByPlayer[1]++;
        else if (entry.player === 2) landedByPlayer[2]++;
      } else if (entry.status === 'failed') {
        failed++;
        if (entry.player === 1) failedByPlayer[1]++;
        else if (entry.player === 2) failedByPlayer[2]++;
      }
      // 'info' — системное сообщение (например, старт режима), не трюк:
      // не считается ни landed, ни failed.

      const row = document.createElement('div');
      row.className = 'trick-entry' + (entry.status === 'info' ? ' trick-entry-info' : '');

      if (entry.status !== 'info') {
        const icon = document.createElement('img');
        icon.src = (entry.status === 'landed' ? 'images/Icon_landed.png' : 'images/Icon_failed.png') + '?v=' + ASSET_VERSION;
        icon.alt = entry.status === 'landed' ? 'Засчитано' : 'Не засчитано';
        row.appendChild(icon);
      }

      const span = document.createElement('span');
      span.textContent = entry.text;

      row.appendChild(span);
      tricklistInner.appendChild(row);
    });

    updateDifficultyBadge();

    if (isVersusActive()) {
      versusFailed = failedByPlayer;
      landedCount1El.textContent = landedByPlayer[1];
      failedCount1El.textContent = failedByPlayer[1];
      landedCount2El.textContent = landedByPlayer[2];
      failedCount2El.textContent = failedByPlayer[2];
      refreshCentralLetters();

      if (!isGameOver) {
        const overFails = getGameOverFails();
        if (failedByPlayer[1] >= overFails) {
          triggerVersusGameOver(2);
        } else if (failedByPlayer[2] >= overFails) {
          triggerVersusGameOver(1);
        }
      }
    } else if (isArcadeActive()) {
      // Game over в Arcade решается не количеством ошибок, а размером банка
      // (см. resolveArcadeBet) — но на резюме страницы этот метод не
      // вызывается, поэтому проверка здесь дублирует его же условие: без
      // неё возврат в уже проигранную Arcade-игру не показал бы Game Over.
      // ВАЖНО: только когда нет ставки "в полёте" (pendingBetAmount === null) —
      // иначе этот же renderTricklist() вызывается ещё и изнутри placeBet()
      // (когда логируется приветственное сообщение), в момент когда банк уже
      // списан под ставку, но трюк ещё даже не оценён — без этого условия
      // игра ошибочно завершалась бы раньше, чем игрок успевал бы попробовать
      // трюк, на который только что поставил.
      arcadeLandedCountEl.textContent = landed;
      arcadeFailedCountEl.textContent = failed;
      updateArcadeBucksDisplay();

      if (!isGameOver && pendingBetAmount == null && skatebucks < ARCADE_MIN_BET) {
        triggerArcadeGameOver();
      }
    } else {
      landedCountEl.textContent = landed;
      failedCountEl.textContent = failed;
      updateSkateLetters(failed);

      if (failed >= getGameOverFails()) {
        triggerGameOver();
      }
    }
  }

  function addTricklistEntry(text, status, player) {
    const entry = { text, status };
    if (player === 1 || player === 2) entry.player = player;
    tricklistEntries.unshift(entry); // новая запись — наверх списка
    saveToStorage(STORAGE_KEY_TRICKLIST, tricklistEntries);
    renderTricklist();
  }

  renderTricklist();

  // ==== Разворачивание / сворачивание лога ====
  let logExpanded = false;

  function setLogExpanded(expanded) {
    logExpanded = expanded;
    tricklistEl.classList.toggle('expanded', expanded);
    logToggleImg.src = (expanded ? 'images/Button_minimize.png' : 'images/Button_expand.png') + '?v=' + ASSET_VERSION;
    logToggleBtn.setAttribute('aria-label', expanded ? 'Свернуть лог' : 'Развернуть лог');

    // Quit и Info перекрываются развёрнутым логом — прячем их на время,
    // чтобы не оставались кликабельны поверх/под ним.
    const hideForExpanded = expanded ? 'none' : '';
    btn2El.style.display = hideForExpanded;
    btn2VisualEl.style.display = hideForExpanded;
    btnInfoEl.style.display = hideForExpanded;
    btnInfoVisualEl.style.display = hideForExpanded;
  }

  logToggleBtn.addEventListener('click', () => {
    setLogExpanded(!logExpanded);
  });

  // Меняет анимацию земли/рампы и подгружает данные для currentGameMode.
  // Вызывается при возобновлении незавершённой игры и при старте новой (Easy/Hard).
  const flatgroundImg = document.querySelector('#flatground img');

  // ==== Versus (2 Player Flatground): свои картинки скейтера/тренера/пузыря/
  // кнопок Landed-Failed на каждого игрока (см. images/versus mode/) —
  // подменяются поверх обычных Flat-картинок на время хода игрока, и
  // возвращаются к обычным при выходе из versus (resetPlayerVisuals).
  // ВАЖНО: объявлено здесь, ДО блока восстановления незавершённой игры ниже
  // (он уже на этом шаге может вызвать applyPlayerVisuals для незавершённого
  // versus-раунда) — иначе получили бы ReferenceError (TDZ) на flatgroundImg
  // и остальных константах. ====
  const coachImg = document.querySelector('#coach img');
  const bubbleImg = document.querySelector('#bubble img');
  const btnLandedImg = document.querySelector('#btnLandedVisual img');
  const btnFailedImg = document.querySelector('#btnFailedVisual img');

  function syncVersusModeClass() {
    // tricklistEl объявлен чуть выше по файлу (см. "Лог засчитанных/незасчитанных трюков").
    tricklistEl.classList.toggle('versus-mode', isVersusActive());
  }

  function resetPlayerVisuals() {
    // Arcade: свой тренер (Animation_coach_arcade.png) вместо обычного —
    // сцена (flatground) в Arcade и так скрыта (см. applyGameModeVisuals),
    // так что это единственная "персонажная" картинка, которая там вообще
    // видна.
    coachImg.src = (isArcadeActive() ? 'images/arcade/Animation_coach_arcade.png' : 'images/Animation_coach.png') + '?v=' + ASSET_VERSION;
    bubbleImg.src = 'images/Text_bubble.png?v=' + ASSET_VERSION;
    btnLandedImg.src = 'images/Button_landed.png?v=' + ASSET_VERSION;
    btnFailedImg.src = 'images/Button_failed.png?v=' + ASSET_VERSION;
  }

  // Скейтер/сцена (flatgroundImg) на каждого игрока — теперь есть у ВСЕХ трёх
  // режимов (images/versus mode/Animation_<режим>_player1/2.png), а не только
  // у Flat.
  const VERSUS_GROUND_IMAGE_PREFIX = {
    [GAME_MODE_FLAT]: 'Animation_flatmode_player',
    [GAME_MODE_RAMP]: 'Animation_ramp_player',
    [GAME_MODE_STREET]: 'Animation_street_player',
  };

  function applyPlayerVisuals(player) {
    if (!isVersusActive()) return;
    const groundPrefix = VERSUS_GROUND_IMAGE_PREFIX[currentGameMode];
    if (groundPrefix) {
      flatgroundImg.src = 'images/versus%20mode/' + groundPrefix + player + '.png?v=' + ASSET_VERSION;
    }
    coachImg.src = 'images/versus%20mode/Animation_coach_player' + player + '.png?v=' + ASSET_VERSION;
    bubbleImg.src = player === 2
      ? 'images/versus%20mode/Text_bubble_player2.png?v=' + ASSET_VERSION
      : 'images/Text_bubble.png?v=' + ASSET_VERSION;
    btnLandedImg.src = 'images/versus%20mode/Button_landed_player' + player + '.png?v=' + ASSET_VERSION;
    btnFailedImg.src = 'images/versus%20mode/Button_failed_player' + player + '.png?v=' + ASSET_VERSION;
  }

  // Название трюка БЕЗ префикса "Player N try." — то, что реально ищет кнопка
  // Info (в howto.txt / гуглом). В single-режиме совпадает с текстом пузыря,
  // в versus — пузырь показывает "Player N try. <трюк>", а тут остаётся сам трюк.
  let currentDisplayedTrick = '';

  function buildVersusTrickMessage(player, trick) {
    return 'Player ' + player + ' try. ' + trick;
  }

  // Показываем последний сгенерированный результат сразу при открытии Flatmode.
  // Если трюк уже ждёт оценки — сразу показываем кнопки-иконки вместо Roll.
  // Если игра уже была завершена (15 ошибок / кто-то из игроков — вся SKATE /
  // банк Arcade меньше минимальной ставки) — вместо этого сразу показываем
  // Game over (см. renderTricklist() выше, которая уже вызвала
  // triggerGameOver/triggerVersusGameOver/triggerArcadeGameOver при первом рендере).
  if (isGameOver) {
    if (!isVersusActive() && !isArcadeActive()) triggerGameOver();
    if (isArcadeActive()) {
      setCardsVisible(true);
      syncCardVisuals();
    }
  } else if (isArcadeActive()) {
    // Arcade: lastResult сам по себе не чистится после оценки трюка (в
    // отличие от classic/versus, где сразу следует новый трюк), поэтому
    // "мы посреди хода" здесь определяет pendingBetAmount, а не сам факт
    // наличия lastResult — иначе уже оценённый трюк между ставками
    // восстановился бы как снова ожидающий Landed/Failed.
    const lastResult = loadFromStorage(STORAGE_KEY_LAST, '');
    setCardsVisible(true);
    if (pendingBetAmount != null && lastResult) {
      currentDisplayedTrick = lastResult;
      bubbleEl.classList.add('active');
      setBtn1Visible(false);
      setBetButtonsVisible(false);
      // Extra Try могла быть в процессе на момент закрытия — восстанавливаем
      // ровно тот текст, что видел игрок, а не стандартный "...Your bet is...".
      let restoredMessage = lastResult + '. Your bet is ' + pendingBetAmount + ' skatebucks.';
      if (extraTryAttempt === 1) {
        restoredMessage = lastResult + '. You have 2 attempts for land it';
      } else if (extraTryAttempt === 2) {
        restoredMessage = lastResult + '. Thats your last attempt to land it';
      }
      setResultText(restoredMessage, true, () => {
        judgeButtonsEl.classList.add('visible');
        syncCardVisuals();
      });
    } else {
      setBtn1Visible(false);
      setBetButtonsVisible(true);
      bubbleEl.classList.add('active');
      setResultText('Ok. Make a bet for a next trick.', false);
      syncCardVisuals();
    }
  } else {
    const lastResult = loadFromStorage(STORAGE_KEY_LAST, '');
    console.log('[GoSkate debug] restore check — isGameOver:', isGameOver, 'lastResult:', JSON.stringify(lastResult));
    if (lastResult) {
      currentDisplayedTrick = lastResult;
      bubbleEl.classList.add('active');
      setBtn1Visible(false);
      if (isVersusActive()) {
        pendingVersusTrick = lastResult;
        applyPlayerVisuals(currentTurn);
        setResultText(buildVersusTrickMessage(currentTurn, lastResult), true, () => {
          judgeButtonsEl.classList.add('visible');
        });
      } else {
        setResultText(lastResult, true, () => {
          judgeButtonsEl.classList.add('visible');
        });
      }
      console.log('[GoSkate debug] restored bubble/result, hid btn1');
    } else {
      console.log('[GoSkate debug] no lastResult found — leaving btn1 visible');
    }
  }

  function generateUniqueTrick() {
    let result;
    let attempts = 0;

    do {
      result = generateTrick();
      attempts++;
      // Пустой результат никогда не должен показываться пользователю — это
      // означает, что generateTrick() исчерпал попытки подобрать трюк по
      // правилам (см. MAX_REROLL_ATTEMPTS внутри неё). Пробуем ещё раз, а не
      // просто "как есть" — пустой трюк не более уникален, чем любой другой.
    } while ((result === '' || recentResults.includes(result)) && attempts < MAX_UNIQUE_ATTEMPTS);

    if (result === '') {
      // Совсем крайний случай: за все попытки не нашлось ни одного трюка.
      // Показываем что-то осмысленное вместо пустого пузыря.
      console.warn('generateUniqueTrick: не удалось подобрать трюк, показываю запасной вариант.');
      result = 'Trick';
    }

    recentResults.push(result);
    if (recentResults.length > HISTORY_SIZE) {
      recentResults.shift(); // убираем самый старый, окно "едет" вперёд
    }

    saveToStorage(STORAGE_KEY_HISTORY, recentResults);
    saveToStorage(STORAGE_KEY_LAST, result);

    return result;
  }

  // Общая функция генерации нового трюка (используется и кнопкой Roll, и кнопками-иконками)
  async function rollNextTrick() {
    if (isGameOver) return;
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    judgeButtonsEl.classList.remove('visible');
    setRetryVisible(false);

    if (!isDataReadyForCurrentMode()) {
      setResultText('Списки трюков ещё загружаются...', false);
      bubbleEl.classList.add('active');
      await ensureListsLoaded();

      if (!isDataReadyForCurrentMode()) {
        // Не получилось — показываем Retry вместо Roll/Landed/Failed, а в
        // пузыре вместо "загружается" — понятное сообщение об ошибке, и
        // пузырь НЕ прячем, чтобы сообщение оставалось видно рядом с Retry.
        // Само сообщение при этом никогда не попадает в лог трюков, т.к.
        // Landed/Failed в этот момент скрыты и некликабельны.
        setResultText('Connection problem, please try again later', false);
        bubbleEl.classList.add('active');
        setBtn1Visible(false);
        setRetryVisible(true);
        return;
      }
    }

    setTimeout(() => {
      bubbleEl.classList.add('active');
      currentDisplayedTrick = generateUniqueTrick();
      setResultText(currentDisplayedTrick, true, () => {
        judgeButtonsEl.classList.add('visible');
      });
    }, 120);
  }

  // ==== Versus (2 Player Flatground) — трюк генерируется ОДИН раз на раунд,
  // затем оба игрока пробуют его по очереди (сперва Player 1, потом Player 2
  // с тем же трюком), см. описание в задаче. startVersusRound() генерирует
  // новый трюк и открывает ход Player 1; continueVersusRound() либо передаёт
  // ход Player 2 (тот же трюк), либо, если уже ходил Player 2, начинает
  // новый раунд с новым трюком. ====
  async function startVersusRound() {
    if (isGameOver) return;
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    judgeButtonsEl.classList.remove('visible');
    setRetryVisible(false);

    if (!isDataReadyForCurrentMode()) {
      setResultText('Списки трюков ещё загружаются...', false);
      bubbleEl.classList.add('active');
      await ensureListsLoaded();

      if (!isDataReadyForCurrentMode()) {
        setResultText('Connection problem, please try again later', false);
        bubbleEl.classList.add('active');
        setBtn1Visible(false);
        setRetryVisible(true);
        return;
      }
    }

    currentTurn = 1;
    setVersusTurnFlag(1);
    applyPlayerVisuals(1);

    setTimeout(() => {
      bubbleEl.classList.add('active');
      const trick = generateUniqueTrick();
      pendingVersusTrick = trick;
      currentDisplayedTrick = trick;
      refreshCentralLetters();
      setResultText(buildVersusTrickMessage(1, trick), true, () => {
        judgeButtonsEl.classList.add('visible');
      });
    }, 120);
  }

  function continueVersusRound() {
    if (isGameOver) return;

    if (currentTurn === 1) {
      currentTurn = 2;
      setVersusTurnFlag(2);
      applyPlayerVisuals(2);
      refreshCentralLetters();

      bubbleEl.classList.remove('active');
      resultEl.textContent = '';
      judgeButtonsEl.classList.remove('visible');

      setTimeout(() => {
        bubbleEl.classList.add('active');
        currentDisplayedTrick = pendingVersusTrick;
        setResultText(buildVersusTrickMessage(2, pendingVersusTrick), true, () => {
          judgeButtonsEl.classList.add('visible');
        });
      }, 120);
    } else {
      startVersusRound();
    }
  }

  // Меняет анимацию земли/рампы и подгружает данные для currentGameMode
  // (сами константы flatgroundImg/coachImg/bubbleImg/btnLandedImg/btnFailedImg
  // и функции syncVersusModeClass/resetPlayerVisuals/applyPlayerVisuals
  // объявлены выше, перед блоком восстановления незавершённой игры — см. комментарий там).
  function applyGameModeVisuals() {
    flatgroundImg.src = GAME_MODE_CONFIG[currentGameMode].groundImage + '?v=' + ASSET_VERSION;
    // Arcade: сцену (Animation_flatmode/ramp/street.png) не показываем вовсе —
    // экран отдан под карты/ставки. #flatground img уже имеет свой CSS-правило
    // display:block, так что пустая строка корректно возвращает картинку
    // обратно при выходе из Arcade (в отличие от кнопок выше, тут это безопасно).
    flatgroundImg.style.display = isArcadeActive() ? 'none' : '';
    resetPlayerVisuals();
    syncVersusModeClass();
    syncArcadeModeClass();
    if (isVersusActive()) {
      applyPlayerVisuals(currentTurn);
    }
    ensureListsLoaded();
  }

  // На случай прямого захода в Mainscreen — подгружаем данные Flat заранее,
  // чтобы первый Roll не ждал сеть (Ramp подгрузится сам при выборе Easy/Hard).
  ensureListsLoaded();

  // Кнопка Start Game: первый бросок — прячет Start Game, показывает кнопки-иконки после печати
  btn1El.addEventListener('click', () => {
    setActiveMode(GAME_MODE_CONFIG[currentGameMode].activeMode);
    setBtn1Visible(false);
    if (pendingModeStartMessage) {
      addTricklistEntry(pendingModeStartMessage, 'info');
      pendingModeStartMessage = null;
    }
    if (isVersusActive()) {
      startVersusRound();
    } else {
      rollNextTrick();
    }
  });

  // Кнопки "засчитано / не засчитано": записывают текущий трюк в лог и сразу
  // кидают следующий — в versus-режиме текст уже содержит "Player N try. ..."
  // (см. buildVersusTrickMessage), лог записывает его как есть, с меткой
  // игрока, и передаёт ход дальше вместо генерации нового трюка сразу.
  document.getElementById('btnLanded').addEventListener('click', () => {
    if (isArcadeActive()) {
      // Порядок важен: сначала зачисляем выигрыш (resolveArcadeBet), ПОТОМ
      // логируем запись — иначе addTricklistEntry вызвал бы renderTricklist()
      // (и его проверку "хватает ли банка") ещё ДО того, как выигрыш зачтён,
      // и мог бы ошибочно объявить Game Over на пустом промежуточном балансе.
      // Тик кулдаунов карт — внутри resolveArcadeBet() (см. комментарий там).
      const text = resultEl.textContent;
      resolveArcadeBet(true);
      if (text) addTricklistEntry(text, 'landed');
      return;
    }
    if (isVersusActive()) {
      if (resultEl.textContent) addTricklistEntry(resultEl.textContent, 'landed', currentTurn);
      if (!isGameOver) continueVersusRound();
      return;
    }
    if (resultEl.textContent) addTricklistEntry(resultEl.textContent, 'landed');
    rollNextTrick();
  });

  document.getElementById('btnFailed').addEventListener('click', () => {
    if (isArcadeActive()) {
      if (extraTryAttempt === 1) {
        // Бонусная (первая) попытка от Extra Try не засчитана — ставка ЕЩЁ
        // не проиграна, даём последний шанс на этот же трюк (ТОТ ЖЕ трюк,
        // новый не генерируется — поэтому кулдауны карт тут не тикают,
        // см. rollArcadeTrick). В лог ничего не пишем здесь — одна итоговая
        // запись уйдёт по результату второй попытки (см. ветку ниже/Landed).
        extraTryAttempt = 2;
        setExtraTryAttemptFlag(2);
        judgeButtonsEl.classList.remove('visible');
        bubbleEl.classList.remove('active');
        resultEl.textContent = '';
        syncCardVisuals();
        setTimeout(() => {
          bubbleEl.classList.add('active');
          const message = currentDisplayedTrick + '. Thats your last attempt to land it';
          setResultText(message, true, () => {
            judgeButtonsEl.classList.add('visible');
            syncCardVisuals();
          });
        }, 120);
        return;
      }
      const text = resultEl.textContent;
      resolveArcadeBet(false);
      if (text) addTricklistEntry(text, 'failed');
      return;
    }
    if (isVersusActive()) {
      if (resultEl.textContent) addTricklistEntry(resultEl.textContent, 'failed', currentTurn);
      if (!isGameOver) continueVersusRound();
      return;
    }
    if (resultEl.textContent) addTricklistEntry(resultEl.textContent, 'failed');
    rollNextTrick();
  });

  // Retry: показывается вместо Roll, когда не удалось загрузить списки трюков
  // (обрыв связи и т.п.) — пробуем ещё раз.
  btnRetryEl.addEventListener('click', () => {
    setRetryVisible(false);
    if (isArcadeActive()) {
      rollArcadeTrick(); // ставка уже списана в placeBet, повторно генерируем тот же трюк
      return;
    }
    setBtn1Visible(true);
    if (isVersusActive()) {
      startVersusRound();
    } else {
      rollNextTrick();
    }
  });

  // Кнопка 2: показывает подтверждение вместо немедленного выхода
  const quitConfirmEl = document.getElementById('quitConfirm');

  // Кнопки на экране игры (Roll, Landed/Failed, разворачивание лога, Info) —
  // на время подтверждения выхода становятся некликабельны, активны только
  // QUIT и BACK. D-pad/Start/A/B консоли — чисто декоративные (просто меняют
  // картинку при нажатии, без игрового действия), поэтому не трогаем — они
  // должны работать всегда, независимо от состояния подтверждения выхода.
  function getOtherGameplayButtons() {
    return [
      btn1El,
      betBtn50El,
      betBtn100El,
      betBtn500El,
      cardRerollEl,
      cardExtraTryEl,
      cardDoubleBetEl,
      btnNewGameEl,
      btnQuitGameEl,
      btnRetryEl,
      logToggleBtn,
      btnInfoEl,
      document.getElementById('btnLanded'),
      document.getElementById('btnFailed'),
    ].filter(Boolean);
  }

  function showQuitConfirm() {
    btn2El.classList.add('mode-picker-hidden');
    quitConfirmEl.classList.add('visible');
    getOtherGameplayButtons().forEach((el) => el.classList.add('mode-picker-hidden'));
  }

  function hideQuitConfirm() {
    quitConfirmEl.classList.remove('visible');
    btn2El.classList.remove('mode-picker-hidden');
    getOtherGameplayButtons().forEach((el) => el.classList.remove('mode-picker-hidden'));
  }

  // Стирает сохранённый трюк, историю последних результатов и лог трюков,
  // возвращает на Mainscreen (Telegram-приложение НЕ закрывается)
  // Общий сброс состояния текущей игры (лог трюков, сохранённый последний
  // трюк, счётчики) — используется и при Quit (выход в меню), и при Restart
  // (начать заново, не выходя из текущего режима).
  // showReadyButtons=false — используется при Quit (см. doQuit): не показывать
  // Start Game/ставки вообще, экран всё равно сразу уезжает на Mainscreen —
  // иначе на долю секунды успевает мелькнуть "готов к игре" прямо перед
  // переходом. При Restart/New Game (showReadyButtons=true, по умолчанию)
  // кнопки нужны — там мы остаёмся на Flatmode для нового раунда.
  function resetGameState(showReadyButtons) {
    if (showReadyButtons === undefined) showReadyButtons = true;
    try {
      localStorage.removeItem(STORAGE_KEY_LAST);
      localStorage.removeItem(STORAGE_KEY_HISTORY);
      localStorage.removeItem(STORAGE_KEY_TRICKLIST);
    } catch (e) {
      console.warn('Не удалось очистить localStorage:', e);
    }
    recentResults = [];
    tricklistEntries = [];
    isGameOver = false;
    SoundEngine.setSlowdown(1, 1); // возвращаем обычный темп/тон — новый раунд не должен начинаться "заплетающимся языком"
    // Versus: и Quit, и Restart возвращают игру к "готов к ходу Player 1" —
    // Restart намеренно сохраняет currentIsVersus как есть (см. doRestart),
    // Quit сбрасывает его отдельно уже ПОСЛЕ этого вызова (см. doQuit).
    currentTurn = 1;
    setVersusTurnFlag(1);
    pendingVersusTrick = null;
    currentDisplayedTrick = '';

    // Arcade: тот же принцип, что у Versus/currentTurn выше — Restart
    // сохраняет currentIsArcade как есть (см. doRestart), Quit сбрасывает
    // его отдельно уже ПОСЛЕ этого вызова (см. doQuit). Банк — обратно к 100
    // в любом случае: и Restart, и Quit-затем-новая-игра должны начинать
    // Arcade с чистого листа, а не с прошлого баланса. Карты — туда же:
    // все три снова доступны, счётчик "5 ходов" и Extra Try обнуляются.
    pendingBetAmount = null;
    setPendingBetFlag(null);
    if (isArcadeActive()) {
      skatebucks = ARCADE_START_BUCKS;
      setSkatebucksFlag(skatebucks);
    }
    cardCooldowns = { reroll: 0, extratry: 0, doublebet: 0 };
    setCardCooldownsFlag(cardCooldowns);
    cardSkipNextTick = { reroll: false, extratry: false, doublebet: false };
    setCardSkipNextTickFlag(cardSkipNextTick);
    extraTryAttempt = 0;
    setExtraTryAttemptFlag(0);
    renderTricklist();

    // Прячем пузырь/текст и возвращаем кнопку Start Game (или ставки в
    // Arcade) на место, сворачиваем лог, чтобы экран был полностью чистым
    bubbleEl.classList.remove('active');
    resultEl.textContent = '';
    setInfoButtonVisible(false);
    judgeButtonsEl.classList.remove('visible');
    setRetryVisible(false);
    setLogExpanded(false);
    setGameOverButtonsVisible(false);
    if (!showReadyButtons) {
      setBtn1Visible(false);
      setBetButtonsVisible(false);
      setCardsVisible(false);
    } else if (isArcadeActive()) {
      setBtn1Visible(false);
      setBetButtonsVisible(true);
      setCardsVisible(true);
      syncCardVisuals();
    } else {
      setBtn1Visible(true);
      setBetButtonsVisible(false);
      setCardsVisible(false);
    }

    // Возвращаем скейтера/тренера/пузырь/кнопки к обычному виду, а если
    // versus остаётся активным (Restart) — сразу показываем Player 1, чтобы
    // не мелькал обычный скейтер до повторного нажатия Start Game.
    resetPlayerVisuals();
    if (isVersusActive()) applyPlayerVisuals(1);
  }

  function doQuit() {
    setActiveMode(0);
    resetGameState(false); // без "готов к игре"-кнопок — экран всё равно сразу уезжает на Mainscreen
    currentIsVersus = false;
    setVersusActiveFlag(false);
    syncVersusModeClass();
    currentIsArcade = false;
    setArcadeActiveFlag(false);
    syncArcadeModeClass();
    hideQuitConfirm();
    transitionToScreen(mainscreenEl);
  }

  // Restart: сбрасывает текущую игру (тот же режим и сложность), не выходя
  // на Mainscreen — просто снова экран "готов к Roll". Показывает то же
  // сообщение, что и при свежем старте, но с "restarts" вместо "starts" —
  // экран при этом не переключается, так что задержка перед показом минимальна.
  function doRestart() {
    const restartMessage = isArcadeActive()
      ? ARCADE_WELCOME_MESSAGE
      : buildModeStartMessage(currentGameMode, getFlatDifficulty(), 'restarts', isVersusActive());
    resetGameState();
    hideQuitConfirm();
    showModeStartMessage(restartMessage, 80);
    pendingModeStartMessage = restartMessage;
  }

  btn2El.addEventListener('click', () => {
    showQuitConfirm();
  });

  document.getElementById('btnQuitConfirm').addEventListener('click', () => {
    doQuit();
  });

  document.getElementById('btnQuitRestart').addEventListener('click', () => {
    doRestart();
  });

  document.getElementById('btnQuitBack').addEventListener('click', () => {
    hideQuitConfirm();
  });

  // Info: открывает обучающую ссылку для текущего сгенерированного трюка
  // (из howto.txt соответствующего режима), либо, если ссылки нет,
  // поисковый запрос в Google "How to <трюк> on a skateboard".
  btnInfoEl.addEventListener('click', () => {
    // currentDisplayedTrick — трюк БЕЗ префикса "Player N try." (в versus
    // resultEl.textContent содержит этот префикс и не подошёл бы для поиска).
    const trick = currentDisplayedTrick.trim();
    if (!trick) return;
    const url = howtoLinks.get(trick);
    if (url) {
      window.open(url, '_blank', 'noopener');
    } else {
      const query = 'How to ' + trick + ' on a skateboard';
      window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank', 'noopener');
    }
  });

  // ==== Кнопки консоли (D-pad, Start, A, B) — чисто декоративные (никакого
  // игрового действия), но теперь со звуком нажатия — см.
  // CONSOLE_BUTTON_SOUNDS/SoundEngine выше. Меняют картинку idle -> pushed,
  // пока зажаты. pointerdown/up/leave/cancel вместо click — так зажатая
  // кнопка не отпускает картинку сама раньше времени, работает и с мышью, и
  // с тачем; звук по той же причине повешен на pointerdown, а не click —
  // играет в точности в момент визуального "нажатия", не после отпускания.
  // Картинка теперь лежит в соседнем .console-btn-visual (полноразмерный слой),
  // а не внутри самой кнопки — кнопка это только маленькая кликабельная зона.
  const CONSOLE_BUTTON_SOUNDS = {
    up: 'dpadUp',
    down: 'dpadDown',
    left: 'dpadLeft',
    right: 'dpadRight',
    start: 'buttonStart',
    a: 'buttonA',
    b: 'buttonB',
  };

  document.querySelectorAll('.console-btn').forEach((btn) => {
    const name = btn.getAttribute('data-btn');
    const visual = btn.previousElementSibling;
    const img = visual.querySelector('img');
    const idleSrc = 'images/console/Button_' + name + '_idle.png?v=' + ASSET_VERSION;
    const pushedSrc = 'images/console/Button_' + name + '_pushed.png?v=' + ASSET_VERSION;

    const press = (e) => {
      e.preventDefault();
      img.src = pushedSrc;
      SoundEngine.play(CONSOLE_BUTTON_SOUNDS[name] || 'click');
    };
    const release = () => {
      img.src = idleSrc;
    };

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });
</script>
</body>
</html>
