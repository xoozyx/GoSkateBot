  function setStreetObstacle(obstacleKey, enabled) {
    setToggle('obstacle_' + obstacleKey, GAME_MODE_STREET, enabled);
  }

  // Old School и Ins and Outs (только Street) — как Old School/Body Varial у
  // Flat: просто вкл/выкл, добавляют файлы поверх обычных списков per-препятствие.
  function getStreetOldschool() {
    return getOldschool(GAME_MODE_STREET);
  }
  function setStreetOldschool(enabled) {
    setOldschool(GAME_MODE_STREET, enabled);
  }
  function getStreetInsandouts() {
    return getToggle('insandouts', GAME_MODE_STREET);
  }
  function setStreetInsandouts(enabled) {
    setToggle('insandouts', GAME_MODE_STREET, enabled);
  }

  // Препятствия Street: key — используется в id кнопок/hранилище, fileKey —
  // используется в имени файла data/Streetmode_tricks_<fileKey>_*.txt (у Curb
  // он исторически называется "slappy" — по названию трюков на бордюре — а
  // не "curb"), supportsInsandouts — только у этих есть отдельная пара
  // _insandouts_easy/_hard.txt файлов (Kicker и Stairs — нет, см. data/).
  const STREET_OBSTACLES = [
    { key: 'manualbox', label: 'Manual Box', fileKey: 'manualbox', supportsInsandouts: true },
    { key: 'kicker', label: 'Kicker', fileKey: 'kicker', supportsInsandouts: false },
    { key: 'curb', label: 'Curb', fileKey: 'slappy', supportsInsandouts: true },
    { key: 'stairs', label: 'Stairs', fileKey: 'stairs', supportsInsandouts: false },
    { key: 'ledge', label: 'Ledge', fileKey: 'ledge', supportsInsandouts: true },
    { key: 'rail', label: 'Rail', fileKey: 'rail', supportsInsandouts: true },
  ];

  function streetFilePath(fileKey, variant, difficulty) {
    const parts = ['Streetmode_tricks', fileKey];
    if (variant) parts.push(variant);
    parts.push(difficulty);
    return 'data/' + parts.join('_') + '.txt';
  }

  // ==== Навигация между экранами ====
  const logoScreen = document.getElementById('logoScreen');
  const mainscreenEl = document.getElementById('mainscreen');
  const flatmodeEl = document.getElementById('flatmode');
  const optionsscreenEl = document.getElementById('optionsscreen');
  const changeOverlay = document.getElementById('changeOverlay');
  const changeScreenImg = document.getElementById('changeScreenImg');

  const appEl = document.getElementById('app');

  function showScreen(el) {
    [mainscreenEl, flatmodeEl, optionsscreenEl].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    appEl.classList.toggle('zoomed', el === flatmodeEl);
    // Хип-хоп на Mainscreen и Options (тот же фон/музыка, что и главный
    // экран — попросили явно), сёрф-панк во время игры — музыка не
    // выключается, просто переключается на другой трек.
    SoundEngine.startMusic(el === flatmodeEl ? 'punk' : 'hiphop');
  }

  // ==== Заставка (Intro_screen.png): 15 кадров по 83мс = 1245мс на один проигрыш.
  // Показываем ровно один цикл, чтобы анимация не зациклилась повторно ==== 
  const LOGO_DURATION_MS = 1245;

  setTimeout(() => {
    logoScreen.classList.add('hidden');
    const activeMode = getActiveMode();
    const resumeMode = getGameModeByActiveMode(activeMode);
    if (resumeMode) {
      currentGameMode = resumeMode;
      applyGameModeVisuals();
      showScreen(flatmodeEl);
    } else {
      // Street пока не реализован — на всякий случай сбрасываем неизвестный флаг
      // и открываем Mainscreen, чтобы не застрять на пустом экране.
      if (activeMode !== 0) setActiveMode(0);
      showScreen(mainscreenEl);
    }
  }, LOGO_DURATION_MS);

  // ==== Анимация перехода между экранами (Change_screen.png): 9 кадров по 83мс = 747мс.
  // Экран меняется "под прикрытием" ровно в середине анимации, сама анимация проигрывается один раз.
  const CHANGE_DURATION_MS = 747;
  const CHANGE_SWAP_AT_MS = 374;

  function transitionToScreen(targetEl) {
    // Перезапускаем APNG с первого кадра (иначе она просто продолжит бесконечный цикл)
    changeScreenImg.src = 'images/Change_screen.png?t=' + Date.now();
    changeOverlay.classList.add('visible');

    setTimeout(() => {
      showScreen(targetEl);
    }, CHANGE_SWAP_AT_MS);

    setTimeout(() => {
      changeOverlay.classList.remove('visible');
    }, CHANGE_DURATION_MS);
  }

  // Kнопки Flat/Ramp на Mainscreen — открывают выбор сложности (Easy/Hard);
  // остальные две кнопки режима прячутся под тенью, пока выбор открыт.
  // Кнопка, которая открыла выбор, остаётся видна поверх тени, но больше не
  // кликабельна — назад возвращает отдельная кнопка Quit.
  const flatDifficultyPickerEl = document.getElementById('flatDifficultyPicker');
  const rampDifficultyPickerEl = document.getElementById('rampDifficultyPicker');
  const streetDifficultyPickerEl = document.getElementById('streetDifficultyPicker');
  const modeFlatEl = document.getElementById('modeFlat');
  const modeFlatVisualEl = document.getElementById('modeFlatVisual');
  const modeRampEl = document.getElementById('modeRamp');
  const modeRampVisualEl = document.getElementById('modeRampVisual');
  const modeStreetEl = document.getElementById('modeStreet');
  const modeStreetVisualEl = document.getElementById('modeStreetVisual');
  const mainscreenQuitEl = document.getElementById('mainscreenQuit');
  const mainscreenQuitVisualEl = document.getElementById('mainscreenQuitVisual');
  const mainscreenOptionsEl = document.getElementById('mainscreenOptions');
  const mainscreenOptionsVisualEl = document.getElementById('mainscreenOptionsVisual');

  function closeAllDifficultyPickers() {
    flatDifficultyPickerEl.classList.remove('visible');
    rampDifficultyPickerEl.classList.remove('visible');
    streetDifficultyPickerEl.classList.remove('visible');
    mainscreenQuitEl.classList.remove('visible');
    mainscreenQuitVisualEl.classList.remove('visible');
    mainscreenOptionsEl.classList.remove('picker-open');
    mainscreenOptionsVisualEl.classList.remove('picker-open');
    [modeFlatEl, modeFlatVisualEl, modeRampEl, modeRampVisualEl, modeStreetEl, modeStreetVisualEl].forEach((el) => {
      el.classList.remove('mode-picker-hidden', 'above-picker-shadow');
    });
  }

  // Открывает выбор сложности для одного режима: кнопка, которая его открыла,
  // остаётся полностью видна ПОВЕРХ тени (above-picker-shadow), но больше не
  // кликабельна (mode-picker-hidden отключает клики, не пряча картинку) —
  // выйти обратно можно только через кнопку Quit. Две другие кнопки режима
  // остаются на месте, но притемняются тенью снизу — не прячутся полностью.
  function openDifficultyPicker(pickerEl, ownButtons, otherButtons) {
    closeAllDifficultyPickers();
    pickerEl.classList.add('visible');
    mainscreenQuitEl.classList.add('visible');
    mainscreenQuitVisualEl.classList.add('visible');
    mainscreenOptionsEl.classList.add('picker-open');
    mainscreenOptionsVisualEl.classList.add('picker-open');
    ownButtons.forEach((el) => el.classList.add('above-picker-shadow', 'mode-picker-hidden'));
    otherButtons.forEach((el) => el.classList.add('mode-picker-hidden'));
  }

  // ==== Options: открывается с Mainscreen кнопкой Button_options.png (тот же
  // угол, что и Quit/Back — см. CSS), закрывается своим Quit обратно на
  // Mainscreen. Фон и музыка те же, что у Mainscreen — ничего специально
  // переключать не нужно, showScreen() уже даёт Options трек 'hiphop'. ====
  mainscreenOptionsEl.addEventListener('click', () => {
    if (flatDifficultyPickerEl.classList.contains('visible')
      || rampDifficultyPickerEl.classList.contains('visible')
      || streetDifficultyPickerEl.classList.contains('visible')) return;
    syncOptionsVolumeVisuals();
    transitionToScreen(optionsscreenEl);
  });

  document.getElementById('optionsQuit').addEventListener('click', () => {
    transitionToScreen(mainscreenEl);
  });

  // ==== Карусель громкости: показывает текущий уровень 0..5 картинкой,
  // по клику прибавляет 1 и заворачивает 5 -> 0 (SoundEngine.cycleMusicVolume/
  // cycleSfxVolume уже сами оборачивают и применяют громкость "на лету"). ====
  const optionsMusicVolumeImg = document.querySelector('#optionsMusicVolumeVisual img');
  const optionsSoundVolumeImg = document.querySelector('#optionsSoundVolumeVisual img');

  function syncOptionsVolumeVisuals() {
    optionsMusicVolumeImg.src = 'images/options/Button_options_music_' + SoundEngine.getMusicVolume() + '.png?v=' + ASSET_VERSION;
    optionsSoundVolumeImg.src = 'images/options/Button_options_sound_' + SoundEngine.getSfxVolume() + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('optionsMusicVolume').addEventListener('click', () => {
    SoundEngine.cycleMusicVolume();
    syncOptionsVolumeVisuals();
  });

  document.getElementById('optionsSoundVolume').addEventListener('click', () => {
    SoundEngine.cycleSfxVolume();
    syncOptionsVolumeVisuals();
  });

  syncOptionsVolumeVisuals();

  // ==== Карусель фона (Background_0/1.png): тот же принцип, что у громкости
  // (карусель, +1 по клику, заворачивает по кругу), только вариантов всего
  // два и меняет не звук, а картинку #consoleBackground — а он ОБЩИЙ для
  // всех экранов (Mainscreen/Options/Flatmode — лежит вне .screen, см. CSS),
  // поэтому смена фона в Options applies сразу везде, не только тут. ====
  const STORAGE_KEY_BACKGROUND = 'goskate_background';
  const BACKGROUND_COUNT = 3; // Background_0.png / Background_1.png / Background_2.png
  const consoleBackgroundImgEl = document.getElementById('consoleBackgroundImg');
  const optionsBackgroundImg = document.querySelector('#optionsBackgroundVisual img');

  function getBackgroundLevel() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY_BACKGROUND), 10);
      return v >= 0 && v < BACKGROUND_COUNT ? v : 0;
    } catch (e) {
      return 0;
    }
  }

  function applyBackgroundLevel(level) {
    consoleBackgroundImgEl.src = 'images/console/Background_' + level + '.png?v=' + ASSET_VERSION;
    optionsBackgroundImg.src = 'images/options/Button_options_background_' + level + '.png?v=' + ASSET_VERSION;
  }

  function setBackgroundLevel(level) {
    const wrapped = ((level % BACKGROUND_COUNT) + BACKGROUND_COUNT) % BACKGROUND_COUNT;
    try {
      localStorage.setItem(STORAGE_KEY_BACKGROUND, String(wrapped));
    } catch (e) { /* не критично, просто не запомним между сессиями */ }
    applyBackgroundLevel(wrapped);
    return wrapped;
  }

  document.getElementById('optionsBackground').addEventListener('click', () => {
    setBackgroundLevel(getBackgroundLevel() + 1);
  });

  // Применяем сохранённый фон сразу при загрузке (не дожидаясь захода в Options) —
  // и на #consoleBackground (сразу видно на заставке/Mainscreen), и на самой
  // кнопке-карусели (чтобы Options при открытии сразу показывал верную картинку).
  applyBackgroundLevel(getBackgroundLevel());

  document.getElementById('modeFlat').addEventListener('click', () => {
    if (flatDifficultyPickerEl.classList.contains('visible')) return;
    syncOldschoolToggleVisual();
    syncBodyvarialToggleVisual();
    syncPlayerSelectToggleVisual();
    syncModeSelectToggleVisual();
    openDifficultyPicker(
      flatDifficultyPickerEl,
      [modeFlatEl, modeFlatVisualEl],
      [modeRampEl, modeStreetEl]
    );
  });

  document.getElementById('modeRamp').addEventListener('click', () => {
    if (rampDifficultyPickerEl.classList.contains('visible')) return;
    syncAirtricksToggleVisual();
    rampPlayerSelectToggle.sync();
    rampModeSelectToggle.sync();
    openDifficultyPicker(
      rampDifficultyPickerEl,
      [modeRampEl, modeRampVisualEl],
      [modeFlatEl, modeStreetEl]
    );
  });

  document.getElementById('modeStreet').addEventListener('click', () => {
    if (streetDifficultyPickerEl.classList.contains('visible')) return;
    syncStreetOldschoolToggleVisual();
    syncStreetInsandoutsToggleVisual();
    syncAllStreetObstacleVisuals();
    syncStreetModeButtons();
    streetPlayerSelectToggle.sync();
    streetModeSelectToggle.sync();
    openDifficultyPicker(
      streetDifficultyPickerEl,
      [modeStreetEl, modeStreetVisualEl],
      [modeFlatEl, modeRampEl]
    );
  });

  mainscreenQuitEl.addEventListener('click', () => {
    closeAllDifficultyPickers();
  });

  // ==== Сообщение "режим начался" — показывается в пузыре при старте новой
  // игры (клик по Easy/Hard на Mainscreen) и затем попадает в лог трюков как
  // системная запись (без иконки landed/failed, см. addTricklistEntry). ====
  // Собирает список в формате "A", "A and B" или "A, B and C" (Oxford-style,
  // без запятой перед последним "and").
  function joinWithAnd(items) {
    if (items.length <= 1) return items.join('');
    if (items.length === 2) return items[0] + ' and ' + items[1];
    return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function buildModeStartMessage(mode, difficulty, verb, isVersus) {
    verb = verb || 'starts';
    const difficultyLabel = capitalize(difficulty);
    let label;
    // "Стилевые" модификаторы (Oldschool, Body Varial, Ins and Outs, Air) —
    // объединяются в одну фразу с общим суффиксом "Tricks" на конце
    // (см. joinWithAnd + ' Tricks' ниже), а не перечисляются каждый со своим.
    const modifiers = [];
    // Versus (2 Player) — вставляется между "mode starts" и "with ..."
    // отдельным куском для ЛЮБОГО режима (Flat/Ramp/Street), а не
    // модификатором, т.к. это не про трюки, а про сам режим игры (сколько
    // игроков).
    const versusPart = isVersus ? ' for 2 players' : '';

    if (mode === GAME_MODE_FLAT) {
      label = 'Flatground';
      if (getOldschool(GAME_MODE_FLAT)) modifiers.push('Oldschool');
      if (getBodyvarial(GAME_MODE_FLAT)) modifiers.push('Body Varial');
    } else if (mode === GAME_MODE_RAMP) {
      label = 'Ramp';
      if (getAirtricks(GAME_MODE_RAMP)) modifiers.push('Air');
    } else if (mode === GAME_MODE_STREET) {
      label = 'Street';
      if (getStreetOldschool()) modifiers.push('Oldschool');
      if (getStreetInsandouts()) modifiers.push('Ins and Outs');

      const selectedObstacles = STREET_OBSTACLES.filter(o => getStreetObstacle(o.key));
      if (selectedObstacles.length === 0) {
        return label + ' ' + difficultyLabel + ' mode ' + verb + ', but no obstacles are selected — pick at least one.';
      }
      const obstaclesText = selectedObstacles.length === STREET_OBSTACLES.length
        ? 'all obstacles'
        : joinWithAnd(selectedObstacles.map(o => o.label));

      let message = difficultyLabel + ' ' + label + ' mode ' + verb + versusPart;
      if (modifiers.length > 0) {
        message += ' with ' + joinWithAnd(modifiers) + ' Tricks';
      }
      message += ' on ' + obstaclesText;
      return message + '.';
    } else {
      label = 'Game';
    }

    let message = difficultyLabel + ' ' + label + ' mode ' + verb + versusPart;
    if (modifiers.length > 0) {
      message += ' with ' + joinWithAnd(modifiers) + ' Tricks';
    }
    return message + '.';
  }

  // Сообщение о старте режима ждёт здесь до нажатия Start Game — в лог
  // попадает не сразу по клику Easy/Hard, а вместе с первым сгенерированным
  // трюком (см. btn1El.addEventListener ниже).
  let pendingModeStartMessage = null;

  function showModeStartMessage(text, delayMs) {
    // Ждём delayMs (для свежего старта — пока анимация смены экрана дорисует
    // новый экран, см. transitionToScreen, иначе пузырь мелькнёт ещё поверх
    // Mainscreen; для restart — экран не меняется, так что задержка минимальна).
    setTimeout(() => {
      bubbleEl.classList.add('active');
      setResultText(text, false);
    }, delayMs);
  }

  function startGameWithDifficulty(mode, difficulty) {
    // Versus (2 Player) — выбирается через Player Select на пикере
    // соответствующего режима (Flat/Ramp/Street — у каждого свой переключатель,
    // см. getPlayerSelectForMode). Считаем ДО построения сообщения — иначе
    // оно бы отражало ещё СТАРОЕ состояние currentIsVersus (от предыдущей
    // игры), а не новое.
    const wantVersus = getPlayerSelectForMode(mode) === PLAYER_SELECT_VERSUS;
    // Arcade — свой Mode Select у каждого режима (см. getModeSelectForMode).
    // НЕ работает одновременно с Versus (ставки на банк одного игрока не
    // определены для 2 игроков) — если оба выставлены разом, Versus побеждает.
    const wantArcade = !wantVersus && getModeSelectForMode(mode) === MODE_SELECT_ARCADE;
    const startMessage = wantArcade
      ? ARCADE_WELCOME_MESSAGE
      : buildModeStartMessage(mode, difficulty, 'starts', wantVersus);
    currentGameMode = mode;
    setDifficulty(mode, difficulty);

    currentIsVersus = wantVersus;
    setVersusActiveFlag(currentIsVersus);
    currentTurn = 1;
    setVersusTurnFlag(1);
    pendingVersusTrick = null;
    syncVersusModeClass();

    currentIsArcade = wantArcade;
    setArcadeActiveFlag(currentIsArcade);
    if (currentIsArcade) {
      skatebucks = ARCADE_START_BUCKS;
      setSkatebucksFlag(skatebucks);
    }
    pendingBetAmount = null;
    setPendingBetFlag(null);
    cardCooldowns = { reroll: 0, extratry: 0, doublebet: 0 };
    setCardCooldownsFlag(cardCooldowns);
    cardSkipNextTick = { reroll: false, extratry: false, doublebet: false };
    setCardSkipNextTickFlag(cardSkipNextTick);
    extraTryAttempt = 0;
    setExtraTryAttemptFlag(0);
    syncArcadeModeClass();

    applyGameModeVisuals();
    updateDifficultyBadge();

    // Буквы SKATE (в versus — сразу оба ряда) / банк skatebucks (в arcade)
    // должны показывать актуальное значение с самого появления экрана, а не
    // только после первого renderTricklist() (он случится лишь при нажатии
    // Start Game/ставки) — иначе до этого момента видна картинка, оставшаяся
    // от ПРЕДЫДУЩЕЙ игры/режима: отсюда был баг с "половиной букв"/наложением
    // при переключении single <-> versus (тот же класс бага возможен и здесь).
    if (currentIsVersus) {
      versusFailed = { 1: 0, 2: 0 };
      refreshCentralLetters();
    } else if (currentIsArcade) {
      updateArcadeBucksDisplay();
    } else {
      updateSkateLetters(0);
    }

    // Arcade: ставки вместо Start Game — сама кнопка "начать" тут не нужна,
    // первая же ставка одновременно и начинает игру, и кидает первый трюк.
    // Карты видны "always" на весь Arcade-раунд, но пока нет ставки —
    // недоступны (см. isCardAvailable), поэтому сразу серые (_off.png).
    if (currentIsArcade) {
      setBtn1Visible(false);
      setBetButtonsVisible(true);
      setCardsVisible(true);
      syncCardVisuals();
    } else {
      setBtn1Visible(true);
      setBetButtonsVisible(false);
      setCardsVisible(false);
    }
    setGameOverButtonsVisible(false);

    closeAllDifficultyPickers();
    transitionToScreen(flatmodeEl);
    showModeStartMessage(startMessage, CHANGE_SWAP_AT_MS + 80);
    pendingModeStartMessage = startMessage;
  }

  document.getElementById('modeFlatEasy').addEventListener('click', () => {
    startGameWithDifficulty(GAME_MODE_FLAT, DIFFICULTY_EASY);
  });

  document.getElementById('modeFlatHard').addEventListener('click', () => {
    startGameWithDifficulty(GAME_MODE_FLAT, DIFFICULTY_HARD);
  });

  document.getElementById('modeRampEasy').addEventListener('click', () => {
    startGameWithDifficulty(GAME_MODE_RAMP, DIFFICULTY_EASY);
  });

  // ==== Переключатель Old School (только Flat) — просто вкл/выкл, картинка
  // меняется местами (_on/_off), состояние сохраняется на будущее. Всегда
  // привязан к GAME_MODE_FLAT явно (а не к currentGameMode) — иначе, если
  // currentGameMode всё ещё указывает на Ramp с прошлой игры, переключение
  // тут же после открытия picker'а Flat читало/писало бы флаг не туда. ====
  const toggleOldschoolImg = document.querySelector('#toggleOldschoolVisual img');

  function syncOldschoolToggleVisual() {
    const on = getOldschool(GAME_MODE_FLAT);
    toggleOldschoolImg.src = 'images/Button_mainmenu_flat_oldschool_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('toggleOldschool').addEventListener('click', () => {
    setOldschool(GAME_MODE_FLAT, !getOldschool(GAME_MODE_FLAT));
    syncOldschoolToggleVisual();
  });

  // ==== Переключатель Body Varial (только Flat) — тот же принцип, что и Old
  // School: просто вкл/выкл, добавляет свою пару _easy/_hard файлов. ====
  const toggleBodyvarialImg = document.querySelector('#toggleBodyvarialVisual img');

  function syncBodyvarialToggleVisual() {
    const on = getBodyvarial(GAME_MODE_FLAT);
    toggleBodyvarialImg.src = 'images/Button_mainmenu_flat_bodyvarial_' + (on ? 'on' : 'off') + '.png?v=' + ASSET_VERSION;
  }

  document.getElementById('toggleBodyvarial').addEventListener('click', () => {
    setBodyvarial(GAME_MODE_FLAT, !getBodyvarial(GAME_MODE_FLAT));
    syncBodyvarialToggleVisual();
  });

  // ==== Переключатель Player Select (Single / Versus, только Flat) — тот же
  // принцип, что Old School/Body Varial: одна кнопка, картинка меняется между
  // двумя состояниями. В отличие от Mode Select, реально влияет на игру —
  // читается один раз в startGameWithDifficulty() при нажатии Easy/Hard. ====
  const togglePlayerSelectImg = document.querySelector('#togglePlayerSelectVisual img');

  function syncPlayerSelectToggleVisual() {
    const versus = getPlayerSelect() === PLAYER_SELECT_VERSUS;
    togglePlayerSelectImg.src = 'images/Button_mainmenu_flat_playerselect_' + (versus ? 'versus' : 'single') + '.png?v=' + ASSET_VERSION;

    syncPlayerSelectToggleVisual();

  // ==== Переключатель Mode Select (Arcade / Classic, только Flat) — пока
  // ничего не меняет в самой игре, просто переключает картинку и сохраняет
  // выбор на будущее. ====
  const toggleModeSelectImg = document.querySelector('#toggleModeSelectVisual img');

  function syncModeSelectToggleVisual() {
    const arcade = getModeSelect() === MODE_SELECT_ARCADE;

    syncModeSelectToggleVisual();
