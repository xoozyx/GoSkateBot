<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Главное меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe9ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #result {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 420px;
    min-height: 1.4em;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #1b333a;
    padding: 6px 10px;
    box-sizing: border-box;
    word-wrap: break-word;
  }

  #menu {
    position: relative;
    width: min(90vw, 90vh, 440px);
    height: min(90vw, 90vh, 440px);
    background-image: url('images/Main_menu_background.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    image-rendering: pixelated; /* убрать при желании более плавного масштабирования */
  }

  .menu-button {
    position: absolute;
    width: 34%;
    aspect-ratio: 1 / 1;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: none;
    cursor: pointer;
    padding: 0;
    background-color: transparent;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease;
    image-rendering: pixelated;
  }

  .menu-button:active {
    transform: scale(0.93);
  }

  #btn1 {
    background-image: url('images/Main_menu_button_01.png');
    left: 15%;
    top: 38%;
  }

  #btn2 {
    background-image: url('images/Main_menu_button_02.png');
    right: 15%;
    top: 38%;
  }

  .label {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 100%;
    margin-top: 6px;
    font-size: 12px;
    color: #2c4a52;
  }

  .btn-wrap {
    position: absolute;
    width: 34%;
    top: 38%;
  }
  #wrap1 { left: 15%; }
  #wrap2 { right: 15%; }

  .btn-wrap .menu-button {
    position: static;
    width: 100%;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="result"></div>
    <div id="menu">
      <div class="btn-wrap" id="wrap1">
        <button class="menu-button" id="btn1" aria-label="Кнопка 1"></button>
        <div class="label">Кнопка 1</div>
      </div>
      <div class="btn-wrap" id="wrap2">
        <button class="menu-button" id="btn2" aria-label="Закрыть"></button>
        <div class="label">Закрыть</div>
      </div>
    </div>
  </div>

<script>
  // Инициализация Telegram Web App SDK (если открыто внутри Telegram)
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ==== Генератор трюков ====
  const resultEl = document.getElementById('result');

  let additions = [];
  let mainTricks = [];
  let dataLoaded = false;
  let hasResult = false; // есть ли сейчас текст на экране

  // Загружаем оба списка из текстовых файлов рядом со страницей
  async function loadLists() {
    try {
      const [addRes, mainRes] = await Promise.all([
        fetch('data/additions.txt'),
        fetch('data/main_tricks.txt'),
      ]);
      const addText = await addRes.text();
      const mainText = await mainRes.text();

      additions = addText.split('\n').map(s => s.trim()).filter(Boolean);
      mainTricks = mainText.split('\n').map(s => s.trim()).filter(Boolean);
      dataLoaded = additions.length > 0 && mainTricks.length > 0;
    } catch (e) {
      console.error('Не удалось загрузить списки трюков:', e);
      dataLoaded = false;
    }
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateTrick() {
    const mainTrick = pickRandom(mainTricks);

    // Вероятность 1 к 3 — пропустить добавку из Additions
    const skipAddition = Math.random() < (1 / 3);

    if (skipAddition) {
      return mainTrick;
    }

    const addition = pickRandom(additions);
    return `${addition} ${mainTrick}`;
  }

  loadLists();

  // Кнопка 1: стирает предыдущий результат и генерирует новый
  document.getElementById('btn1').addEventListener('click', () => {
    // Шаг 1: стереть текущий текст
    resultEl.textContent = '';
    hasResult = false;

    if (!dataLoaded) {
      // На случай, если списки ещё не успели загрузиться
      resultEl.textContent = 'Списки трюков ещё загружаются...';
      return;
    }

    // Шаг 2: небольшая пауза для эффекта "стёрли — написали заново"
    setTimeout(() => {
      resultEl.textContent = generateTrick();
      hasResult = true;
    }, 120);
  });

  // Кнопка 2: закрывает приложение
  document.getElementById('btn2').addEventListener('click', () => {
    if (tg) {
      tg.close();
    } else {
      // Фолбэк для тестирования вне Telegram (в обычном браузере)
      window.close();
      alert('Приложение закрыто (в браузере закрытие вкладки скриптом может быть ограничено).');
    }
  });
</script>
</body>
</html>
