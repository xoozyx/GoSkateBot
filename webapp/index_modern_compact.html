<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GoSkateBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:PS;src:url(fonts/press-start-2p-latin-400-normal.woff2) format('woff2');font-display:swap}
:root{--bg:#0e1116;--card:#181c24;--card2:#222834;--tx:#f2f4f8;--mut:#8b94a7;--ac:#ffd23f;--ok:#34d399;--no:#fb5b5b;--p2:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:10px;padding:6px 8px;cursor:pointer;min-height:34px}
button:active{transform:scale(.95)}button:disabled{opacity:.35;pointer-events:none}
.scr{display:none;padding:calc(env(safe-area-inset-top) + 4px) 6px 6px;min-height:100vh;min-height:100dvh}.scr.on{display:flex;flex-direction:column}
.logo{font:9px PS;color:var(--ac);text-align:center;margin:2px 0 6px}
.cta{display:block;width:100%;background:var(--ac);color:#171400;font-weight:800;font-size:14px;min-height:40px;border-radius:12px}
.inf{position:absolute;top:3px;right:3px;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;font-size:12px;color:var(--mut)}
.top{display:flex;gap:5px}.top .cta{flex:1}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.sq{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;min-height:0;font-size:20px;border-radius:12px;background:var(--card)}.sq small{font-size:7px;line-height:1;margin-top:2px;color:var(--mut)}.sq.on{background:var(--ac);color:#171400}.sq.on small{color:#171400}
.rw{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:5px;background:var(--card)}.rw b{color:var(--ac)}
h5{margin:10px 0 4px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{padding:4px 9px;border-radius:99px;min-height:28px;font-size:11px}.chip.on{background:var(--ac);color:#171400;font-weight:700}
.bar{display:flex;align-items:center;gap:4px;margin-bottom:4px}.mid{flex:1;text-align:center;line-height:1.25;min-width:0}#title{font-size:10px;color:var(--mut);white-space:nowrap}
.ib{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;font-size:13px;flex:none}
.pl{margin:0 3px;font-weight:700;font-size:11px;white-space:nowrap}.pl.cur{color:var(--ac)}.pl.cur.p2{color:var(--p2)}
.let{font:9px PS;letter-spacing:1px;color:#394152}.let u{text-decoration:none;color:var(--no)}
.trick{flex:1;position:relative;background:linear-gradient(160deg,#1c2230,#141821);border-radius:14px;padding:4px;text-align:center;margin-bottom:5px;min-height:36px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.trick h2{margin:0;font-size:24px;line-height:1.1;font-weight:800;word-break:break-word}.trick p{margin:3px 0 0;color:var(--mut);font-size:11px}
.who{font-weight:700;font-size:11px;color:var(--ac)}.who.p2{color:var(--p2)}
.link{background:none;color:var(--mut);min-height:0;padding:4px;text-decoration:underline;font-size:10px}
.row{display:flex;gap:5px;margin-bottom:5px}.row>*{flex:1}
.bet{font-weight:800;font-size:15px;border:1.5px solid var(--ac);min-height:36px;padding:4px}
.card{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;padding:2px;min-height:30px;background:var(--card)}.card i{font-size:16px;font-style:normal}
.go{display:flex;gap:5px}.go button{flex:1;min-height:40px;font-size:26px;font-weight:800;border-radius:14px}.go .f{background:var(--no);color:#fff}.go .l{background:var(--ok);color:#052e1d}
.sheet{position:fixed;inset:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 4px) 8px 14px;overflow-y:auto;display:none;z-index:5}.sheet.on{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.sh h3{margin:0;font-size:13px}
.li{display:flex;gap:6px;padding:6px 0;border-bottom:1px solid var(--card2)}.li.info{color:var(--mut);font-size:10px}
.dlg{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:8px;z-index:9}.dlg.on{display:flex}
.dlg>div{background:var(--card);border-radius:14px;padding:10px;width:100%;text-align:center}.dlg h3{margin:0 0 2px;font-size:14px}.dlg p{margin:0 0 6px;color:var(--mut);font-size:10px}.dlg button{width:100%;margin-top:5px}.dlg .cta{font-size:12px;min-height:34px}
input[type=range]{width:100%;accent-color:var(--ac)}.vr{margin-top:8px}
</style></head><body>
<section id="home" class="scr on"><div class="top"><button class="cta" id="start">START</button><button class="sq" id="gear" aria-label="Sound" style="width:42px;height:40px;aspect-ratio:auto;flex:none;font-size:18px">⚙️</button></div><div id="opts"></div></section>
<section id="game" class="scr"><div class="bar"><button class="ib" id="quit">✕</button><div class="mid"><div id="title"></div><div id="stat"></div></div><button class="ib" id="logb">☰</button></div><div class="trick" id="trick"></div><div id="ctl"></div>
<div class="sheet" id="sheet"><div class="sh"><h3>Trick log</h3><button class="link" id="sx" style="font-size:12px;padding:8px">close</button></div><div id="log"></div></div></section>
<section id="set" class="scr"><div class="bar"><button class="ib" id="sback">←</button><div class="mid"><b>Sound</b></div><span style="width:30px"></span></div><div class="vr"><span>Music</span><input type="range" id="mv" min="0" max="5"></div><div class="vr"><span>Effects</span><input type="range" id="sv" min="0" max="5"></div></section>
<div class="dlg" id="dlg"><div id="dbox"></div></div>
<script src="sound.js"></script>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0e1116');tg.setBackgroundColor('#0e1116')}catch(e){}}
const $=i=>document.getElementById(i),hap=t=>{try{tg&&tg.HapticFeedback&&(t?tg.HapticFeedback.notificationOccurred(t):tg.HapticFeedback.impactOccurred('light'))}catch(e){}};
const snd=n=>{try{SoundEngine.play(n)}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MODES=[['flat','🛹','Flat'],['ramp','🌊','Ramp'],['street','🏙️','Street']];
const OBS=[['manualbox','Manual Box','manualbox',1],['kicker','Kicker','kicker',0],['curb','Curb','slappy',1],['stairs','Stairs','stairs',0],['ledge','Ledge','ledge',1],['rail','Rail','rail',1]];
const MODS={flat:[['old','Old School'],['body','Body Varial']],ramp:[['air','Air Tricks']],street:[['old','Old School'],['ins','Ins & Outs']]};
let S={mode:'flat',diff:'easy',vs:0,arc:0,o:{},obs:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('gs2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gs2',JSON.stringify(S))}catch(e){}};
const show=id=>{scrollTo(0,0);document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==id));try{SoundEngine.startMusic(id=='game'?'punk':'hiphop')}catch(e){}};

/* ---------- home ---------- */
function seg(k,opts){return `<div class="seg">${opts.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${S[k]==v?'on':''}">${l}</button>`).join('')}</div>`}
function chip(t,k,l,on){return `<button class="chip ${on?'on':''}" data-t="${t}" data-k="${k}">${l}</button>`}
const ICON={old:'📼',body:'🌀',air:'🪂',ins:'↔️',manualbox:'📦',kicker:'📐',curb:'🧱',stairs:'🪜',ledge:'🛤️',rail:'🚧'},CAP={old:'Old',body:'Body',air:'Air',ins:'In/Out',manualbox:'Box',kicker:'Kick',curb:'Curb',stairs:'Stairs',ledge:'Ledge',rail:'Rail'};
const sq=(t,k,on)=>`<button class="sq ${on?'on':''}" data-t="${t}" data-k="${k}">${ICON[k]}<small>${CAP[k]}</small></button>`;
function renderHome(){
  const mk=MODES.map(m=>m[0]),mi=mk.indexOf(S.mode),b=(k,i,nv,a)=>`<button class="sq" data-k="${k}" data-v="${nv}" aria-label="${a}">${i}</button>`;
  let h='<div class="g4">'+b('mode',MODES[mi][1],mk[(mi+1)%3],MODES[mi][2])+b('diff',S.diff=='hard'?'🔥':'🟢',S.diff=='hard'?'easy':'hard',S.diff)+b('vs',S.vs?'👥':'👤',S.vs?0:1,'players')+b('arc',S.arc?'🎰':'🎯',S.arc?0:1,'game')+'</div>';
  h+=`<div class="g4">${MODS[S.mode].map(([k])=>sq('o',k,S.o[S.mode+k])).join('')}</div>`;
  if(S.mode=='street')h+=`<div class="g4">${OBS.map(([k])=>sq('obs',k,S.obs[k]!==0)).join('')}</div>`;
  $('opts').innerHTML=h;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b||!$('home').classList.contains('on'))return;
  const k=b.dataset.k,t=b.dataset.t;snd('toggle');hap();
  if(t=='o'){S.o[S.mode+k]=!S.o[S.mode+k]}else if(t=='obs'){S.obs[k]=S.obs[k]===0?1:0}else S[k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  save();renderHome();
});

/* ---------- tricks data ---------- */
const cache={};let howto=null;
const ld=async p=>cache[p]||(cache[p]=fetch('data/'+p+'.txt').then(r=>r.ok?r.text():'').then(t=>t.split('\n').map(x=>x.trim()).filter(Boolean)).catch(()=>[]));
function files(){
  const ds=S.diff=='hard'?['easy','hard']:['easy'],f=[],o=n=>S.o[S.mode+n];
  if(S.mode=='flat')ds.forEach(d=>{f.push('Flatmode_tricks_'+d);o('old')&&f.push('Flatmode_tricks_oldschool_'+d);o('body')&&f.push('Flatmode_tricks_bodyvarial_'+d)});
  if(S.mode=='ramp')ds.forEach(d=>{f.push('Rampmode_tricks_'+d);o('air')&&f.push('Rampmode_tricks_Airs_'+d)});
  if(S.mode=='street')OBS.forEach(([k,,fk,ins])=>{if(S.obs[k]===0)return;ds.forEach(d=>{f.push(`Streetmode_tricks_${fk}_${d}`);o('old')&&f.push(`Streetmode_tricks_${fk}_oldschool_${d}`);o('ins')&&ins&&f.push(`Streetmode_tricks_${fk}_insandouts_${d}`)})});
  return f;
}
let pool=[],recent=[];
async function loadPool(){
  pool=(await Promise.all(files().map(ld))).flat();
  if(!howto){howto=new Map();try{(await(await fetch('data/Howto.txt')).text()).split('\n').forEach(l=>{const i=l.indexOf(',');i>0&&howto.set(l.slice(0,i).trim(),l.slice(i+1).trim())})}catch(e){}}
  return pool.length>0;
}
function pick(){let t,n=0;do{t=pool[Math.random()*pool.length|0];n++}while(recent.includes(t)&&n<30);recent.push(t);recent.length>30&&recent.shift();return t}

/* ---------- game ---------- */
let G;const LIM=()=>S.diff=='hard'?5:15,CD=5,MINBET=50;
const np=()=>S.vs?2:1,cur=()=>G.p[G.t];
const blank=()=>({b:100,cd:{r:0,e:0,d:0},sk:{},f:0,l:0});
function summary(){const m=MODES.find(x=>x[0]==S.mode)[2],x=[S.diff=='hard'?'Hard':'Easy',m];S.vs&&x.push('2P');S.arc&&x.push('Arc');return x.join('·')}
async function newGame(){
  G={p:[blank(),blank()],t:0,st:'load',trick:'',bet:null,ex:0,log:[],msg:''};
  $('title').textContent=summary();render();
  if(!await loadPool()){G.st='err';return render()}
  G.log.unshift({i:1,x:summary()});
  S.arc?(G.st='bet',G.msg='Place your bet'):(G.st='ready');render();
}
function roll(){G.trick=pick();G.ex=0;G.st='trick';render()}
function over(w){G.st='over';G.win=w;try{SoundEngine.setSlowdown(1.9,.82)}catch(e){}hap('error');render()}
function tick(p){['r','e','d'].forEach(k=>{if(p.sk[k])p.sk[k]=false;else if(p.cd[k]>0)p.cd[k]--})}
function logIt(ok){G.log.unshift({ok,x:G.trick,pl:S.vs?G.t+1:0})}
function judge(ok){
  const p=cur();snd(ok?'landed':'failed');hap(ok?'success':'error');
  if(S.arc){
    if(!ok&&G.ex==1){G.ex=2;return render()}
    tick(p);if(ok){p.b+=G.bet*2;p.l++}else p.f++;logIt(ok);G.bet=null;G.ex=0;
    if(p.b<MINBET)return over(S.vs?(G.t?1:2):0);
    if(S.vs)G.t^=1;G.st='bet';G.msg='Place your bet';return render();
  }
  ok?p.l++:p.f++;logIt(ok);
  if(p.f>=LIM())return over(S.vs?(G.t?1:2):0);
  if(S.vs&&G.t==0){G.t=1;return render()}
  G.t=0;roll();
}
function bet(a){const p=cur();snd('confirm');p.b-=a;G.bet=a;roll()}
function card(k){
  const p=cur();if(!avail(k))return;snd('confirm');hap();p.cd[k]=CD;p.sk[k]=true;
  G.log.unshift({i:1,x:{r:'Reroll card used',e:'Extra try card used',d:'Double bet card used'}[k]});
  if(k=='r')roll();else if(k=='e'){G.ex=1;render()}else{p.b-=G.bet;G.bet*=2;render()}
}
function avail(k){const p=cur();return S.arc&&G.st=='trick'&&p.cd[k]==0&&!(k=='d'&&p.b<G.bet)&&!(G.ex&&(k=='r'||k=='d'))}

/* ---------- render ---------- */
function letters(f){const n=Math.min(5,S.diff=='hard'?f:Math.floor(f/3));return `<span class="let">${[...'SKATE'].map((c,i)=>i<n?`<u>${c}</u>`:c).join('')}</span>`}
function fit(){const t=$('trick'),h=t.querySelector('h2');if(!h||!t.offsetParent)return;let s=26;h.style.fontSize=s+'px';
  const a=innerHeight-(t.getBoundingClientRect().top+scrollY)-$('ctl').offsetHeight-6;while(s>13&&t.offsetHeight>a+1){s--;h.style.fontSize=s+'px'}}
addEventListener('resize',()=>{try{fit()}catch(e){}});
function render(){render0();fit()}
function render0(){
  const c=$('ctl'),t=$('trick');
  $('stat').innerHTML=G.p.slice(0,np()).map((p,i)=>{const v=S.arc?(S.vs?'':'🛹')+p.b:letters(p.f);return S.vs?`<span class="pl ${G.t==i&&G.st!='over'?'cur p'+(i+1):''}">P${i+1} ${v}</span>`:v}).join('');
  const who=S.vs?`<div class="who ${G.t?'p2':''}">Player ${G.t+1}</div>`:'';
  c.innerHTML='';
  if(G.st=='load')t.innerHTML='<p>Loading…</p>';
  else if(G.st=='err'){t.innerHTML='<h2>No connection</h2>';c.innerHTML='<button class="cta" id="again">Try again</button>'}
  else if(G.st=='ready'){t.innerHTML='<h2>Ready?</h2>';c.innerHTML='<button class="cta" id="roll">ROLL TRICK</button>'}
  else if(G.st=='bet'){t.innerHTML=`${who}<h2>${esc(G.msg)}</h2>`;const p=cur(),a=p.b>=1000?[500,1000,1500]:[50,100,250];c.innerHTML=`<div class="row">${a.map(x=>`<button class="bet" data-bet="${x}" ${x>p.b?'disabled':''}>${x}</button>`).join('')}</div>`+cards()}
  else if(G.st=='trick'){const m=G.ex==1?'2 attempts':G.ex==2?'Last attempt!':S.arc?`Bet ${G.bet} 🛹`:'';t.innerHTML=`${who}<h2>${esc(G.trick)}</h2>${m?`<p>${m}</p>`:''}`;c.innerHTML=(S.arc?cards():'')+'<div class="go"><button class="f" data-j="0">✗</button><button class="l" data-j="1">✓</button></div>'}
  else if(G.st=='over'){t.innerHTML=`<h2>${S.vs?`🏆 Player ${G.win} wins`:'Game over!'}</h2>${S.arc&&!S.vs?'<p>Out of skatebucks</p>':''}`;c.innerHTML='<div class="row"><button id="quit2">Menu</button><button class="cta" id="again" style="min-height:34px">New game</button></div>'}
  $('log').innerHTML=G.log.map(e=>e.i?`<div class="li info">${esc(e.x)}</div>`:`<div class="li"><span>${e.ok?'✅':'❌'}</span><span>${e.pl?`P${e.pl} · `:''}${esc(e.x)}</span></div>`).join('')||'<p style="color:var(--mut)">Empty</p>';
}
function cards(){const p=cur(),n={r:['🔄','Reroll'],e:['☝️','Extra'],d:['✖️2','Double']};
  return '<div class="row">'+['r','e','d'].map(k=>`<button class="card" data-c="${k}" ${avail(k)?'':'disabled'}><i>${n[k][0]}</i>${p.cd[k]?`<b>${p.cd[k]}</b>`:''}</button>`).join('')+'</div>'}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!G||!$('game').classList.contains('on'))return;
  if(b.dataset.j!==undefined)judge(+b.dataset.j);
  else if(b.dataset.bet)bet(+b.dataset.bet);
  else if(b.dataset.c)card(b.dataset.c);
  else if(b.id=='roll'){snd('confirm');roll()}
  else if(b.id=='again'){snd('confirm');try{SoundEngine.setSlowdown(1,1)}catch(e){}newGame()}
  else if(b.id=='quit2')leave();
  else if(b.id=='info'){const u=howto&&howto.get(G.trick)||'https://www.google.com/search?q='+encodeURIComponent('How to '+G.trick+' on a skateboard');tg&&tg.openLink?tg.openLink(u):window.open(u,'_blank')}
});
document.addEventListener('click',e=>{if(G&&G.st=='trick'&&$('game').classList.contains('on')&&e.target.closest('#trick')){const u=howto&&howto.get(G.trick)||'https://www.google.com/search?q='+encodeURIComponent('How to '+G.trick+' on a skateboard');tg&&tg.openLink?tg.openLink(u):window.open(u,'_blank')}});
function leave(){snd('back');try{SoundEngine.setSlowdown(1,1)}catch(e){}$('dlg').classList.remove('on');$('sheet').classList.remove('on');show('home')}
function dlg(h){$('dbox').innerHTML=h;$('dlg').classList.add('on')}
$('start').onclick=()=>{snd('confirm');hap();show('game');newGame()};
$('quit').onclick=()=>{snd('click');dlg('<h3>Leave game?</h3><p>Your progress will be lost.</p><button class="cta" id="dno">Keep playing</button><button id="dre">Restart</button><button id="dq">Quit to menu</button>');
  $('dno').onclick=()=>$('dlg').classList.remove('on');$('dre').onclick=()=>{$('dlg').classList.remove('on');try{SoundEngine.setSlowdown(1,1)}catch(e){}newGame()};$('dq').onclick=leave};
$('logb').onclick=()=>{snd('click');$('sheet').classList.add('on')};$('sx').onclick=()=>$('sheet').classList.remove('on');
$('gear').onclick=()=>{snd('click');$('mv').value=SoundEngine.getMusicVolume();$('sv').value=SoundEngine.getSfxVolume();show('set')};
$('sback').onclick=()=>{snd('back');show('home')};
$('mv').oninput=e=>SoundEngine.setMusicVolume(+e.target.value);$('sv').oninput=e=>{SoundEngine.setSfxVolume(+e.target.value);snd('click')};
renderHome();
/* iOS Safari ignores user-scalable=no: block double-tap and pinch zoom manually */
['gesturestart','gesturechange','gestureend'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
</script></body></html>
