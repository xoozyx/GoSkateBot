<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GoSkateBot Compact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ==== Compact mode: первая проба под маленькие экраны (Apple Watch SE
     gen1 и т.п.) — только один режим "зашит" намертво: Single / Classic /
     Ramp / Easy / без Air Tricks (см. TRICK_LIST_PATH в скрипте ниже). Ни
     выбора режима, ни меню, ни лога трюков, ни звука — со стороны
     images/compact mode/ прислано только 6 картинок (фон, пузырь, тренер,
     Start Game, Landed, Failed), под них и сделан весь экран. Канвас — 162x197
     (собственный формат компактных картинок, отдельный от 208x306 основной
     версии — Preview.png был просто референсом стиля, а не новым размером). ==== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe9ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  img {
    -webkit-user-drag: none;
    user-select: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    /* dvh (dynamic viewport height) правильнее учитывает системные панели
       браузера (адресная строка и т.п.) там, где поддерживается — обычный
       vh в таких браузерах на маленьких экранах может включать в себя
       пространство под этими панелями, а не только реально видимую область. */
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Канвас компактных картинок — 162x197 (см. images/compact mode/*.png),
     тот же приём, что в основной версии: фиксированное соотношение сторон,
     ширина/высота считаются от вьюпорта, дальше все элементы внутри —
     проценты от ЭТОГО блока. */
  /* Раньше центрировали канвас с сохранением родной пропорции 162:197
     (min(94vw,90vh,320px) + aspect-ratio) — на Apple Watch поверх страницы
     сверху накладывается системная панель адреса, из-за чего 100vh даёт не
     ту высоту, что реально видна, и по бокам/сверху вылезали поля цвета фона
     страницы. Растягиваем канвас на всю доступную область без сохранения
     пропорции — сама картинка Background_0.png при этом слегка исказится,
     но пустых полей вокруг не останется, а все остальные слои внутри всё
     равно позиционируются в процентах от ЭТОГО блока, так что не съезжают. */
  /* Растягиваем на весь экран с сохранением ЕДИНОГО коэффициента масштаба
     (как background-size:cover) — раньше через это же место распластывало
     картинку неравномерно (по ширине и высоте — разными коэффициентами) или,
     наоборот, оставляло поля по бокам (contain) — но с новым каноническим
     соотношением 162:120 (≈1.35:1), которое гораздо ближе к реальной видимой
     области под панелью адреса часов (было измерено ~1.36:1 на скриншоте),
     cover почти не растягивает картинку — только чуть-чуть докрывает
     оставшуюся разницу, вместо ощутимого перекоса, как было на портретных 162:197. */
  .device {
    position: relative;
    width: max(100vw, calc(100vh * 162 / 120));
    height: max(100vh, calc(100vw * 120 / 162));
    /* dvh-версия — только поверх vh-варианта выше (не единственная
       декларация): на браузерах без поддержки dvh это правило целиком
       игнорируется парсером, а предыдущее (на чистых vh) остаётся в силе —
       так снова не выйдет ситуация "оба варианта невалидны -> auto". */
    width: max(100vw, calc(100dvh * 162 / 120));
    height: max(100dvh, calc(100vw * 120 / 162));
    image-rendering: pixelated;
  }

  /* Полноразмерный слой-картинка (фон, тренер, пузырь) — каждая PNG уже сама
     нарисована с прозрачностью в нужном месте всего канваса 162x120, поэтому
     сам слой всегда inset:0, без индивидуальных left/top/width/height. */
  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .layer img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #bubbleLayer {
    /* Ниже тренера по просьбе (тренер должен быть ПОВЕРХ пузыря) — сам
       тренер получает z-index:2 инлайном в разметке (было 1). */
    z-index: 1;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  #bubbleLayer.active {
    opacity: 1;
  }

  #result {
    position: absolute;
    /* Растянут почти на весь чёрный фон пузыря (сам Text_bubble.png занимает
       1.67%-53.34% по высоте канваса) — раньше бокс был только верхней
       частью этого диапазона, из-за чего текст казался прижатым кверху, а
       не по центру всего чёрного поля, как просили. */
    left: 6%;
    right: 6%;
    top: 2%;
    height: 50%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    line-height: 1.3;
    /* pre-line — чтобы "\n" из formatTrickForDisplay() рендерился как
       настоящий перенос строки (обычный word-wrap этого не делает сам по
       себе), но обычный перенос по словам у длинных строк без "\n" по-прежнему работает. */
    white-space: pre-line;
    /* Внутренность Text_bubble.png — почти чёрная (rgb(35,35,35) по факту),
       поэтому тёмно-серый (#2b2b2b) текст на ней был не виден — светлый,
       как в основной версии (#result там #ffffff), даёт нужный контраст. */
    color: #ffffff;
    word-wrap: break-word;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 3;
  }

  #result.active {
    opacity: 1;
  }

  /* ==== Кнопки: невидимый button (реальная кликабельная зона по альфа-каналу
     соответствующей картинки) + соседний слой с самой картинкой — тот же
     приём с двумя слоями, что и в основной версии. Скрыты по умолчанию,
     показываются только через класс .visible (см. JS) — специально не
     полагаемся на пустую инлайн-строку в display, чтобы не словить тот же
     баг, что был в основной версии (см. историю правок). ==== */
  .btn, .btn-visual {
    display: none;
  }

  .btn.visible, .btn-visual.visible {
    display: block;
  }

  .btn {
    position: absolute;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 4;
  }

  .btn-visual {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.08s ease;
  }

  /* Забытая раньше пара к ".layer img" выше — без нее картинки кнопок
     рендерились в своём natural-размере (162x197 исходника) вместо
     растягивания на весь .device, поэтому выглядели не такого размера, как
     фон/тренер/пузырь. */
  .btn-visual img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .btn:active + .btn-visual {
    opacity: 0.8;
  }

  #btnStart, #btnLanded, #btnFailed {
    top: 62.5%;
    height: 35%;
  }

  #btnStart {
    left: 1.85%;
    width: 96.3%;
  }

  #btnLanded {
    left: 1.85%;
    width: 46.91%;
  }

  #btnFailed {
    left: 51.23%;
    width: 46.91%;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="device">
      <div class="layer" style="z-index: 0;">
        <img src="images/compact%20mode/Background_0.png" alt="">
      </div>
      <div class="layer" style="z-index: 2;">
        <img src="images/compact%20mode/Animation_coach.png" alt="">
      </div>
      <div class="layer" style="z-index: 2;">
        <img id="lettersImg" src="images/compact%20mode/Letters_null.png" alt="SKATE">
      </div>
      <div id="bubbleLayer" class="layer">
        <img src="images/compact%20mode/Text_bubble.png" alt="">
      </div>
      <div id="result"></div>

      <button id="btnStart" class="btn" aria-label="Start Game"></button>
      <div id="btnStartVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_startgame.png" alt="">
      </div>

      <button id="btnLanded" class="btn" aria-label="Landed"></button>
      <div id="btnLandedVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_landed.png" alt="">
      </div>

      <button id="btnFailed" class="btn" aria-label="Failed"></button>
      <div id="btnFailedVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_failed.png" alt="">
      </div>
    </div>
  </div>

<script>
  // ==== GoSkateBot — Compact mode ====
  // Единственный зашитый режим: Single / Classic / Ramp / Easy / без Air
  // Tricks — тот же trick-лист, что использует основная версия для этой
  // комбинации (Rampmode_tricks_easy.txt), но независимая логика: этот файл
  // не переиспользует код index.html и не делит с ним ни один ключ
  // localStorage (свой префикс ниже) — можно играть в обе версии параллельно,
  // не мешая друг другу.
  //
  // Что сознательно урезано по сравнению с основной версией (нет ни готовых
  // картинок, ни явного запроса на это): звук, лог трюков, видимый прогресс
  // по буквам SKATE (сам счётчик ошибок внутри есть и доводит до Game Over
  // на 15-й, как в Easy основной версии — просто не отрисован, картинки под
  // буквы не присылали), кнопка Info/повтор при обрыве связи (переиспользует
  // Start Game — см. rollTrick).
  (function () {
    const TRICK_LIST_PATH = 'data/Rampmode_tricks_easy.txt';
    // Порог синхронизирован с буквами (см. LETTERS_STAGES ниже: 1 провал =
    // 1 буква) — собралось всё слово SKATE (5 провалов) — Game Over, как в
    // основной версии, а не 15 (было бы игнорированием уже собранного слова).
    const GAME_OVER_FAILS = 5;
    const HISTORY_SIZE = 30;
    const MAX_UNIQUE_ATTEMPTS = 30;
    const TYPEWRITER_MS_PER_CHAR = 28;

    // Шрифт калибруется по длине САМОЙ ДЛИННОЙ СТРОКИ уже ПОСЛЕ разбивки на
    // две строки (см. formatTrickForDisplay ниже — режем по "to"), а не по
    // длине всего названия трюка целиком. Разница огромная: например
    // "Nollie FS 180 to Switch Rock,n,Roll" — это 35 символов одной строкой,
    // но всего 21 в самой длинной из двух получившихся строк. Проверено по
    // всему data/Rampmode_tricks_easy.txt — максимум после разбивки всего 22
    // символа (было бы 35 без неё), поэтому шрифт можно сделать намного
    // крупнее, чем раньше.
    const RESULT_FONT_BASE = 34;
    const RESULT_FONT_STEPS = [
      { maxLength: 13, scale: 1 },
      { maxLength: 18, scale: 0.85 },
      { maxLength: Infinity, scale: 0.72 },
    ];

    // По просьбе — никакого сохранения между перезагрузками страницы: каждое
    // открытие компактной версии начинается с чистого листа (в отличие от
    // основной версии, где прогресс восстанавливается). Раньше здесь был
    // localStorage-слой (goskate_compact_*) — специально убран целиком, а не
    // просто отключено чтение: раз ничего не сохраняем, нечего было бы и
    // писать.
    let recentResults = [];
    let failedCount = 0;
    let isGameOver = false;

    let tricks = [];
    let dataLoaded = false;
    let typewriterTimer = null;

    const bubbleLayerEl = document.getElementById('bubbleLayer');
    const resultEl = document.getElementById('result');
    const lettersImgEl = document.getElementById('lettersImg');
    const btnStartEl = document.getElementById('btnStart');
    const btnStartVisualEl = document.getElementById('btnStartVisual');
    const btnLandedEl = document.getElementById('btnLanded');
    const btnLandedVisualEl = document.getElementById('btnLandedVisual');
    const btnFailedEl = document.getElementById('btnFailed');
    const btnFailedVisualEl = document.getElementById('btnFailedVisual');

    // Буквы SKATE — в стиле Hard мода основной версии: 1 провал = 1 буква
    // (в отличие от Easy там, где буквы растянуты на все 15 попыток) — просили
    // именно так, хотя общий порог Game Over в компактной версии остаётся
    // 15 (см. GAME_OVER_FAILS выше), не 5, как было бы у настоящего Hard.
    // После 5 провалов слово уже полностью "SKATE" и дальше не меняется —
    // сама Game Over логика продолжает считать до GAME_OVER_FAILS отдельно.
    const LETTERS_STAGES = ['null', 's', 'sk', 'ska', 'skat', 'skate'];
    function syncLetters() {
      const stage = LETTERS_STAGES[Math.min(failedCount, LETTERS_STAGES.length - 1)];
      lettersImgEl.src = 'images/compact%20mode/Letters_' + stage + '.png';
    }

    function setStartVisible(visible) {
      btnStartEl.classList.toggle('visible', visible);
      btnStartVisualEl.classList.toggle('visible', visible);
    }

    function setJudgeVisible(visible) {
      btnLandedEl.classList.toggle('visible', visible);
      btnLandedVisualEl.classList.toggle('visible', visible);
      btnFailedEl.classList.toggle('visible', visible);
      btnFailedVisualEl.classList.toggle('visible', visible);
    }

    function showBubble() {
      bubbleLayerEl.classList.add('active');
      resultEl.classList.add('active');
    }

    function hideBubble() {
      bubbleLayerEl.classList.remove('active');
      resultEl.classList.remove('active');
      resultEl.textContent = '';
    }

    // Печатная машинка — тот же принцип, что в основной версии (setResultText),
    // упрощённая: тут не нужна отдельная Info-кнопка и статус "это трюк".
    function typeText(text, onComplete) {
      if (typewriterTimer !== null) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
      }
      // Шрифт — по длине САМОЙ ДЛИННОЙ строки уже после разбивки на "\n" (см.
      // formatTrickForDisplay), а не по длине всей строки целиком.
      const lines = text.split('\n');
      const longestLine = Math.max.apply(null, lines.map(function (l) { return l.length; }));
      const step = RESULT_FONT_STEPS.find((s) => longestLine <= s.maxLength);
      resultEl.style.fontSize = (RESULT_FONT_BASE * step.scale) + 'px';
      resultEl.textContent = '';

      if (!text) {
        if (onComplete) onComplete();
        return;
      }

      let i = 0;
      typewriterTimer = setInterval(() => {
        i++;
        resultEl.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
          if (onComplete) onComplete();
        }
      }, TYPEWRITER_MS_PER_CHAR);
    }

    function parseTrickList(text) {
      return text.split('\n').map((line) => line.trim()).filter(Boolean);
    }

    async function ensureTricksLoaded() {
      if (dataLoaded) return;
      try {
        const res = await fetch(TRICK_LIST_PATH);
        tricks = parseTrickList(await res.text());
        dataLoaded = tricks.length > 0;
      } catch (e) {
        dataLoaded = false;
      }
    }

    // Тот же фильтр от повторов, что и в основной версии (generateUniqueTrick):
    // не даём последним HISTORY_SIZE трюкам повториться подряд, пока не
    // исчерпаны разумные попытки подобрать что-то новое.
    function generateUniqueTrick() {
      if (tricks.length === 0) return '';
      let result;
      let attempts = 0;
      do {
        result = tricks[Math.floor(Math.random() * tricks.length)];
        attempts++;
      } while (recentResults.includes(result) && attempts < MAX_UNIQUE_ATTEMPTS && tricks.length > 1);

      recentResults.push(result);
      if (recentResults.length > HISTORY_SIZE) recentResults.shift();
      return result;
    }

    // Многие названия трюков в этом списке — формата "X to Y" (обстакл/трюк
    // to стойка) — режем ровно по этому " to " на две строки вместо того,
    // чтобы полагаться на автоматический перенос браузера (тот мог бы
    // разорвать где угодно, не обязательно в осмысленном месте). Если " to "
    // в названии нет — возвращаем как есть, тогда обычный word-wrap (см. CSS)
    // сам разберётся, если строка всё равно окажется длинной.
    function formatTrickForDisplay(text) {
      const idx = text.indexOf(' to ');
      if (idx === -1) return text;
      return text.slice(0, idx) + '\n' + text.slice(idx + 1);
    }

    function triggerGameOver() {
      isGameOver = true;
      hideBubble();
      setJudgeVisible(false);
      setTimeout(() => {
        showBubble();
        typeText('Game over!', () => {
          setStartVisible(true);
        });
      }, 120);
    }

    // Один трюк — генерация, печать, показ Landed/Failed после того, как
    // текст допечатался (та же логика видимости, что у классического
    // single-режима основной версии: Roll -> печать -> кнопки оценки).
    async function rollTrick() {
      hideBubble();
      setJudgeVisible(false);

      await ensureTricksLoaded();
      if (!dataLoaded) {
        // Отдельной картинки "Retry" под обрыв связи не прислали — в
        // компактной версии для этого переиспользуется Start Game.
        setTimeout(() => {
          showBubble();
          typeText('Connection problem, try again', () => {
            setStartVisible(true);
          });
        }, 120);
        return;
      }

      setTimeout(() => {
        showBubble();
        const trick = generateUniqueTrick();
        typeText(formatTrickForDisplay(trick), () => {
          setJudgeVisible(true);
        });
      }, 120);
    }

    function startNewGame() {
      failedCount = 0;
      isGameOver = false;
      recentResults = [];
      syncLetters();
      setStartVisible(false);
      rollTrick();
    }

    btnStartEl.addEventListener('click', () => {
      startNewGame();
    });

    btnLandedEl.addEventListener('click', () => {
      if (isGameOver) return;
      rollTrick();
    });

    btnFailedEl.addEventListener('click', () => {
      if (isGameOver) return;
      failedCount++;
      syncLetters();
      if (failedCount >= GAME_OVER_FAILS) {
        triggerGameOver();
        return;
      }
      rollTrick();
    });

    // ==== Открытие страницы — всегда чистый старт (между перезагрузками
    // ничего не сохраняется, см. объявление failedCount/isGameOver выше).
    // Пузырь сразу показывает приветственное сообщение с инструкцией — своя
    // (меньшая) величина шрифта, а не RESULT_FONT_STEPS: та таблица
    // калибрована под названия трюков (десяток-другой символов), а тут почти
    // предложение на 70+ символов, ему нужно попроще ужаться сразу. ====
    syncLetters();
    resultEl.style.fontSize = '9px';
    resultEl.textContent = 'Push START GAME to play game of skate easy ramp mode without air tricks';
    showBubble();
    setStartVisible(true);
  })();
</script>
</body>
</html>
