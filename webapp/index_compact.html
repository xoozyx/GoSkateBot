<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GoSkateBot Compact</title>
<style>
  /* Шрифт — локальный файл (fonts/), а не Google Fonts CDN: на браузере
     Apple Watch внешний CSS-запрос к fonts.googleapis.com/fonts.gstatic.com
     по какой-то причине не отрабатывал (текст показывался обычным системным
     шрифтом вместо пиксельного) — то ли сетевые ограничения самого
     watch-браузера, то ли просто нет времени на подгрузку до первой отрисовки,
     и нет повторного рендера после. Локальный файл из того же источника (тот
     же woff2 от Google Fonts, просто выкачан через npm-пакет @fontsource/
     press-start-2p и положен рядом со страницей) снимает саму возможность
     сетевого сбоя — грузится с того же хоста, что и сама игра.
     font-display:block — короткая пауза с невидимым текстом вместо мгновенного
     показа системным шрифтом, чтобы не было заметного "мигания" сменой шрифта. */
  @font-face {
    font-family: 'Press Start 2P';
    src: url('fonts/press-start-2p-latin-400-normal.woff2') format('woff2'),
         url('fonts/press-start-2p-latin-400-normal.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  /* ==== Compact mode: первая проба под маленькие экраны (Apple Watch SE
     gen1 и т.п.) — только один режим "зашит" намертво: Single / Classic /
     Ramp / Easy / без Air Tricks (см. TRICK_LIST_PATH в скрипте ниже). Ни
     выбора режима, ни меню, ни лога трюков, ни звука — со стороны
     images/compact mode/ прислано только 6 картинок (фон, пузырь, тренер,
     Start Game, Landed, Failed), под них и сделан весь экран. Канвас — 162x197
     (собственный формат компактных картинок, отдельный от 208x306 основной
     версии — Preview.png был просто референсом стиля, а не новым размером). ==== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #cfe9ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  img {
    -webkit-user-drag: none;
    user-select: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    /* dvh (dynamic viewport height) правильнее учитывает системные панели
       браузера (адресная строка и т.п.) там, где поддерживается — обычный
       vh в таких браузерах на маленьких экранах может включать в себя
       пространство под этими панелями, а не только реально видимую область. */
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Канвас компактных картинок — 162x197 (см. images/compact mode/*.png),
     тот же приём, что в основной версии: фиксированное соотношение сторон,
     ширина/высота считаются от вьюпорта, дальше все элементы внутри —
     проценты от ЭТОГО блока. */
  /* Раньше центрировали канвас с сохранением родной пропорции 162:197
     (min(94vw,90vh,320px) + aspect-ratio) — на Apple Watch поверх страницы
     сверху накладывается системная панель адреса, из-за чего 100vh даёт не
     ту высоту, что реально видна, и по бокам/сверху вылезали поля цвета фона
     страницы. Растягиваем канвас на всю доступную область без сохранения
     пропорции — сама картинка Background_0.png при этом слегка исказится,
     но пустых полей вокруг не останется, а все остальные слои внутри всё
     равно позиционируются в процентах от ЭТОГО блока, так что не съезжают. */
  /* Растягиваем на весь экран с сохранением ЕДИНОГО коэффициента масштаба
     (как background-size:cover) — раньше через это же место распластывало
     картинку неравномерно (по ширине и высоте — разными коэффициентами) или,
     наоборот, оставляло поля по бокам (contain) — но с новым каноническим
     соотношением 162:120 (≈1.35:1), которое гораздо ближе к реальной видимой
     области под панелью адреса часов (было измерено ~1.36:1 на скриншоте),
     cover почти не растягивает картинку — только чуть-чуть докрывает
     оставшуюся разницу, вместо ощутимого перекоса, как было на портретных 162:197. */
  .device {
    position: relative;
    width: max(100vw, calc(100vh * 162 / 120));
    height: max(100vh, calc(100vw * 120 / 162));
    /* dvh-версия — только поверх vh-варианта выше (не единственная
       декларация): на браузерах без поддержки dvh это правило целиком
       игнорируется парсером, а предыдущее (на чистых vh) остаётся в силе —
       так снова не выйдет ситуация "оба варианта невалидны -> auto". */
    width: max(100vw, calc(100dvh * 162 / 120));
    height: max(100dvh, calc(100vw * 120 / 162));
    image-rendering: pixelated;
  }

  /* Полноразмерный слой-картинка (фон, тренер, пузырь) — каждая PNG уже сама
     нарисована с прозрачностью в нужном месте всего канваса 162x120, поэтому
     сам слой всегда inset:0, без индивидуальных left/top/width/height. */
  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .layer img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #bubbleLayer {
    /* Ниже тренера по просьбе (тренер должен быть ПОВЕРХ пузыря) — сам
       тренер получает z-index:2 инлайном в разметке (было 1). */
    z-index: 1;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  #bubbleLayer.active {
    opacity: 1;
  }

  /* ==== Одна строка всегда: короткий текст (<=15 символов) — статично и
     по центру; длиннее — не перенос/сжатие шрифта (как раньше), а бегущая
     строка (см. #result.scrolling ниже и #resultText.scroll-anim) — сам
     текст остаётся крупным независимо от длины. ==== */
  #result {
    position: absolute;
    /* Растянут почти на весь чёрный фон пузыря (сам Text_bubble.png занимает
       1.67%-53.34% по высоте канваса) — раньше бокс был только верхней
       частью этого диапазона, из-за чего текст казался прижатым кверху, а
       не по центру всего чёрного поля, как просили. top ещё на пару пунктов
       выше (0.5% вместо 2%) — просили сдвинуть на несколько пикселей вверх
       для более точного заполнения поля. */
    left: 6%;
    right: 6%;
    top: 0.5%;
    height: 50%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    /* Печатная машинка обратно по центру, как просили — только у активной
       бегущей строки (см. #result.scrolling ниже) переключается на
       flex-start, потому что там иначе анимация считала бы сдвиг не от того
       края. */
    justify-content: center;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    line-height: 1.3;
    /* Внутренность Text_bubble.png — почти чёрная (rgb(35,35,35) по факту),
       поэтому тёмно-серый (#2b2b2b) текст на ней был не виден — светлый,
       как в основной версии (#result там #ffffff), даёт нужный контраст. */
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 3;
  }

  #result.active {
    opacity: 1;
  }

  #resultText {
    display: inline-block;
    white-space: nowrap;
  }

  /* Активная бегущая строка — контейнер переключается на flex-start (не
     center), иначе анимация -50% считала бы сдвиг от центрированной, а не
     левой позиции. До этого момента (пока трюк ещё печатается) — и короткий,
     и потом-станет-длинным текст одинаково центрированы, см. typeText(). */
  #result.scrolling {
    justify-content: flex-start;
  }

  /* Раньше был padding-left:100% + анимация 0 -> -100% — это давало "въезд"
     с паузой на пустом экране между циклами. Теперь строка задваивается в JS
     (см. typeText: text + gap + text + gap) и едет БЕЗ паузы: сдвиг ровно на
     -50% ширины ДВОЙНОГО контента — это ширина ОДНОЙ копии текста+отступа,
     так что к моменту скачка обратно на 0% там уже визуально то же самое
     место (начало второй копии = начало первой) — глаз не замечает стыка. */
  #result.scrolling #resultText {
    animation-name: marquee-scroll;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes marquee-scroll {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-50%);
    }
  }

  /* ==== Лог трюков — открывается кликом по пузырю (см. #bubbleToggle),
     не отдельной кнопкой, как в основной версии. Bbox самого
     Text_bubble.png по альфа-каналу: left=1.85% top=1.67% width=96.3%
     height=51.67% — invisible-кнопка ровно под этой областью. ==== */
  #bubbleToggle {
    position: absolute;
    left: 1.85%;
    top: 1.67%;
    width: 96.3%;
    height: 51.67%;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 4;
  }

  /* Панель лога — тот же приём, что #result/#bubbleLayer (полноразмерный
     слой + opacity-переход), но поверх вообще всего (z-index больше, чем у
     кнопок и бейджей), пока не открыта — не мешает игре (pointer-events:none
     и невидима). Bbox Tricklist_background_expanded.png по альфа-каналу:
     left=1.85% top=1.67% width=96.3% height=98.33% — почти весь канвас. */
  #tricklistPanel {
    position: absolute;
    inset: 0;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #tricklistPanel.expanded {
    opacity: 1;
    pointer-events: auto;
  }

  #tricklistPanel img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* Прокручиваемое содержимое — внутри тёмной области ВНУТРИ рамки картинки
     (граница считана по альфа-каналу: интерьер кончается/рамка начинается
     на ~x=114 из 120 по высоте и ~x=7..155 из 162 по ширине). */
  #tricklistInner {
    position: absolute;
    top: 6%;
    bottom: 8%;
    left: 6%;
    right: 6%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #tricklistInner::-webkit-scrollbar {
    width: 3px;
  }

  /* Раньше был display:flex (иконка слева, текст справа, по центру по
     вертикали) — теперь иконка float:right, чтобы сидеть в верхнем правом
     углу текста, а текст естественно обтекает её снизу/слева (обычное
     поведение float для последующего инлайн-контента в блочном контейнере).
     overflow:hidden — контейнер "схлопывается" вокруг float (иначе если
     текст короче одной строки, а иконка выше строки текста, она бы вылезала
     за нижний край .trick-entry и налезала на следующую запись/разделитель). */
  .trick-entry {
    width: 100%;
    box-sizing: border-box;
    min-width: 0;
    overflow: hidden;
  }

  /* Без иконок — теперь у landed/failed просто текстовый префикс перед
     трюком (см. renderTricklist). font-size задаётся оттуда же через JS
     (RESULT_FONT_BASE), не тут — чтобы гарантированно совпадал с коротким
     текстом в пузыре и не расходился, если тот размер ещё раз поменяют. */
  .trick-entry span.trick-entry-text {
    font-family: 'Press Start 2P', monospace;
    line-height: 1.4;
    color: #d8e8d0;
    word-wrap: break-word;
    overflow-wrap: break-word;
    min-width: 0;
  }

  .trick-entry-info span.trick-entry-text {
    color: #9fb89a;
  }

  .trick-entry-separator {
    font-family: 'Press Start 2P', monospace;
    color: #5a6f57;
    line-height: 1.4;
    clear: both;
  }

  /* ==== Кнопки: невидимый button (реальная кликабельная зона по альфа-каналу
     соответствующей картинки) + соседний слой с самой картинкой — тот же
     приём с двумя слоями, что и в основной версии. Скрыты по умолчанию,
     показываются только через класс .visible (см. JS) — специально не
     полагаемся на пустую инлайн-строку в display, чтобы не словить тот же
     баг, что был в основной версии (см. историю правок). ==== */
  .btn, .btn-visual {
    display: none;
  }

  .btn.visible, .btn-visual.visible {
    display: block;
  }

  .btn {
    position: absolute;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 4;
  }

  .btn-visual {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    transition: opacity 0.08s ease;
  }

  /* Забытая раньше пара к ".layer img" выше — без нее картинки кнопок
     рендерились в своём natural-размере (162x197 исходника) вместо
     растягивания на весь .device, поэтому выглядели не такого размера, как
     фон/тренер/пузырь. */
  .btn-visual img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .btn:active + .btn-visual {
    opacity: 0.8;
  }

  #btnStart, #btnLanded, #btnFailed {
    top: 62.5%;
    height: 35%;
  }

  #btnStart {
    left: 1.85%;
    width: 96.3%;
  }

  #btnLanded {
    left: 1.85%;
    width: 46.91%;
  }

  #btnFailed {
    left: 51.23%;
    width: 46.91%;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="device">
      <div class="layer" style="z-index: 0;">
        <img src="images/compact%20mode/Background_0.png" alt="">
      </div>
      <div class="layer" style="z-index: 2;">
        <img src="images/compact%20mode/Animation_coach.png" alt="">
      </div>
      <div class="layer" style="z-index: 2;">
        <img id="lettersImg" src="images/compact%20mode/Letters_null.png" alt="SKATE">
      </div>
      <div id="bubbleLayer" class="layer">
        <img src="images/compact%20mode/Text_bubble.png" alt="">
      </div>
      <div id="result"><span id="resultText"></span></div>

      <!-- Клик по пузырю (не отдельная кнопка, как в основной версии) —
           открывает/закрывает лог трюков. Зона кликабельности — bbox самого
           Text_bubble.png (см. вычисленный alpha-bbox), поверх текста и
           фона пузыря (у обоих pointer-events:none). -->
      <button id="bubbleToggle" aria-label="Показать лог трюков"></button>

      <div id="tricklistPanel">
        <img src="images/compact%20mode/Tricklist_background_expanded.png" alt="">
        <div id="tricklistInner"></div>
      </div>

      <button id="btnStart" class="btn" aria-label="Start Game"></button>
      <div id="btnStartVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_startgame.png" alt="">
      </div>

      <button id="btnLanded" class="btn" aria-label="Landed"></button>
      <div id="btnLandedVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_landed.png" alt="">
      </div>

      <button id="btnFailed" class="btn" aria-label="Failed"></button>
      <div id="btnFailedVisual" class="btn-visual">
        <img src="images/compact%20mode/Button_failed.png" alt="">
      </div>
    </div>
  </div>

<script>
  // ==== GoSkateBot — Compact mode ====
  // Единственный зашитый режим: Single / Classic / Ramp / Easy / без Air
  // Tricks — тот же trick-лист, что использует основная версия для этой
  // комбинации (Rampmode_tricks_easy.txt), но независимая логика: этот файл
  // не переиспользует код index.html и не делит с ним ни один ключ
  // localStorage (свой префикс ниже) — можно играть в обе версии параллельно,
  // не мешая друг другу.
  //
  // Что сознательно урезано по сравнению с основной версией (нет ни готовых
  // картинок, ни явного запроса на это): звук, лог трюков, видимый прогресс
  // по буквам SKATE (сам счётчик ошибок внутри есть и доводит до Game Over
  // на 15-й, как в Easy основной версии — просто не отрисован, картинки под
  // буквы не присылали), кнопка Info/повтор при обрыве связи (переиспользует
  // Start Game — см. rollTrick).
  (function () {
    const TRICK_LIST_PATH = 'data/Rampmode_tricks_easy.txt';
    // Порог синхронизирован с буквами (см. LETTERS_STAGES ниже: 1 провал =
    // 1 буква) — собралось всё слово SKATE (5 провалов) — Game Over, как в
    // основной версии, а не 15 (было бы игнорированием уже собранного слова).
    const GAME_OVER_FAILS = 5;
    const HISTORY_SIZE = 30;
    const MAX_UNIQUE_ATTEMPTS = 30;
    const TYPEWRITER_MS_PER_CHAR = 28;

    // Один размер шрифта (RESULT_FONT_BASE) для любого текста, короткого или
    // длинного — печатается посимвольно этим же размером, а нужна ли после
    // печати бегущая строка, решается по факту (см. typeText ниже).
    const RESULT_FONT_BASE = 34;

    // По просьбе — никакого сохранения между перезагрузками страницы: каждое
    // открытие компактной версии начинается с чистого листа (в отличие от
    // основной версии, где прогресс восстанавливается). Раньше здесь был
    // localStorage-слой (goskate_compact_*) — специально убран целиком, а не
    // просто отключено чтение: раз ничего не сохраняем, нечего было бы и
    // писать.
    let recentResults = [];
    let failedCount = 0;
    let isGameOver = false;
    let currentTrick = ''; // текущий трюк, который сейчас на экране — нужен для лога при Landed/Failed
    let tricklistEntries = []; // [{text, status}], новые в начале, статус: 'landed'/'failed'/'info'
    let logExpanded = false;

    let tricks = [];
    let dataLoaded = false;
    let typewriterTimer = null;

    const bubbleLayerEl = document.getElementById('bubbleLayer');
    const resultEl = document.getElementById('result');
    const resultTextEl = document.getElementById('resultText');
    const lettersImgEl = document.getElementById('lettersImg');
    const bubbleToggleEl = document.getElementById('bubbleToggle');
    const tricklistPanelEl = document.getElementById('tricklistPanel');
    const tricklistInnerEl = document.getElementById('tricklistInner');
    const btnStartEl = document.getElementById('btnStart');
    const btnStartVisualEl = document.getElementById('btnStartVisual');
    const btnLandedEl = document.getElementById('btnLanded');
    const btnLandedVisualEl = document.getElementById('btnLandedVisual');
    const btnFailedEl = document.getElementById('btnFailed');
    const btnFailedVisualEl = document.getElementById('btnFailedVisual');

    // Буквы SKATE — в стиле Hard мода основной версии: 1 провал = 1 буква
    // (в отличие от Easy там, где буквы растянуты на все 15 попыток) — просили
    // именно так, хотя общий порог Game Over в компактной версии остаётся
    // 15 (см. GAME_OVER_FAILS выше), не 5, как было бы у настоящего Hard.
    // После 5 провалов слово уже полностью "SKATE" и дальше не меняется —
    // сама Game Over логика продолжает считать до GAME_OVER_FAILS отдельно.
    const LETTERS_STAGES = ['null', 's', 'sk', 'ska', 'skat', 'skate'];
    function syncLetters() {
      const stage = LETTERS_STAGES[Math.min(failedCount, LETTERS_STAGES.length - 1)];
      lettersImgEl.src = 'images/compact%20mode/Letters_' + stage + '.png';
    }

    // Лог трюков — открывается кликом по пузырю (см. bubbleToggleEl), не
    // отдельной кнопкой, как в основной версии. Записи держим только в
    // памяти (тот же принцип "никакой persistence", что и у остального
    // состояния компактной версии) — сбрасываются в startNewGame().
    function addTricklistEntry(text, status) {
      tricklistEntries.unshift({ text, status }); // новая запись — наверх списка
      if (logExpanded) renderTricklist();
    }

    function renderTricklist() {
      tricklistInnerEl.innerHTML = '';
      tricklistEntries.forEach((entry) => {
        const row = document.createElement('div');
        row.className = 'trick-entry' + (entry.status === 'info' ? ' trick-entry-info' : '');

        if (entry.status !== 'info') {
          const icon = document.createElement('img');
          icon.className = 'trick-entry-icon';
          icon.src = 'images/' + (entry.status === 'landed' ? 'Icon_landed.png' : 'Icon_failed.png');
          icon.alt = entry.status === 'landed' ? 'Landed' : 'Failed';
          // Инлайн-стиль, а не только CSS-класс — раньше тут словили баг:
          // #tricklistPanel img (фон самой панели) — тоже правило на <img>,
          // но с ID в селекторе, у которого специфичность выше простого
          // класса, и оно побеждало, растягивая иконку на 100% ширины
          // строки. Инлайн-стиль всегда выигрывает у любого правила в
          // <style>, независимо от специфичности — так этот баг не может
          // повториться, что бы ни поменялось в остальном CSS. float:right —
          // тут же, инлайном, чтобы верхний правый угол текста был ровно там,
          // где просили, без отдельного CSS-правила, с которым это опять
          // могло бы разъехаться.
          icon.style.width = RESULT_FONT_BASE + 'px';
          icon.style.height = RESULT_FONT_BASE + 'px';
          icon.style.float = 'right';
          icon.style.marginLeft = '6px';
          row.appendChild(icon);
        }

        const span = document.createElement('span');
        span.className = 'trick-entry-text';
        span.textContent = entry.text;
        span.style.fontSize = RESULT_FONT_BASE + 'px';

        row.appendChild(span);
        tricklistInnerEl.appendChild(row);

        // Разделитель между записями — прямо следующей строкой после каждой,
        // включая info-сообщения (старт режима, Game over), для единообразия.
        const separator = document.createElement('div');
        separator.className = 'trick-entry-separator';
        separator.textContent = '----------';
        separator.style.fontSize = RESULT_FONT_BASE + 'px';
        tricklistInnerEl.appendChild(separator);

      });
    }

    function setLogExpanded(expanded) {
      logExpanded = expanded;
      tricklistPanelEl.classList.toggle('expanded', expanded);
      bubbleToggleEl.setAttribute('aria-label', expanded ? 'Скрыть лог трюков' : 'Показать лог трюков');
      if (expanded) renderTricklist();
    }

    bubbleToggleEl.addEventListener('click', () => {
      setLogExpanded(!logExpanded);
    });

    // Сама панель, когда открыта, накрывает собой весь канвас (z-index выше,
    // чем у #bubbleToggle) — иначе повторный клик по пузырю не доходил бы
    // до него, чтобы закрыть лог. Поэтому клик по самой панели тоже закрывает
    // её — как тап "в пустоту" поверх модалки.
    tricklistPanelEl.addEventListener('click', () => {
      if (logExpanded) setLogExpanded(false);
    });

    function setStartVisible(visible) {
      btnStartEl.classList.toggle('visible', visible);
      btnStartVisualEl.classList.toggle('visible', visible);
    }

    function setJudgeVisible(visible) {
      btnLandedEl.classList.toggle('visible', visible);
      btnLandedVisualEl.classList.toggle('visible', visible);
      btnFailedEl.classList.toggle('visible', visible);
      btnFailedVisualEl.classList.toggle('visible', visible);
    }

    function showBubble() {
      bubbleLayerEl.classList.add('active');
      resultEl.classList.add('active');
    }

    function hideBubble() {
      bubbleLayerEl.classList.remove('active');
      resultEl.classList.remove('active');
      resultEl.classList.remove('scrolling');
      resultTextEl.style.animation = '';
      resultTextEl.textContent = '';
    }

    // Одна строка всегда: и короткий, и длинный текст печатаются посимвольно,
    // по центру, ОДИНАКОВО быстро (TYPEWRITER_MS_PER_CHAR) — никакого деления
    // на "короткий/длинный" ДО того, как текст реально напечатан: нужна ли
    // вообще бегущая строка, решается уже ПОСЛЕ печати, по факту реального
    // замера (resultTextEl.scrollWidth > resultEl.clientWidth — помещается
    // ли напечатанное в видимую ширину бокса на ЭТОМ конкретном экране), а не
    // по заранее угаданному количеству символов. Раньше был порог в символах
    // (SCROLL_THRESHOLD) — но на реальном экране часов он то и дело оказывался
    // неточным (то слишком строгим, то пропускал реально не влезающий текст).
    // Замер вместо угадывания решает это раз и навсегда, для любого экрана и
    // шрифта. Если не влезло — переключаемся на бегущую строку ТЕМ ЖЕ
    // размером шрифта, что и обычный текст (RESULT_FONT_BASE) — отдельный
    // (уменьшенный) размер для скролла тоже был не нужен: бегущей строке всё
    // равно, насколько текст шире бокса.
    const SCROLL_MIN_SECONDS = 4;
    const SCROLL_SECONDS_PER_CHAR = 0.3;
    // Отступ между концом одного повтора и началом следующего — "10 символов"
    // по просьбе, тут это буквально 10 неразрывных пробелов (обычные пробелы
    // схлопнулись бы в один при white-space:nowrap).
    const SCROLL_GAP = '\u00A0'.repeat(10);

    function typeText(text, onComplete) {
      if (typewriterTimer !== null) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
      }
      resultEl.classList.remove('scrolling');
      resultTextEl.style.animation = '';
      resultTextEl.textContent = '';
      resultTextEl.style.fontSize = RESULT_FONT_BASE + 'px';

      if (!text) {
        if (onComplete) onComplete();
        return;
      }

      let i = 0;
      typewriterTimer = setInterval(() => {
        i++;
        resultTextEl.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
          // Замер РЕАЛЬНОГО переполнения — только тут, когда весь текст уже
          // напечатан целиком тем же шрифтом, каким он и останется, будь то
          // статично или бегущей строкой.
          if (resultTextEl.scrollWidth > resultEl.clientWidth) {
            // Строка задваивается с отступом (см. CSS-анимацию до -50%, а не
            // -100%, — комментарий там) — именно это даёт бесконечную ленту
            // без паузы, а не "въехал одной копией — пусто — въехал заново".
            resultTextEl.textContent = text + SCROLL_GAP + text + SCROLL_GAP;
            resultEl.classList.add('scrolling');
            const cycleLength = text.length + SCROLL_GAP.length;
            const duration = Math.max(SCROLL_MIN_SECONDS, cycleLength * SCROLL_SECONDS_PER_CHAR);
            resultTextEl.style.animationDuration = duration + 's';
          }
          if (onComplete) onComplete();
        }
      }, TYPEWRITER_MS_PER_CHAR);
    }


    function parseTrickList(text) {
      return text.split('\n').map((line) => line.trim()).filter(Boolean);
    }

    async function ensureTricksLoaded() {
      if (dataLoaded) return;
      try {
        const res = await fetch(TRICK_LIST_PATH);
        tricks = parseTrickList(await res.text());
        dataLoaded = tricks.length > 0;
      } catch (e) {
        dataLoaded = false;
      }
    }

    // Тот же фильтр от повторов, что и в основной версии (generateUniqueTrick):
    // не даём последним HISTORY_SIZE трюкам повториться подряд, пока не
    // исчерпаны разумные попытки подобрать что-то новое.
    function generateUniqueTrick() {
      if (tricks.length === 0) return '';
      let result;
      let attempts = 0;
      do {
        result = tricks[Math.floor(Math.random() * tricks.length)];
        attempts++;
      } while (recentResults.includes(result) && attempts < MAX_UNIQUE_ATTEMPTS && tricks.length > 1);

      recentResults.push(result);
      if (recentResults.length > HISTORY_SIZE) recentResults.shift();
      return result;
    }

    function triggerGameOver() {
      isGameOver = true;
      addTricklistEntry('Game over!', 'info');
      hideBubble();
      setJudgeVisible(false);
      setTimeout(() => {
        showBubble();
        typeText('Game over!', () => {
          setStartVisible(true);
        });
      }, 120);
    }

    // Один трюк — генерация, печать, показ Landed/Failed после того, как
    // текст допечатался (та же логика видимости, что у классического
    // single-режима основной версии: Roll -> печать -> кнопки оценки).
    async function rollTrick() {
      hideBubble();
      setJudgeVisible(false);

      await ensureTricksLoaded();
      if (!dataLoaded) {
        // Отдельной картинки "Retry" под обрыв связи не прислали — в
        // компактной версии для этого переиспользуется Start Game.
        setTimeout(() => {
          showBubble();
          typeText('Connection problem, try again', () => {
            setStartVisible(true);
          });
        }, 120);
        return;
      }

      setTimeout(() => {
        showBubble();
        const trick = generateUniqueTrick();
        currentTrick = trick;
        typeText(trick, () => {
          setJudgeVisible(true);
        });
      }, 120);
    }

    function startNewGame() {
      failedCount = 0;
      isGameOver = false;
      recentResults = [];
      tricklistEntries = [];
      addTricklistEntry('Easy Ramp mode starts', 'info');
      syncLetters();
      setStartVisible(false);
      rollTrick();
    }

    btnStartEl.addEventListener('click', () => {
      startNewGame();
    });

    btnLandedEl.addEventListener('click', () => {
      if (isGameOver) return;
      addTricklistEntry(currentTrick, 'landed');
      rollTrick();
    });

    btnFailedEl.addEventListener('click', () => {
      if (isGameOver) return;
      addTricklistEntry(currentTrick, 'failed');
      failedCount++;
      syncLetters();
      if (failedCount >= GAME_OVER_FAILS) {
        triggerGameOver();
        return;
      }
      rollTrick();
    });

    // ==== Открытие страницы — всегда чистый старт (между перезагрузками
    // ничего не сохраняется, см. объявление failedCount/isGameOver выше).
    // Пузырь сразу показывает приветственное сообщение с инструкцией —
    // typeText() сам решит по факту замера, нужна ли тут бегущая строка. ====
    syncLetters();
    typeText('Game starts in Easy Ramp mode without Air Tricks');
    showBubble();
    setStartVisible(true);
  })();
</script>
</body>
</html>
